    spec: >
      A push-device registry slice was just added to the notifications context
      (packages/api/typescript). Verify ALL of:
      (a) DI-REG — src/notifications/registry.ts binds PushDeviceRepository in
      ALL THREE environment arrays with the sibling { token, instance } shape:
      mock resolves MockPushDeviceRepository, integration AND real resolve
      DrizzlePushDeviceRepository; nothing else registers the repository (no
      shared/registry.ts edits — notifications is already aggregated; no
      registerInstance calls in src or tests); the abstract PushDeviceRepository
      class is the DI token everywhere — the use case constructor and the tests
      depend on it, never on the Mock/Drizzle concretes.
      (b) TEST-MODE placement — PushDevice.test.ts is a pure unit spec (direct
      instantiation, no TestBed, no DI container); DrizzlePushDeviceRepository.test.ts
      and RegisterPushDevice.test.ts boot TestBed.create('integration', ...) ONCE
      per suite on a child container in beforeAll, with beforeEach(testBed.reset())
      and afterAll(testBed.destroy()), and resolve the repository/use case via
      testBed.resolve. Prerequisite state is built via given helpers only: the
      FK-satisfying user rows come from givenUser/givenUserWithAccount (directly
      or inside givenPushDevice), pre-existing devices come from givenPushDevice,
      and givenPushDevice itself persists through PushDeviceRepository — the
      use-case test NEVER builds fixture state by calling RegisterPushDevice (or
      any other use case) before the scenario's single action under test.
      (c) Use-case test scope — RegisterPushDevice.test.ts covers orchestration
      only: first registration persists (read back through the resolved
      PushDeviceRepository), same-user re-register is idempotent (refreshes
      liveness, no duplicate row/entity), different-user conflict rejects with
      name 'PUSH_TOKEN_ALREADY_REGISTERED' via expect(...).rejects.toMatchObject;
      there is NO re-testing of entity-level validation (empty token, bad
      platform, VALIDATION_ERROR cases) at use-case level — those invariants
      live in PushDevice.test.ts.
      (d) Repository canon — the abstract class extends Repository<PushDevice>
      and only adds finder signatures (optional tx param, Promise<... |
      undefined>, no save/delete redeclarations); DrizzlePushDeviceRepository is
      @injectable with DrizzleClient constructor injection, wraps queries in
      tryCatchAsync, uses tx ?? this.db, maps rows via toDomain passing raw
      primitives into new PushDevice (never PushDevice.create), maps out via
      toPersistence, and save calls entity.incrementVersion() then
      insert().values().onConflictDoUpdate; MockPushDeviceRepository is a real
      in-memory implementation whose semantics match (including the
      token-uniqueness lookup).
      (e) Use case + error vocabulary — RegisterPushDevice extends Handler with
      exported Input/Output schemas (input keeps wire primitives: z.uuid() for
      userId, z.enum(FcmPlatform) for platform — no z.instance in the input), a
      snake_case readonly name, all DB work inside withTransaction with tx
      passed to EVERY repository call including the findByPushToken pre-check;
      the idempotent branch mutates through an entity behavior method (no
      property assignment in the use case); the conflict throws BaseError typed
      with the context error union, and 'PUSH_TOKEN_ALREADY_REGISTERED' is added
      to the notifications errors/index.ts union AND registered in
      registerErrorCodes mapped to CONFLICT.
      Scope notes — legitimate exceptions, do NOT fail these: the
      notifications.push_devices table has NO version/created_at/updated_at
      columns (legacy shape, intentionally unmigrated), so the Drizzle save
      omitting version/updatedAt from the onConflictDoUpdate set and toDomain
      not passing audit fields is the EXPECTED shape — incrementVersion() being
      called without a persisted version column is correct here, not a bug.
      The Drizzle repository test MAY construct PushDevice.create(...) inline
      for the aggregate under test and MAY resolve DrizzleClient — both are
      sanctioned for Drizzle*Repository.test.ts files. The use-case test calling
      useCase.execute() as the action under test (once per scenario) is the
      point of the test, not a fixture violation. Reusing the FcmPlatform wire
      enum for the platform field is the prescribed shape — do not fail naming
      consistency over the 'Fcm' prefix. A domain event in RegisterPushDevice
      is OPTIONAL: absence is fine, and if present it must be persisted via
      this.domainEventRepository.save(event, tx) (only direct mediator
      publishing fails). Any ownerId string passed to TestBed.create is fine.
      Judge the idiom, not variable names — local aliases (repo vs repository
      vs deviceRepo) are fine. Inspect the new files under
      src/notifications/{entities,repositories/PushDeviceRepository,usecases}
      plus src/notifications/registry.ts, src/notifications/errors/index.ts,
      the touched barrels, and tests/support/given/{notifications.ts,index.ts}.
      Pre-existing notifications artifacts (Notification*, SendNotification,
      MarkNotificationRead, PushDeliveryService) and the identity FCM slice are
      out of scope.
notes: >-
  Synthetic probe authored from grounded HEAD facts — first agent probe of the
  DI-REG + TEST-MODE axes (PROBES-BACKLOG P2 row "synthetic-be-di-test-mode";
  numbered #7 counting continuously across the P1+P2 tables). No gold tree,
  agent mode only. Grounded reality at HEAD: notifications.push_devices exists
  in packages/contracts/db/schema/notifications.ts and is migrated since
  0000_ordinary_husk.sql (so PGlite integration tests see it with NO new
  migration), has a UNIQUE push_token, a user_id FK onto auth users (text id;
  user ids are uuid strings — MarkNotificationRead types userId z.uuid()), and
  ZERO consumers in packages/api/typescript (only pushLog is consumed, by
  LogPushDeliveryService). The probe deliberately keeps the table's legacy
  shape (no version/created_at/updated_at columns) and forbids contracts
  edits — the REPOI-05 "persist version in the upsert set" expectation cannot
  apply, which is why the judge carries an explicit scope note; the
  deterministic graders pin incrementVersion() + onConflictDoUpdate only.
  Identity's FCM slice (FcmRegistrationToken / RegisterFcmToken /
  givenFcmRegistrationToken) is the close-cousin exemplar the prompt points
  at; the probe's behavior diverges on purpose (cross-user token conflict →
  named error PUSH_TOKEN_ALREADY_REGISTERED, where RegisterFcmToken silently
  touches) so the slice cannot be landed by pure copy-paste and the use-case
  test gets a real orchestration error to assert. givenUser is NOT grepped in
  the test FILES because the conflict scenario needs no second persisted user
  (the use case throws before any insert) and the happy path may reuse the
  userId returned by givenPushDevice — instead the prompt pins (and the grader
  greps) that givenPushDevice defaults its owning user via the existing user
  helpers, mirroring givenFcmRegistrationToken; the repo test grep accepts
  given(User|PushDevice). Free real estate verified at authoring time:
  grep for PushDevice / RegisterPushDevice / givenPushDevice /
  PUSH_TOKEN_ALREADY_REGISTERED / findByPushToken / register_push_device hits
  NOTHING under packages/ (node_modules excluded);
  tests/support/given/notifications.ts does not exist; every grep-must is 0 at
  HEAD and every must-not over existing files (registry.ts env arrays,
  errors/index.ts, barrels, given/index.ts) passes. Gates green at HEAD:
  tsc backend (tsconfig.build.json) clean; bun test src/notifications = 29
  pass / 5 files; bun test tests/support = 12 pass / 6 files; registry-scan
  and import-direction exit 0. The two test-green specs exist at HEAD
  (regression guard) and — being directory filters — also pick up the agent's
  new colocated specs post-build, which is intentional: new tests are graded
  by file-exists + idiom greps + these suite gates. Discriminating questions:
  a naive build binds Drizzle into all three envs (or skips the mock binding),
  hand-registers infra or constructs new Mock/Drizzle repos inside tests,
  boots TestBed.create('mock') for use-case/repo tests, builds the conflict
  pre-state by calling RegisterPushDevice twice, re-tests VALIDATION_ERROR at
  use-case level, asserts errors via try/catch + cast, hardcodes UUID
  literals, mutates lastSeenAt by assignment in the use case, and returns
  null from finders; the canon is mock/integration/real bindings in the
  context registry (CTX-06/BC-P03), child-container TestBed.create
  ('integration') + resolve-never-register (TST-03/04, bp-12), repo-direct
  given helpers (TST-13/bp-09, TST-18 bare API), TST-15 scope discipline,
