id: synthetic-be-di-test-mode
tier: holdout
builder: sonnet
title: PushDevice repository + RegisterPushDevice use case in the notifications
  context (synthetic — probes DI registry wiring across envs + integration-test canon)
sourceSpec: PROBES-BACKLOG.md#7
goldRef: ""
baseRef: ""
prompt: >
  In the template backend (packages/api/typescript), give the notifications
  context a push-device registry. Mobile clients will register the push token
  they obtain from the OS so deliveries can target devices. The table already
  exists and is already migrated: notifications.push_devices in
  packages/contracts/db/schema/notifications.ts — read it FIRST for the exact
  columns (id, user_id FK to the auth users table, platform, push_token
  UNIQUE, device_fingerprint nullable, registered_at, last_seen_at). It has
  zero consumers at HEAD and deliberately keeps its legacy shape — do NOT
  touch packages/contracts (no schema edits, no new migrations); map the
  aggregate onto the columns that exist. This is a backend-only task: no
  controller, no TypeSpec/contracts changes, no SDK regeneration, and leave
  the identity context's FCM artifacts exactly as they are. Build the slice
  the house way: (1) a PushDevice aggregate at
  src/notifications/entities/PushDevice.ts — fields userId, platform (reuse
  the existing FcmPlatform wire enum from
  @codedm/contracts-typescript/wire/enums, IOS/ANDROID/WEB — do not mint a
  new enum and do not widen to string), pushToken (non-empty),
  deviceFingerprint (nullable), registeredAt, lastSeenAt, plus a
  liveness-refresh behavior — with its colocated unit spec
  src/notifications/entities/PushDevice.test.ts covering the invariants;
  (2) a PushDeviceRepository under
  src/notifications/repositories/PushDeviceRepository/ shaped like the
  sibling NotificationDeliveryRepository directory (abstract port +
  Mock + Drizzle implementations + index barrel), including a findByPushToken
  lookup, with the colocated integration spec
  DrizzlePushDeviceRepository.test.ts; (3) a RegisterPushDevice use case at
  src/notifications/usecases/RegisterPushDevice.ts with its colocated
  RegisterPushDevice.test.ts — input: userId (uuid), platform, pushToken,
  optional deviceFingerprint; behavior: an unknown push token creates and
  persists the device; re-registering a token the SAME user already owns is
  idempotent — it refreshes the device's liveness instead of duplicating; a
  token already registered to a DIFFERENT user fails with the named error
  PUSH_TOKEN_ALREADY_REGISTERED mapped to HTTP conflict (product wants
  re-assignment to be an explicit unregister-first flow); (4) wire the new
  repository through the context registry (src/notifications/registry.ts) so
  each environment resolves the implementation the house intends — the
  notifications registry is already aggregated into shared/registry.ts, no
  edits needed there; (5) a givenPushDevice helper in a new
  packages/api/typescript/tests/support/given/notifications.ts, exported
  through the given index, defaulting its owning user via the existing user
  helpers when no userId override is passed (mirror
  givenFcmRegistrationToken) — and use it for the pre-existing-device state
  the use-case scenarios need. Decide what each test layer covers and how
  every piece of test state gets built per the house testing architecture:
  read docs/BACKEND.md (especially "Dependency Injection & Registries" and
  "Testing Quick Reference") and the typescript variants of the repository,
  usecase, entity, errors and test skills under .claude/skills/ before
  writing code, and study the sibling exemplars
  (src/notifications/repositories/NotificationDeliveryRepository/,
  src/identity/entities/FcmRegistrationToken.ts and its colocated spec,
  src/identity/usecases/RegisterFcmToken.ts,
  tests/support/given/identity.ts) for the established shape. Where an
  exemplar and a skill registry disagree, the registry wins. Wire everything
  (barrels included) and finish green: cd packages/api/typescript &&
  bun x tsc -p tsconfig.build.json --noEmit && bun test src/notifications
  tests/support.
axes:
  - DI-REG
  - TEST-MODE
  - ERR-VOCAB
  - SCHEMA-DERIVE
  - ENUM-REPR
  - NAME-CONSISTENCY
  - LAYOUT
