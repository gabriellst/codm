    id: detect#registry-scan-scoped
  - kind: judge
    spec: >
      A Finance cost-source digest projection was just added under
      packages/api/typescript/src/finance/projections/. Verify ALL of:
      (a) PROJECTION SHAPE — CostDigest.ts holds a flat Zod schema with the
      Props type inferred from it, an exported CostDigestProjectionEvent union
      built from the REAL event classes imported from the finance events module
      (a union over wrapper/subclass types defined locally to re-type the
      events is a violation), and a free-record class (no base class, no
      @injectable, no validation, no throws, no domain events) whose
      constructor takes the full props; static create is ONE overloaded method
      (one signature per creating event — OperationalCostCreated and
      WarrantyReserveCreated — plus a single implementation switching on the
      event name) and applyEvent is ONE overloaded method covering every
      mutating event it handles, mutating this.props only.
      (b) PROJECTOR DISPATCH — CostDigestProjector extends
      Projector<CostDigestProjectionEvent> with the generic imported from the
      projection file (no duplicated local union), takes the
      CostDigestProjectionRepository as its ONLY constructor dependency,
      declares readonly events listing all six wire names
      (finance.operational_cost.created/updated/deleted +
      finance.warranty_reserve.created/updated/deleted), and handle() is a
      plain switch on the event name: creation cases call repo.insertIfNew
      with CostDigestProjection.create(event), every mutating case follows
      find -> applyEvent -> save with a SILENT no-op return when the row is
      missing (never a throw), and the default branch enforces exhaustiveness
      by assigning the narrowed event to never.
      (c) ATOMIC DISCIPLINE — the repository exposes the canonical trio (a
      natural-key finder, save, insertIfNew with ON-CONFLICT-DO-NOTHING
      semantics) as one abstract class with Mock + Drizzle implementations;
      NONE of the six digest events is hot-row/bulk/monotonic/conditional/
      cache-mirror, so the expected shape is ZERO atomic mutation ops — if any
      extra write method exists beyond the trio it must carry a written
      comment naming one of the five triggers AND the trigger must plausibly
      hold for this workload; a repo-level UPDATE verb substituting for
      applyEvent on a single-row mutation is a fail.
      (d) ASYNC-INLINE — the projector reaches the outbox via the projectors
      slot of BoundedContext.create in src/finance/index.ts and the
      projections/projectors/index.ts barrel; NO finance use case, controller
      or handler imports or invokes the projector or the projection repository
      (this brief has no read-after-write need, so any inline
      projector.handle(event, tx) call inside a use case is a fail);
      registry.ts binds CostDigestProjectionRepository for all three
      environments (Mock impl for mock, Drizzle impl for integration and real).
      (e) DISCRIMINANT FIX — the event-union narrowing compiles because the
      events got literal instance name types at the source (e.g. a type-only
      declare of the instance name on the six finance event classes, or an
      equivalent fix in the shared base) — NOT via as-casts,
      @ts-expect-error/@ts-ignore, instanceof/if-else chains replacing the
      switch, or wrapper subclasses local to the projection files.
      (f) SUPERSESSION + DELETES — the WarrantyReserveCreated case both
      inserts the new row AND, when previousWarrantyReserveId is non-null,
      transitions the predecessor row so it no longer reads as the active
      reserve; the two Deleted cases mark the row inactive/deleted while
      keeping it (no SQL DELETE of digest rows); the Drizzle table in
      packages/contracts/src/db/sqlite/finance.ts mirrors the projection schema
      field-for-field and a generated migration creates the
      finance.cost_digest table.
      (g) TESTS — CostDigest.test.ts unit-tests the projection by direct
      instantiation (no TestBed, no I/O) covering each create overload and
      each applyEvent transition; CostDigestProjector.test.ts runs in TestBed
      integration mode, drives every subscribed event through
      projector.handle, and proves replay-safety (handling the same event
      twice yields one row / the same final state).
      Scope notes — judge the idiom, not the spelling: the events array
      referencing the event classes' static name constants instead of literal
      strings is canon (the overridden static names ARE the dotted wire
      strings); implementing the supersession transition as an atomic
      conditional repo op is acceptable ONLY with a written trigger
      justification comment — canonical find -> applyEvent -> save needs no
      justification and is the default expectation; a read-only finder or
      list helper on the repository used by tests or by the projector's find
      half is NOT an atomic mutation op — do not flag it; `as` casts on raw
      DB rows inside the Drizzle repository's toDomain/toPersistence mapping
      are the scaffold's established shape — the cast ban in (e) concerns the
      event discriminant and dispatch, not row mapping; the projector being
      invoked as handle(event) without a transaction on the outbox path is
      expected — do not require tx threading everywhere. Inspect the new
      files under src/finance/projections/, the touched
      src/finance/events/*.ts, src/finance/index.ts, src/finance/registry.ts,
      packages/contracts/src/db/sqlite/finance.ts and the newest migration under
      packages/contracts/db/migrations/.
notes: >-
  Synthetic probe authored from grounded HEAD facts — first backend projection/
  projector probe (no projection, projector, or projections/ folder exists
  anywhere under packages/api/typescript/src at HEAD; the Projector base class
  and the BoundedContext projectors slot exist in core and are unused).
  Free real estate verified at authoring time: zero matches repo-wide for
  CostDigest/cost_digest; finance/index.ts has no projectors slot;
  finance/registry.ts has no projection bindings; contracts schema +
  migrations contain no cost_digest; every grep-must is 0 at HEAD and every
  file-exists target is absent. Gates at HEAD: tsc backend green; bun test
  src/finance green (93 tests / 15 files); import-direction --all and
  slice-closure --all exit 0. registry-scan --all is RED at HEAD (5
  unbaselined component#bp-25 findings in the WIP react dashboard/orders/
  products screens), so the standing registry-scan rider is carried by a
  scoped cmd grader running the same engine over the finance slice + contracts
  schema; the file list mirrors isInScope's test/gen/spec/d exclusions because
  explicit file args bypass that filter (passing finance test files explicitly
  surfaces 3 pre-existing repository#bp-02 findings). Unlike detect graders
  (main repo's script + ROOT_OVERRIDE), the cmd runs the graded tree's own
  copy of the detector + rules — identical at the ref under grade, and git
  ls-files -co --exclude-standard inside the detached eval worktree picks up
  the agent's uncommitted new files. Revert to a plain `detect: registry-scan`
  once the tree is clean. Grounded surface facts: the
  six finance events carry dotted wire names ('finance.operational_cost.created'
  etc.) via `static override readonly name ... as const`; created/updated
  events carry the full entity snapshot (entity.toJSON()) plus envelope
  entityId/ownerId; the deleted pair carry only { <aggregate>Id, storeId };
  WarrantyReserveCreatedEvent carries previousWarrantyReserveId (supersession).
  KEY SHARP EDGE, verified empirically with a scratch projector at HEAD:
  BaseEvent types the instance `name` as plain `string`, so the canonical
  `switch (event.name)` + `default: never` DOES NOT NARROW against the real
  event classes as-is; a type-only `declare readonly name: typeof
  <Event>.name` on each event class compiles clean and restores full
  discriminated narrowing + exhaustiveness. The prompt states the obstacle and
  the fix-the-cause rule without prescribing the spelling; the tsc gate + the
  never-assignment must force SOME solution and the cast must-nots + judge (e)
  force it to be clean (wrapper-subclass unions are named as a judge trap).
  Discriminating questions: a naive build writes one projector per event or a
  repo.updateX per event, builds rows inline in insertIfNew, adds atomic
  update/increment ops without a trigger justification, throws on a missing
  row, wires the projection write into a handler or inline into use cases,
  hand-rolls fromXxx factories, hard-deletes digest rows, or casts its way to
  exhaustiveness; the canon is the free-record projection owning overloaded
  create/applyEvent, insertIfNew(Projection.create(event)), find -> applyEvent
  -> save with silent no-op, readonly events + never-exhaustive plain switch,
  async-via-outbox registration through the projectors slot, and zero atomic
  ops because no trigger holds for these six events (the supersession update
  is single-row and non-racy — atomic only with a written justification,
  accepted by the judge). Structural trick in the overload greps: the
  create/applyEvent musts pin TWO different event types in first-parameter
  position, which a single union signature cannot satisfy simultaneously —
  passing both requires >=2 declarations, i.e. real overloads. Glob notes:
  Bun.Glob `**` matches zero segments, so projections/**/*.ts also covers the
  flat files; no braces or parens needed anywhere; the handlers/** and
  controllers/** must-nots match zero files at HEAD (finance has no handlers
  dir) and pass vacuously, which is the intended guard direction. test-green
  src/finance doubles as regression guard and as the gate for the agent's new
  colocated tests (bun test picks them up by path); the new migration is
  applied by the PGlite TestBed via the drizzle journal, so a malformed
  migration fails the suite, not just dev.
