id: synthetic-be-projection-digest
tier: holdout
builder: sonnet
title: Finance cost-source digest projection + projector
  (synthetic — probes projection-mutation canon, async-via-outbox, atomic-op discipline)
sourceSpec: PROBES-BACKLOG.md#3
goldRef: ""
baseRef: ""
prompt: >
  In the template backend (packages/api/typescript), build the missing read-model
  for the Finance cost console: a cost-source digest. Product wants ONE
  denormalized list — one row per cost source per store, covering BOTH recurring
  operational costs and warranty-reserve configurations — that the upcoming
  console screen renders and sorts (most recently changed first) from a single
  table, with no runtime UNIONs over the aggregate tables. The architecture
  review already approved this as a PROJECTION kept fresh from the existing
  finance domain events: do not replace it with a query use case, and do not
  add any HTTP endpoint in this slice (the console query lands later). Read
  docs/BACKEND.md first, then the typescript variants of the projection,
  projector, repository and test skills under .claude/skills/, then the
  EXISTING finance surface: src/finance/events/ (the six events that matter:
  OperationalCostCreated/Updated/Deleted + WarrantyReserveCreated/Updated/
  Deleted — note what each payload carries: the created/updated pairs carry the
  full entity snapshot plus the envelope entityId/ownerId, the deleted pair
  carry only ids), src/finance/entities/, src/finance/registry.ts and
  src/finance/index.ts. Per-occurrence payment status is OUT of scope: the
  digest does not react to OperationalCostStatusOverridden nor to the
  Taxes/Fees/FxRate events. Requirements: a digest row is born when either kind
  of cost source is created; its denormalized display fields refresh when the
  source is updated; deleting a source keeps the row queryable for history
  while clearly marking it inactive (mirror the aggregates' soft-delete
  semantics — never hard-delete digest rows); and when a new warranty reserve
  supersedes an older one (WarrantyReserveCreated carries
  previousWarrantyReserveId), the predecessor's digest row must stop reading as
  the active reserve. You decide the row schema, the natural key, and the
  per-kind field mapping. Freshness: eventual consistency through the outbox is
  acceptable everywhere in this slice — no request needs read-after-write on
  the digest. Create exactly these files:
  packages/api/typescript/src/finance/projections/CostDigest.ts (schema +
  projection class + exported event union),
  packages/api/typescript/src/finance/projections/CostDigestProjectionRepository.ts
  (abstract + Drizzle + Mock),
  packages/api/typescript/src/finance/projections/projectors/CostDigestProjector.ts,
  plus colocated tests
  packages/api/typescript/src/finance/projections/CostDigest.test.ts
  (projection unit test — direct instantiation, every create overload and every
  applyEvent transition, no I/O) and
  packages/api/typescript/src/finance/projections/projectors/CostDigestProjector.test.ts
  (integration via the TestBed harness — every event the projector subscribes
  to, plus proof that handling the same event twice converges on the same row
  state). The scaffolder emits the canonical shapes: bun cli projection finance
  CostDigest and bun cli projector finance CostDigest (docs/CLI.md). Back the
  projection with a finance.cost_digest table: add it to
  packages/contracts/src/db/sqlite/finance.ts and generate the migration with bun
  migrate:create. Wire everything live: DI bindings for all three environments
  in src/finance/registry.ts, the barrels, and the projector registered through
  src/finance/index.ts so the outbox actually dispatches it. One known sharp
  edge, stated so you fix it at the source: BaseEvent types the instance `name`
  as plain `string`, so an exhaustive switch over the event union will NOT
  narrow as-is — make the discriminant literal at the type level where it
  belongs (a type-only change; the dotted wire names like
  'finance.operational_cost.created' are already the events' static names) and
  never with casts, @ts-expect-error/@ts-ignore, or parallel wrapper types.
  This is a backend-only task: do not touch packages/app/*, do not regenerate
  the SDK, and do not modify finance use cases or controllers. Finish with
  green gates: cd packages/api/typescript && bun x tsc -p tsconfig.build.json
  --noEmit && bun test src/finance.
axes:
  - PROJECTION-MUTATION
  - ASYNC-INLINE
  - CLASS-BASE
  - SCHEMA-DERIVE
  - DI-REG
  - TEST-MODE
  - LAYOUT
  - ERR-VOCAB
