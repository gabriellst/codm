id: synthetic-notifications-panel
tier: holdout
builder: sonnet
title: Notifications page with combinable filters, mark-as-read + detail dialog
  (synthetic — probes frontend composition, state placement, mutation idiom)
sourceSpec: hand-authored
goldRef: ""
baseRef: ""
prompt: >
  In the template web app (packages/app/react), build the missing Notifications
  page. The header already shows a small notifications popover; product now
  wants a full page at /app/notifications — create it as the route directory
  src/routes/(app)/notifications/ with an index.tsx, like every existing page.
  The backend surface already exists in the SDK: useListNotifications,
  useMarkNotificationRead and the NotificationCategory enum from
  @codm/client-typescript — read the generated surface under
  packages/client/dist/typescript/src/typescript/{hooks,types} FIRST for the
  exact params and response shapes. This is a frontend-only task: do not touch
  the backend and do not regenerate the SDK. The page shows a paginated list
  of the user's notifications, filterable by category and by an unread-only
  toggle — filters combine, and a filtered view must survive a refresh and be
  shareable with a teammate as-is. Each row shows the notification's title,
  message, category (icon + color treatment + its translated label), creation
  date and read state, with unread rows visually distinct; each row carries a
  mark-as-read action with in-flight feedback. Clicking a row opens a detail
  dialog with the notification's full content. All copy is localized in both
  app languages (add the new keys to src/locales/pt.json and en.json). Decide
  where every piece of UI state lives, how the screen decomposes, who owns the
  data fetching, and how the mutation is wired — all per the house frontend
  architecture: read docs/FRONTEND.md, packages/app/react/CLAUDE.md and the
  react variants of the route/component/form/store skills under
  .claude/skills/ before writing code, and study one existing list route
  (e.g. src/routes/(app)/orders/) for the established shape. Register the
  route (cd packages/app/react && bun x tsr generate) and finish with a green
  type-check: cd packages/app/react && bun x tsc --noEmit.
axes:
  - UI-COMPOSITION
  - STATE-PLACEMENT
  - DATA-OWNERSHIP
  - SDK-CONSUME
  - LOCALE-MONEY
  - DIALOG-OWNERSHIP
  - MUTATION-IDIOM
  - CENTRALIZE-MAPS
  - ENUM-REPR
graders:
  - kind: tsc
    spec: app-react
  - kind: file-exists
    spec: "packages/app/react/src/routes/(app)/notifications/index.tsx"
  - kind: grep-must
    spec: "packages/app/react/src/routes/(app)/notifications/index.tsx::validateSearch"
    id: route#RTE-P02
  - kind: grep-must
    spec: "packages/app/react/src/routes/(app)/notifications/index.tsx::z\\.enum\\([^)]*NotificationCategory|notificationCategorySchema"
    id: enum#typescript
  - kind: grep-must-not
    spec: "packages/app/react/src/routes/(app)/notifications/index.tsx::useListNotifications|useMarkNotificationRead"
    id: route#RTE-01
  - kind: grep-must
    spec: "packages/app/react/src/routes/(app)/notifications/-components/**/*.tsx::\\.useSearch\\("
    id: component#CMP-P01
  - kind: grep-must
    spec: "packages/app/react/src/routes/(app)/notifications/-components/**/*.tsx::useListNotifications"
    id: component#CMP-P01
  - kind: grep-must
    spec: "packages/app/react/src/routes/(app)/notifications/-components/**/*.tsx::(notification|item)\\??\\s*:\\s*(\\w*Notification\\w*|ListNotifications\\w*)"
    id: component#CMP-P05
  - kind: grep-must
    spec: "packages/app/react/src/routes/(app)/notifications/**/*.{ts,tsx}::useDialogStore"
    id: form#FRM-P35
  - kind: grep-must
    spec: "packages/app/react/src/routes/(app)/notifications/**/*.{ts,tsx}::\\bshow\\w*\\(\\s*<"
    id: form#FRM-P35
  - kind: grep-must
    spec: "packages/app/react/src/routes/(app)/notifications/**/*.{ts,tsx}::useMarkNotificationRead"
    id: form#FRM-01
  - kind: grep-must
    spec: "packages/app/react/src/routes/(app)/notifications/**/*.{ts,tsx}::on(Success|Settled)\\s*:"
    id: form#bp-29
  - kind: grep-must
    spec: "packages/app/react/src/routes/(app)/notifications/**/*.{ts,tsx}::invalidateQueries"
    id: form#bp-29
  - kind: grep-must
    spec: "packages/app/react/src/routes/(app)/notifications/**/*.{ts,tsx}::listNotificationsQueryKey"
    id: form#bp-29
  - kind: grep-must
    spec: "packages/app/react/src/routes/(app)/notifications/**/*.{ts,tsx}::Record<[^,>]*NotificationCategory"
    id: component#CMP-P08
  - kind: grep-must
    spec: "packages/app/react/src/routes/(app)/notifications/**/*.{ts,tsx}::enums\\.NotificationCategory"
    id: component#CMP-P07
  - kind: grep-must
    spec: "packages/app/react/src/routes/(app)/notifications/**/*.{ts,tsx}::useLocale"
    id: component#bp-15
  - kind: grep-must
    spec: "packages/app/react/src/locales/en.json::\"NotificationCategory\""
    id: enum#i18n-catalog
  - kind: grep-must
    spec: "packages/app/react/src/locales/pt.json::\"NotificationCategory\""
    id: enum#i18n-catalog
  - kind: grep-must-not
    spec: "packages/app/react/src/routes/(app)/notifications/**/*.{ts,tsx}::\\buseState\\b"
    id: store#STR-P10
  - kind: grep-must-not
    spec: "packages/app/react/src/routes/(app)/notifications/**/*.{ts,tsx}::onError\\s*[:,(]"
    id: form#bp-29
  - kind: grep-must-not
    spec: "packages/app/react/src/routes/(app)/notifications/**/*.{ts,tsx}::try\\s*\\{"
    id: mutation#no-try-catch
  - kind: grep-must-not
    spec: "packages/app/react/src/routes/(app)/notifications/**/*.{ts,tsx}::['\"]pt-BR['\"]|['\"]en-US['\"]|locale:\\s*ptBR"
    id: component#bp-15
  - kind: grep-must-not
    spec: "packages/app/react/src/routes/(app)/notifications/**/*.{ts,tsx}::switch\\s*\\("
    id: component#CMP-P18
  - kind: grep-must-not
    spec: "packages/app/react/src/routes/(app)/notifications/**/*.{ts,tsx}::(?<![\\w$.])fetch\\s*\\(|from\\s+['\"](axios|ky|got|redaxios|superagent)['\"]"
    id: component#bp-21
  - kind: grep-must-not
    spec: "packages/app/react/src/routes/(app)/notifications/**/*.{ts,tsx}::onOpenChange"
    id: form#bp-18
  - kind: detect
    spec: registry-scan
  - kind: detect
    spec: import-direction
  - kind: detect
    spec: component-props
  - kind: judge
    spec: >
      A Notifications page was just added under
      packages/app/react/src/routes/(app)/notifications/. Verify ALL of:
      (a) UI-COMPOSITION — the route index.tsx is a thin shell: the URL
      contract (validateSearch over the filter/page fields, category typed by
      the SDK NotificationCategory enum) plus layout composition only — no SDK
      hook calls, no business JSX; a Section component under -components/ owns
      the single useListNotifications query and maps the rows; row leaves
      receive the notification item via prop and never re-fetch it (a leaf
      owning the mark-as-read mutation is fine); repeated visual regions are
      decomposed into components, not inlined into one mega-component.
      (b) STATE-PLACEMENT — the category filter, unread-only toggle and page
      round-trip through the route search params (read via useSearch, written
      via navigate({ search: prev => ... })) so the filtered view deep-links;
      the clicked notification opens via useDialogStore show(<Dialog
      notification={item} />) and closes via hide() — the selected item is NOT
      mirrored into useState or a bespoke store, and there is ZERO useState
      under the new route dir (no mirroring of server data, mutation pending
      flags, filters, or dialog visibility).
      (c) MUTATION-IDIOM — mark-as-read uses the SDK mutation hook with
      success/settled invalidation of the list query key
      (listNotificationsQueryKey); in-flight feedback comes from the hook's
      own isPending flag; no try/catch around mutate/mutateAsync and no
      onError handler (the global MutationCache owns errors).
      (d) CENTRALIZE-MAPS + ENUM-REPR — category icon/color/variant resolve
      through a module-level Record keyed by the SDK NotificationCategory
      enum (no switch or if/else chain on category anywhere); human-readable
      category labels come from the i18n enums.NotificationCategory.* subtree
      with keys present in BOTH src/locales/pt.json and en.json — no
      hardcoded label strings in code.
      (e) LOCALE — the creation date renders with the active locale from
      useLocale() (toLocaleDateString(locale) or Intl bound to it) — never a
      hardcoded 'pt-BR'/'en-US'.
      Scope notes: ListNotifications takes NO category param on the wire —
      client-side category filtering over the fetched page is the EXPECTED
      shape; do not fail it for not sending the filter to the API. Local
      aliases of the dialog store actions (e.g. const showDialog = ...show)
      are fine — judge the idiom, not the variable name.
      Inspect the new files under src/routes/(app)/notifications/ plus
      src/locales/pt.json and en.json. The pre-existing Header notifications
      popover (src/components/Header/) is out of scope.
notes: >-
  Synthetic probe authored by the orchestrating session — first agent test of
  the frontend axes. No gold tree; agent mode only, built from HEAD. Free real
  estate verified at authoring time: no notifications route exists, nothing
  consumes useListNotifications/useMarkNotificationRead (the Header popover
  receives items via props), and src/locales/*.json contain no
  "NotificationCategory" keys — so every grep-must is 0 at HEAD and the probe
  measures only new work; both detect graders and tsc app-react are green at
  HEAD. The discriminating questions: a naive implementation holds filters +
  selected notification in useState, opens the dialog with open/onOpenChange
  props, wraps mutateAsync in try/catch with an onError toast, and
  switch-es on category for icons/labels; the house canon is URL search params
  (validateSearch + z.enum over the SDK enum), useDialogStore.show(<Dialog
  item />), hook-owned pending + queryKey invalidation, and a module-level
  Record map + i18n enums.* labels. ListNotifications takes no category param
  on the wire — client-side category filtering over the fetched page is the
  expected shape. Glob notes: Bun.Glob treats the literal "(app)" segment
  fine and supports filename braces (*.{ts,tsx}), but NOT a "/" inside a
  brace branch — hence the dir-convention route path is pinned in the prompt.
  The dir-wide useState ban assumes no *.stories.tsx is added (none is asked
  for); a story with useState in a decorator would trip store#STR-P10.
