    id: form#FRM-P44
  - kind: grep-must
    spec: packages/app/react/src/routes/(app)/settings/integrations/-components/ConnectIntegrationSheet/platforms/index.ts::CONNECT_FORMS
    id: component#CMP-P18
  - kind: grep-must
    spec: packages/app/react/src/routes/(app)/settings/integrations/-components/ConnectIntegrationSheet/platforms/**/*::connectIntegrationMutationRequestSchema
    id: form#FRM-P43
  - kind: grep-must
    spec: packages/app/react/src/routes/(app)/settings/integrations/-components/ConnectIntegrationSheet/**/*::pickUnionVariant
  - kind: grep-must-not
    spec: packages/app/react/src/routes/(app)/settings/integrations/-components/ConnectIntegrationSheet/**/*::as
      (never|any|unknown)
    id: form#bp-31
  - kind: grep-must-not
    spec: packages/app/react/src/routes/(app)/settings/integrations/-components/ConnectIntegrationSheet/**/*::\bfetch\(
notes: "Replays Decision 1 (union-as-whole-body, shape b) of the ADR.
  Implementing commit 4a66d3286 added union.ts + 17 platform folders +
  CONNECT_FORMS + useOauth and slimmed the sheet; goldRef f3175d431 (next
  commit, adds the ADR itself). baseRef 8a25cb7c6 verified: sheet exists in the
  flattened anti-pattern form (hand-rolled credentialsSchema + two `as never`
  casts) and the SDK already exports connectIntegrationMutationRequestSchema as
  a z.union — exactly the refactor start state. Gold verified: zero widening
  casts in ConnectIntegrationSheet/**, CONNECT_FORMS map,
  pickUnionVariant/pickUnionVariantField used in variant forms, no fetch(.
  app-react tsc verified green on the current tree, whose app code is identical
  to f3175d431 (only docs/skills/scripts commits after). All file paths in
  prompt/graders are named by the ADR itself. Base and gold are 'feat: wip'
  commits — slightly elevated risk the base tree has unrelated rough edges, but
  the union refactor slice is cleanly bounded."
