id: synthetic-expo-notifications-screen
timeoutMs: 3600000
tier: holdout
builder: sonnet
title: Mobile notifications tab + deep-linkable detail sheet
  (synthetic — probes expo nav-modal, state placement, mutation idiom, locale)
sourceSpec: hand-authored
goldRef: ""
baseRef: ""
prompt: >
  In the template mobile app (packages/app/expo), build the missing
  Notifications screen. Product wants notifications on the phone as a new
  tab: create the route directory app/(tabs)/notifications/ (with
  _layout.tsx + index.tsx like the existing tabs) and register its trigger
  in app/(tabs)/_layout.tsx. The backend surface already exists in the SDK:
  useListNotifications, useMarkNotificationRead, listNotificationsQueryKey
  and the NotificationCategory enum from
  @template/client-typescript/typescript — read the generated surface under
  packages/client/dist/typescript/src/typescript/{hooks,types} FIRST for
  the exact params and response shapes; note the list endpoint takes NO
  category param on the wire (category filtering is client-side over the
  fetched page) and there is NO single-notification GET endpoint. This is a
  frontend-only task: do not touch the backend and do not regenerate the
  SDK. The screen lists the user's notifications, filterable by category
  and by an unread-only toggle — filters combine, and a filtered view must
  survive an app relaunch when reopened from a deep link; a deep link
  carrying garbage params must render the defaults, never crash. Each row
  shows the notification's title, message, category (icon + color treatment
  + its translated label), creation date and read state, with unread rows
  visually distinct; each row carries a mark-as-read action with tactile
  success feedback. Tapping a row opens the notification DETAIL (full
  message + metadata) at app/(sheets)/notification-detail/ — a modal that
  must be deep-linkable: launching the app cold with only the notification
  id in the URL renders the detail with zero prior in-app navigation, so
  decide carefully what crosses the navigation boundary and who fetches
  what. All copy is localized in both app languages (add the new keys to
  locales/pt.json and en.json — @types/i18next.d.ts types t() against
  en.json). Decide where every piece of UI state lives, how the screen
  decomposes, who owns the data fetching, how the modal is presented and
  dismissed, and how the mutation is wired — all per the house mobile
  SCAFFOLD FIRST (binding): the expo CLI exists — run `bun cli route/component/form/sheet
  ...` (scripts/cli/expo/, golden-tested recipes) for every artifact that has a recipe,
  then fill the emitted shape in. For the
  architecture: read packages/app/expo/CLAUDE.md, docs/FRONTEND.md and the
  expo variants of the route/component skills plus the sheet skill
  (.claude/skills/route/expo/, .claude/skills/component/expo/,
  .claude/skills/sheet/) before writing
  code, and study the existing exemplars (app/(tabs)/home/,
  app/(sheets)/devices/, app/_layout.tsx) for the established shape. Where
  an exemplar and a skill registry disagree, the registry wins. Finish with
  a green type-check: cd packages/app/expo && bun x tsc --noEmit.
axes:
  - NAV-MODAL
  - STATE-PLACEMENT
  - DATA-OWNERSHIP
  - MUTATION-IDIOM
  - LOCALE-MONEY
  - CENTRALIZE-MAPS
  - LAYOUT
  - SDK-CONSUME
graders:
  - kind: tsc
    spec: app-expo
  # ── structure ──────────────────────────────────────────────────────
  - kind: file-exists
    spec: "packages/app/expo/app/(tabs)/notifications/index.tsx"
  - kind: file-exists
    spec: "packages/app/expo/app/(tabs)/notifications/_layout.tsx"
  - kind: file-exists
    spec: "packages/app/expo/app/(sheets)/notification-detail/index.tsx"
  - kind: file-exists
    spec: "packages/app/expo/app/(tabs)/notifications/-components/*/index.tsx"
  # ── NAV-MODAL ──────────────────────────────────────────────────────
  - kind: grep-must
    spec: "packages/app/expo/app/_layout.tsx::name=\"\\(sheets\\)/notification-detail\"[\\s\\S]{0,600}?presentation:\\s*['\"](pageSheet|formSheet|fullScreenModal)['\"]"
    id: sheet#SHT-03
  - kind: grep-must
    spec: "packages/app/expo/app/(tabs)/_layout.tsx::name=\"notifications\""
    id: atlas#LAYOUT
  - kind: grep-must
    spec: "packages/app/expo/app/(sheets)/notification-detail/**/*.tsx::router\\.(back|dismiss)\\(\\)"
    id: sheet#SHT-P02
  - kind: grep-must
    spec: "packages/app/expo/app/(tabs)/notifications/-components/**/*.{ts,tsx}::\\(sheets\\)/notification-detail"
    id: sheet#SHT-P01
  - kind: grep-must
    spec: "packages/app/expo/app/(sheets)/notification-detail/**/*.{ts,tsx}::useTypedSearchParams\\("
    id: sheet#SHT-P05
  - kind: grep-must
    spec: "packages/app/expo/app/(sheets)/notification-detail/**/*.{ts,tsx}::useListNotifications"
    id: sheet#SHT-P05
  - kind: grep-must
    spec: "packages/app/expo/app/(sheets)/notification-detail/**/*.tsx::<Protected>"
    id: route#bp-05
  - kind: grep-must-not
    spec: "packages/app/expo/app/*/notification*/**/*.{ts,tsx}::from\\s+['\"]@/components/ui/Dialog['\"]"
    id: sheet#bp-04
  - kind: grep-must-not
    spec: "packages/app/expo/app/*/notification*/**/*.{ts,tsx}::useDialogStore|useDrawerStore"
    id: atlas#DIALOG-OWNERSHIP
  - kind: grep-must-not
    spec: "packages/app/expo/app/*/notification*/**/*.{ts,tsx}::from\\s+['\"]zustand['\"]"
    id: route#bp-11
  - kind: grep-must-not
    spec: "packages/app/expo/app/*/notification*/**/*.{ts,tsx}::\\.push\\(\\s*['\"]/sheets/"
    id: sheet#bp-07
  # ── STATE-PLACEMENT ────────────────────────────────────────────────
  - kind: grep-must
    spec: "packages/app/expo/app/(tabs)/notifications/{-components,-hooks}/**/*.{ts,tsx}::useTypedSearchParams\\("
    id: route#RTE-03
  - kind: grep-must
    spec: "packages/app/expo/app/(tabs)/notifications/**/*.{ts,tsx}::\\.default\\("
    id: route#RTE-04
  - kind: grep-must
    spec: "packages/app/expo/app/(sheets)/notification-detail/**/*.{ts,tsx}::\\.default\\("
    id: route#RTE-04
  - kind: grep-must
    spec: "packages/app/expo/app/(tabs)/notifications/**/*.{ts,tsx}::z\\.enum\\([\\s\\S]{0,80}?NotificationCategory|notificationCategorySchema|Object\\.values\\(NotificationCategoryEnum\\)"
    id: enum#typescript
  - kind: grep-must-not
    spec: "packages/app/expo/app/*/notification*/**/*.{ts,tsx}::\\buseState\\b"
    id: component#bp-17
  # ── DATA-OWNERSHIP ─────────────────────────────────────────────────
  - kind: grep-must
    spec: "packages/app/expo/app/(tabs)/notifications/-components/**/*.tsx::useListNotifications"
    id: component#CMP-P01
  - kind: grep-must-not
    spec: "packages/app/expo/app/(tabs)/notifications/index.tsx::useListNotifications|useMarkNotificationRead"
    id: route#RTE-C01
  - kind: grep-must
    spec: "packages/app/expo/app/(tabs)/notifications/-components/**/*.tsx::(notification|item)\\??\\s*:\\s*(\\w*Notification\\w*|ListNotifications\\w*)"
    id: component#CMP-P04
  # ── MUTATION-IDIOM ─────────────────────────────────────────────────
  - kind: grep-must
    spec: "packages/app/expo/app/(tabs)/notifications/-components/**/*.tsx::useMarkNotificationRead"
    id: component#CMP-P06
  - kind: grep-must
    spec: "packages/app/expo/app/(tabs)/notifications/-components/**/*.tsx::Haptics\\.notification\\(\\s*['\"]success['\"]"
    id: component#CMP-P06
  - kind: grep-must
    spec: "packages/app/expo/app/(tabs)/notifications/-components/**/*.tsx::onSettled\\s*:"
    id: component#CMP-P06
  - kind: grep-must
    spec: "packages/app/expo/app/(tabs)/notifications/-components/**/*.tsx::invalidateQueries\\(\\{\\s*queryKey:\\s*listNotificationsQueryKey"
    id: route#bp-07
  - kind: grep-must-not
    spec: "packages/app/expo/app/*/notification*/**/*.{ts,tsx}::onError\\s*:"
    id: atlas#MUTATION-IDIOM
  - kind: grep-must-not
    spec: "packages/app/expo/app/*/notification*/**/*.{ts,tsx}::try\\s*\\{"
    id: atlas#MUTATION-IDIOM
  - kind: grep-must-not
    spec: "packages/app/expo/app/*/notification*/**/*.{ts,tsx}::queryKey:\\s*\\["
    id: route#bp-07
  # ── LOCALE-MONEY (dates on mobile) ─────────────────────────────────
  - kind: grep-must
    spec: "packages/app/expo/app/(tabs)/notifications/-components/**/*.tsx::formatDate\\(|formatRelativeHistoryDate\\(|groupByDay\\("
    id: component#CMP-P13
  - kind: grep-must-not
    spec: "packages/app/expo/app/*/notification*/**/*.{ts,tsx}::['\"]pt-BR['\"]|['\"]en-US['\"]|\\bptBR\\b|\\benUS\\b"
    id: component#CMP-P13
  - kind: grep-must-not
    spec: "packages/app/expo/app/*/notification*/**/*.{ts,tsx}::function\\s+format[A-Z]\\w*\\s*\\(|const\\s+format[A-Z]\\w*\\s*="
    id: component#bp-16
  - kind: grep-must-not
    spec: "packages/app/expo/app/*/notification*/**/*.{ts,tsx}::toLocaleDateString\\(|toLocaleTimeString\\(|Intl\\.DateTimeFormat"
    id: component#CMP-P13
  # ── CENTRALIZE-MAPS ────────────────────────────────────────────────
  - kind: grep-must
    spec: "packages/app/expo/app/**/*.{ts,tsx}::Record<\\s*NotificationCategory"
    id: component#CMP-C03
  - kind: grep-must
    spec: "packages/app/expo/app/(tabs)/notifications/**/*.{ts,tsx}::enums\\.NotificationCategory"
    id: enum#i18n-catalog
  - kind: grep-must
    spec: "packages/app/expo/locales/en.json::\"NotificationCategory\""
    id: enum#i18n-catalog
  - kind: grep-must
    spec: "packages/app/expo/locales/pt.json::\"NotificationCategory\""
    id: enum#i18n-catalog
  - kind: grep-must-not
    spec: "packages/app/expo/app/*/notification*/**/*.{ts,tsx}::switch\\s*\\("
    id: atlas#CENTRALIZE-MAPS
  # ── LAYOUT ─────────────────────────────────────────────────────────
  - kind: grep-must-not
    spec: "packages/app/expo/app/*/notification*/-components/**/*.{ts,tsx}::export\\s+default"
    id: component#bp-18
  - kind: grep-must-not
    spec: "packages/app/expo/app/*/notification*/-components/*.{ts,tsx}::[\\s\\S]*"
    id: component#bp-06
  - kind: grep-must-not
    spec: "packages/app/expo/app/*/notification*/-components/**/_*.{ts,tsx}::[\\s\\S]*"
    id: route#bp-10
  # ── SDK-CONSUME ────────────────────────────────────────────────────
  - kind: grep-must
    spec: "packages/app/expo/app/(tabs)/notifications/-components/**/*.tsx::from\\s+['\"]@template/client-typescript/typescript['\"]"
    id: atlas#SDK-CONSUME
  - kind: grep-must-not
    spec: "packages/app/expo/app/*/notification*/**/*.{ts,tsx}::(?<![\\w$.])fetch\\s*\\(|from\\s+['\"](axios|ky|got|redaxios|superagent)['\"]"
    id: atlas#SDK-CONSUME
  - kind: grep-must
    spec: "packages/app/expo/app/(tabs)/notifications/**/*.tsx::useTranslation\\("
    id: atlas#LOCALE-MONEY
  # ── detectors + judge ──────────────────────────────────────────────
  - kind: detect
    spec: registry-scan
  - kind: detect
    spec: import-direction
  - kind: detect
    spec: route-closure
  - kind: judge
    spec: >
      A mobile Notifications feature was just added under
      packages/app/expo/app/(tabs)/notifications/ and
      packages/app/expo/app/(sheets)/notification-detail/. Verify ALL of:
      (a) NAV-MODAL — the detail modal is the (sheets)/notification-detail
      route registered in app/_layout.tsx via Stack.Screen with an EXPLICIT
      presentation; the dismissal inside the sheet pairs with that
      presentation (router.back() for pageSheet/formSheet, router.dismiss()
      for fullScreenModal); if presentation is fullScreenModal the sheet
      ships an inner _layout.tsx whose Stack sets an explicit headerLeft
      back affordance, if pageSheet/formSheet the inner layout is absent or
      at most a bare <Slot />; the sheet receives AT MOST the notification
      id via typed params and fetches its own data with its own SDK hook
      inside — the subject object is never passed through a store, context,
      or navigation params, and no web Dialog / useDialogStore /
      useDrawerStore pattern was carried over; sheet presentation options
      (presentation, sheet*) live ONLY on the root app/_layout.tsx
      registration, never in the sheet's inner layout.
      (b) STATE-PLACEMENT — the category filter and unread-only toggle
      round-trip through useTypedSearchParams(schema) from @/lib/typed-route
      with EVERY schema field .default()-ed (a garbage deep link renders the
      defaults), the category field typed against the SDK
      NotificationCategory values; writes go through the hook's setParams
      (or router.setParams); there is NO useState and NO Zustand store
      mirroring filters, server data, mutation pending flags, or modal
      visibility anywhere under the two new dirs.
      (c) COMPOSITION/LAYOUT — app/(tabs)/notifications/index.tsx is a thin
      default-exported shell (layout + composition only, no SDK hook calls,
      no business JSX); a Section component under -components/ owns the
      single useListNotifications query, applies the client-side category
      filter, and maps the rows; row leaves receive the notification item
      via prop and never re-fetch it (a row owning its mark-as-read
      mutation is fine); every colocated file lives at
      -components/<Name>/index.tsx with NAMED exports only (no default
      export under -components/ — expo-router registers every file under
      app/); the notifications tab trigger is registered in
      app/(tabs)/_layout.tsx with a localized label; the tab screen is NOT
      wrapped in <Protected> (the (tabs) layout already gates) while the
      (sheets)/notification-detail route IS (it sits outside the gated
      group). Inspect the new files plus app/_layout.tsx,
      app/(tabs)/_layout.tsx and locales/{pt,en}.json. The pre-existing
      dangling registrations at HEAD (the (sheets)/game-form Stack.Screen
      and the games tab trigger with no matching folders) are out of scope.
notes: >-
  ITER8 INSTRUMENT FIXES (2026-06-10): RTE-03 widened to {-components,-hooks} — a
  route-scoped -hooks/ wrapper around useTypedSearchParams consumed by components is the
  house pattern (medscall channel/-hooks), not a violation; CMP-C03 widened to the whole
  expo app tree — iter8 wrote the canonical exhaustive Record<NotificationCategory,
  CategoryStyle> map in the notification-detail sheet folder, outside the old glob. Both
  iter8 'fails' were grader path-scoping, not build defects (48/50 raw ≙ canon-true).

  Synthetic probe authored from grounded HEAD facts — first expo (mobile)
  probe of the frontend axes; no gold tree, agent mode only. Grounded SDK
  reality: the SDK IS wired on mobile (lib/api.ts configureClient via
  @template/client-typescript/http; hooks importable from
  @template/client-typescript/typescript) but NO expo screen consumes a
  product hook yet, and useTypedSearchParams has zero call sites at HEAD —
  every must-grep measures only new work. ListNotifications query params are
  page/limit/search/unreadOnly (unreadOnly is a STRING on the wire, NO
  category param — client-side category filtering is the expected shape,
  stated in the prompt); MarkNotificationRead takes
  { notificationDeliveryIds: string[] }; there is NO GetNotification detail
  endpoint, so SHT-P05 "fetches its own data inside" grounds to the sheet
  running its OWN useListNotifications and deriving its item (React Query
  dedupes with the list screen) — the prompt states the missing endpoint so
  agents don't invent one. Locale canon per component/expo CMP-P13: no
  useLocale/useMoney on mobile; formatDate lives in @/lib/format (i18n
  resolves the locale inside the helper) while @/lib/format-date holds the
  date-fns relative helpers — lib/index.ts re-exports format + typed-route,
  so musts target CALL SITES (formatDate( / useTypedSearchParams(), never
  import paths. i18n is react-i18next with typed keys (@types/i18next.d.ts
  -> typeof en.json); enum labels follow the enum#typescript
  enums.<EnumName>.<VALUE> catalog — locales contain no "NotificationCategory"
  key at HEAD. Discriminating questions: a naive port holds filters in
  useState, builds a Zustand open/close or selected-item store, renders a
  web-style Dialog, passes the notification object into the modal, wraps
  mutateAsync in try/catch with onError, hardcodes ptBR/date wrappers, and
  switch-es on category; the canon is useTypedSearchParams with .default()s
  (RTE-03/04), router-as-modal-state ((sheets) route + root Stack.Screen
  with explicit presentation, SHT-03/bp-02, dismissal paired SHT-P02),
  id-only params + own fetch (SHT-P05), CMP-P06 mutateAsync +
  Haptics.notification('success') + settled invalidation via
  listNotificationsQueryKey, lib formatters, and a module-level
  Record<NotificationCategory,...> + i18n labels. Known tensions, accepted
  deliberately: (1) HEAD's exemplar sheets (devices/edit-profile) do NOT
  self-gate with <Protected>, but route/expo bp-05 requires it for routes
  outside the gated (tabs) group — the prompt says "the registry wins", so
  the Protected must-grep probes registry-over-exemplar obedience; (2) the
  dir-wide useState ban is canon here because the brief's filter UI needs no
  ephemeral overlay (route/expo bp-09 would allow useState for a transient
  Sheet primitive — relax that grep if a variant adds a filter sheet); (3)
  HEAD already carries dangling registrations ((sheets)/game-form
  Stack.Screen + games tab trigger, no folders) proving NAV-MODAL drift —
  they keep tsc green and are excluded from the judge's scope, and the
  sheet-registration must-grep is pinned to the new
  "(sheets)/notification-detail" name so it is 0 at HEAD. Glob notes:
  Bun.Glob treats "(tabs)"/"(sheets)" as literal segments and a single "*"
  segment matches them, so "app/*/notification*/**" spans both new dirs (a
  "/" inside a brace branch is unsupported); "**" matches zero segments so
  "dir/**/*.tsx" includes dir/index.tsx. The
  "-components/*.{ts,tsx}::[\\s\\S]*" must-nots assert file ABSENCE (flat or
  _-prefixed colocated files) — any matching file fails regardless of
  content. Verified at authoring time: tsc app-expo green at HEAD,
  registry-scan + import-direction exit 0 at HEAD, all must-greps 0 at HEAD,
  all regexes compile through parseGrepSpec.
