prompt: >-
  In packages/app/react, build a shared, composable StatCard for the template
  dashboard. The dashboard renders a grid of ~13 stat cards (Lucro, Faturamento,
  Custos Totais, Margem, ROI, Pedidos, Ticket Médio, ...) that share one shape;
  only the highlighted card (Lucro) recolors its whole surface by metric sign.
  StatCard will be reused outside the dashboard, so it is a shared component at
  `@/components/StatCard` (not route-local).


  Requirements:

  - StatCard public API: `icon` (icon component), `label: string`, `value:
  string` (PRE-formatted by the consumer — StatCard never formats money/percent
  itself), `deltaPct?: number` (fraction: 0.52 → +52%; omit to hide), `tone?:
  'default' | 'positive' | 'negative'` (CVA variant recoloring the surface;
  sign-driven, applied by the consumer only on the highlighted card), plus two
  ReactNode slots: `adornment` (label-side: info hint / platform badge / status
  pill) and `actions` (top-right button group). No boolean soup — heterogeneous
  bits are slots.

  - Three NEW design-system primitives under `@/components/ui/`:
  `gradient-icon-badge.tsx` (GradientIconBadge — halo + purple-gradient disc +
  icon, with an `onColor` variant that adapts on a tinted surface via
  currentColor), `metric-delta.tsx` (MetricDelta — trend arrow up/down + signed
  integer percent; sign drives the arrow and the success/destructive token
  color; `onColor` renders text-current), `info-hint.tsx` (InfoHint — (i) icon
  wrapped in the existing Tooltip primitive, accessible aria-label, children =
  translated tooltip text).

  - StatCard is composed ONLY of primitives/atoms (Card, GradientIconBadge,
  MetricDelta + slots) — no color literals anywhere, only design tokens (--card
  / --success / --destructive families).

  - Storybook stories: StatCard stories covering default, positive/negative
  highlighted tones, negative delta, with info hint, with actions, a count
  (non-currency) value, and a grid sample; plus one story for each new primitive
  under `src/components/ui/stories/`.


  Acceptance criteria: (1) StatCard composed only from primitives, tokens only,
  no hex/color literals; (2) `tone` CVA recolors the surface and children adapt
  via onColor/currentColor/foreground opacity; (3) deltaPct sign drives
  MetricDelta arrow and token color; (4) adornment/actions are ReactNode slots;
  (5) stories cover the listed cases; (6) each new primitive has its own story.
  `bun tsc` must stay green.
