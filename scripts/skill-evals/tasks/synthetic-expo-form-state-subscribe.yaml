  - kind: file-exists
    spec: "packages/app/expo/app/(sheets)/kit-form/-components/*/index.tsx"
  - kind: file-exists
    spec: "packages/app/expo/app/(sheets)/kit-form/-stores/*.ts"
  # ── NAV-MODAL ──────────────────────────────────────────────────────
