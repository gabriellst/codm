  - kind: grep-must-not
    spec: "packages/app/expo/app/(sheets)/kit-form/**/*.{ts,tsx}::useEffect\\([\\s\\S]{0,200}?setFieldValue"
    id: form#bp-12
  - kind: grep-must-not
    spec: "packages/app/expo/app/(sheets)/kit-form/**/*.{ts,tsx}::create\\s*<\\s*\\w*FormState"
    id: form#bp-13
  - kind: grep-must-not
    spec: "packages/app/expo/app/(sheets)/kit-form/**/*.{ts,tsx}::import\\s*\\{[^}]*\\bTextInput\\b|<TextInput[\\s>]"
