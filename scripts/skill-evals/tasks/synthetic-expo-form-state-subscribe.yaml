id: synthetic-expo-form-state-subscribe
timeoutMs: 3600000
seedCommands:
  - "bun cli sheet kit-form --i18n=kitForm --presentation=formSheet --platform=expo"
tier: holdout
builder: sonnet
title: Mobile kit-builder formSheet with one shared form under list-row pressure
  (synthetic — probes expo form-subscribe, nav-modal, state placement, disc-union)
sourceSpec: PROBES-BACKLOG.md#2
goldRef: ""
baseRef: ""
prompt: >
  In the template mobile app (packages/app/expo), build the missing "kit
  builder" flow. Product wants creating a product kit to happen on the
  phone as a deep-linkable modal sheet: create the route directory
  app/(sheets)/kit-form/ (index.tsx, plus -types.ts, -components/ and
  -stores/ as pinned below) and register it in app/_layout.tsx as a
  formSheet (the form-heavy sheet presentation), with an opener CTA on
  the home tab (under app/(tabs)/home/) that pushes the sheet. The
  backend surface already exists in the SDK: useCreateKit,
  createKitMutationRequestSchema, listKitsQueryKey,
  useListProductsForKit, and the ProductCostTypeEnum /
  QuantityModifierEnum consts (with their zod schemas) from
  @template/client-typescript/typescript — read
  packages/app/expo/CLAUDE.md FIRST. SCAFFOLD FIRST (binding): generate the formSheet and
  form via the expo CLI (`bun cli sheet ...`, `bun cli form ...` — scripts/cli/expo/,
  golden-tested) before any hand-written logic. Then the generated surface under
  packages/client/dist/typescript/src/typescript/{hooks,types,zod} for
  the exact shapes: the create body is { name, type, shipping, cost?,
  items: [{ productId, quantity, quantityModifier }] }; products to
  pick from come from useListProductsForKit (each row carries id, name,
  sku, imageUrl and currentCost as { amountCents, currency }). There is
  NO single-kit GET endpoint and NO kits list screen on mobile — do not
  build one; this is a frontend-only task: do not touch the backend and
  do not regenerate the SDK. The sheet is ONE form: kit name, a
  kit-type selector (the SDK ProductCostType values with translated
  labels), shipping cost, an optional extra cost, and the kit items
  assembled in-sheet — an item editor (pick a product, set a quantity
  and a quantity-rule from the SDK QuantityModifier values with
  translated labels) above the list of items added so far. Tapping an
  added row loads it into the editor to be changed: that row
  highlights, the other rows dim, and the editor's action switches from
  adding a new item to saving that row; typing in the editor must NOT
  re-render the list rows (hard perf requirement). The product picker
  is an in-page overlay (it does not change the URL), opens from BOTH
  the editor's product field AND the empty-items call-to-action, shows
  the first page of products with each product's name and current cost
  (no search input needed), and its visibility must never survive the
  sheet unmounting and remounting. A cold deep link carrying
  type=MULTIPLE opens the sheet with the kit type preselected; a deep
  link with garbage params renders the defaults, never crashes. The
  create button stays disabled until the payload is valid on the wire;
  on success give tactile feedback, dismiss the sheet and keep the SDK
  caches fresh (the kits list lives on the web app). All copy is
  localized in both app languages (add the new keys to locales/pt.json
  and en.json — @types/i18next.d.ts types t() against en.json). Decide
  where every piece of state lives, how the screen decomposes and how
  the one form is shared across the editor, the list, its rows and the
  picker — all per the house mobile architecture: read
  packages/app/expo/CLAUDE.md (first), docs/FRONTEND.md, the expo form
  skill INCLUDING its exemplars (.claude/skills/form/expo/ — read all
  five files in exemplars/workout-set/), the sheet skill
  (.claude/skills/sheet/), the expo route/component skills
  (.claude/skills/route/expo/, .claude/skills/component/expo/) and the
  store skill (.claude/skills/store/) before writing code, and study
  the existing exemplars (app/_layout.tsx, app/(sheets)/edit-profile/,
  app/(sheets)/devices/). Where an exemplar and a skill registry
  disagree, the registry wins. Colocated files live at
  -components/<Name>/index.tsx (named exports only), the shared form's
  merged schema + form prop type live in
  app/(sheets)/kit-form/-types.ts, route-private client state in
  app/(sheets)/kit-form/-stores/. Finish with a green type-check:
  cd packages/app/expo && bun x tsc --noEmit.
axes:
  - FORM-SUBSCRIBE
  - NAV-MODAL
  - STATE-PLACEMENT
  - DISC-UNION
  - DATA-OWNERSHIP
  - MUTATION-IDIOM
  - LOCALE-MONEY
  - ENUM-REPR
  - SDK-CONSUME
  - LAYOUT
graders:
