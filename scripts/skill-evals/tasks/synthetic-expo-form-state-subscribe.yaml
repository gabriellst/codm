  # ── STATE-PLACEMENT (UI-flags-only store, reset on unmount) ───────
  - kind: grep-must
    spec: "packages/app/expo/app/(sheets)/kit-form/-stores/*.ts::create<"
    id: store#STR-01
  - kind: grep-must
    spec: "packages/app/expo/app/(sheets)/kit-form/-stores/*.ts::initialState"
    id: store#STR-P02
  - kind: grep-must
    spec: "packages/app/expo/app/(sheets)/kit-form/**/*.{ts,tsx}::use\\w+Store\\(\\s*\\(?\\s*\\w+\\s*\\)?\\s*=>"
    id: store#STR-C02
  - kind: grep-must
    spec: "packages/app/expo/app/(sheets)/kit-form/**/*.{ts,tsx}::useEffect\\([\\s\\S]{0,200}?\\breset"
    id: store#STR-C03
  - kind: grep-must-not
    spec: "packages/app/expo/app/(sheets)/kit-form/-stores/*.ts::\\b(items|productId|quantity|values)\\s*[:?]"
    id: store#bp-03
  # ── MUTATION-IDIOM ─────────────────────────────────────────────────
  - kind: grep-must
    spec: "packages/app/expo/app/(sheets)/kit-form/**/*.{ts,tsx}::useCreateKit"
    id: form#FRM-01
  - kind: grep-must
    spec: "packages/app/expo/app/(sheets)/kit-form/**/*.{ts,tsx}::Haptics\\.notification\\(\\s*['\"]success['\"]"
    id: form#FRM-P01
  - kind: grep-must
    spec: "packages/app/expo/app/(sheets)/kit-form/**/*.{ts,tsx}::onSettled\\s*:"
    id: component#CMP-P06
  - kind: grep-must
    spec: "packages/app/expo/app/(sheets)/kit-form/**/*.{ts,tsx}::invalidateQueries\\(\\{\\s*queryKey:\\s*listKitsQueryKey"
    id: form#bp-07
  - kind: grep-must-not
    spec: "packages/app/expo/app/(sheets)/kit-form/**/*.{ts,tsx}::try\\s*\\{"
    id: form#bp-03
  - kind: grep-must-not
    spec: "packages/app/expo/app/(sheets)/kit-form/**/*.{ts,tsx}::onError\\s*:"
    id: atlas#MUTATION-IDIOM
  - kind: grep-must-not
    spec: "packages/app/expo/app/(sheets)/kit-form/**/*.{ts,tsx}::queryKey:\\s*\\[\\s*['\"]"
    id: form#bp-07
  # ── DATA-OWNERSHIP ─────────────────────────────────────────────────
  - kind: grep-must
    spec: "packages/app/expo/app/(sheets)/kit-form/-components/**/*.tsx::useListProductsForKit"
    id: component#CMP-P01
  # ── ENUM-REPR + LOCALE-MONEY ───────────────────────────────────────
  - kind: grep-must
    spec: "packages/app/expo/app/(sheets)/kit-form/**/*.{ts,tsx}::Object\\.values\\((ProductCostTypeEnum|QuantityModifierEnum)\\)|(productCostTypeSchema|quantityModifierSchema)\\.options"
    id: component#CMP-P05
  - kind: grep-must
