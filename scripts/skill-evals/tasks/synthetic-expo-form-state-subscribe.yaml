  - kind: grep-must
    spec: "packages/app/expo/app/(sheets)/kit-form/**/*.{ts,tsx}::enums\\.QuantityModifier"
    id: enum#i18n-catalog
  - kind: grep-must
    spec: "packages/app/expo/locales/en.json::\"ProductCostType\""
    id: enum#i18n-catalog
  - kind: grep-must
    spec: "packages/app/expo/locales/pt.json::\"ProductCostType\""
    id: enum#i18n-catalog
  - kind: grep-must
    spec: "packages/app/expo/locales/en.json::\"QuantityModifier\""
    id: enum#i18n-catalog
  - kind: grep-must
    spec: "packages/app/expo/locales/pt.json::\"QuantityModifier\""
    id: enum#i18n-catalog
  - kind: grep-must
    spec: "packages/app/expo/app/(sheets)/kit-form/**/*.tsx::useTranslation\\("
    id: atlas#LOCALE-MONEY
  - kind: grep-must
    spec: "packages/app/expo/app/(sheets)/kit-form/**/*.{ts,tsx}::formatMoney\\("
    id: component#CMP-P13
  - kind: grep-must-not
    spec: "packages/app/expo/app/(sheets)/kit-form/**/*.{ts,tsx}::['\"]pt-BR['\"]|['\"]en-US['\"]|\\bptBR\\b|\\benUS\\b"
    id: component#CMP-P13
  - kind: grep-must-not
    spec: "packages/app/expo/app/(sheets)/kit-form/**/*.{ts,tsx}::useMoney|useLocale"
    id: component#CMP-P13
  - kind: grep-must-not
    spec: "packages/app/expo/app/(sheets)/kit-form/**/*.{ts,tsx}::Intl\\.(NumberFormat|DateTimeFormat)|toLocaleDateString\\(|toLocaleString\\("
    id: component#CMP-P13
  - kind: grep-must-not
    spec: "packages/app/expo/app/(sheets)/kit-form/**/*.{ts,tsx}::function\\s+format[A-Z]\\w*\\s*\\(|const\\s+format[A-Z]\\w*\\s*="
    id: component#bp-16
  - kind: grep-must-not
