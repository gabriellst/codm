  - kind: grep-must-not
    spec: "packages/app/expo/app/(sheets)/kit-form/-components/**/*.{ts,tsx}::export\\s+default"
    id: component#bp-18
  - kind: grep-must-not
    spec: "packages/app/expo/app/(sheets)/kit-form/-components/*.{ts,tsx}::[\\s\\S]*"
    id: component#bp-06
  - kind: grep-must-not
    spec: "packages/app/expo/app/(sheets)/kit-form/-components/**/_*.{ts,tsx}::[\\s\\S]*"
    id: route#bp-10
  # ── SDK-CONSUME ────────────────────────────────────────────────────
  - kind: grep-must
    spec: "packages/app/expo/app/(sheets)/kit-form/**/*.{ts,tsx}::from\\s+['\"]@template/client-typescript/typescript['\"]"
    id: atlas#SDK-CONSUME
  - kind: grep-must-not
    spec: "packages/app/expo/app/(sheets)/kit-form/**/*.{ts,tsx}::(?<![\\w$.])fetch\\s*\\(|from\\s+['\"](axios|ky|got|redaxios|superagent)['\"]"
    id: atlas#SDK-CONSUME
  # ── detectors + judge ──────────────────────────────────────────────
  - kind: detect
    spec: registry-scan
  - kind: detect
    spec: import-direction
  - kind: detect
    spec: route-closure
  - kind: judge
    spec: >
      A mobile "kit builder" formSheet was just added under
      packages/app/expo/app/(sheets)/kit-form/ with an opener on the home
      tab. Verify ALL of:
      (a) NAV-MODAL — the sheet is registered in app/_layout.tsx via
      Stack.Screen name="(sheets)/kit-form" with EXPLICIT presentation
      'formSheet' (plus headerShown: false and a contentStyle background);
      the opener under app/(tabs)/home/ pushes the route via router.push
      with the typed pathname — no web dialog/store pattern carried over;
      successful submit pairs Haptics with router.back() (the formSheet
      dismissal); the sheet self-gates with <Protected> (it sits outside
      the gated (tabs) group); the kit-type param round-trips through
      useTypedSearchParams(schema) from @/lib/typed-route with EVERY
      schema field .default()-ed and the type field typed by the SDK
      ProductCostType values (a garbage deep link renders defaults, never
      crashes), and the param seeds the form's defaultValues.
      (b) FORM-SUBSCRIBE + DISC-UNION — exactly ONE useForm owns the
      whole draft, created by the sheet screen, with validators
      { onChange } over a schema derived from
      createKitMutationRequestSchema with the UI-only editing fields
      merged via .and(z.object({...})); children (editor, items list,
      rows, picker) receive the form as a typed prop whose type comes
      from a never-invoked inference helper in -types.ts
      (ReturnType<typeof _infer...>) — no React Context, no Zustand
      mirror of field values, no prop-drilling of values; each added-item
      ROW subscribes via form.Subscribe with a selector returning a
      PRIMITIVE 3-mode discriminant (idle / this-row-editing /
      other-row-editing) so editor keystrokes do not re-render rows;
      tapping a row enters edit mode through batched form.setFieldValue
      calls; the editor branches its action between add-new and
      save-edits off that editing discriminant; the final submit
      re-parses with the bare createKitMutationRequestSchema (stripping
      the UI-only fields) and sends result.data; the create button's
      disabled gate derives from safeParse inside a form.Subscribe.
      (c) STATE-PLACEMENT — the route-scoped Zustand store under
      -stores/ holds ONLY UI flags (the product-picker visibility),
      consumed via selector access, with an initialState-based reset
      wired to run when the sheet unmounts; no form values, server data,
      or mutation pending flags in the store; ZERO useState under the new
      dir; server data only via SDK hooks.
      (d) MUTATION/SDK/LOCALE/ENUM — submit awaits the SDK mutation with
      onSuccess Haptics.notification('success') then dismissal, and
      onSettled invalidation via listKitsQueryKey(); no try/catch and no
      onError handler (the global MutationCache owns errors); the picker
      (and/or rows) shows each product's current cost via the lib
      formatMoney helper converting cents to units (amountCents / 100) —
      never a hardcoded locale or an Intl call in components; kit-type
      and quantity-rule labels come from the typed i18n
      enums.ProductCostType.* / enums.QuantityModifier.* subtrees with
      keys present in BOTH locales/pt.json and en.json, options iterated
      from the SDK enum consts — no inline label strings, no hand-rolled
      z.enum([...]) literal lists.
      (e) LAYOUT — colocated components live at -components/<Name>/index.tsx
      with NAMED exports only; the store under -stores/; no flat or
      _-prefixed colocated files.
      Scope notes — do NOT fail these expected shapes: the editor and
      submit-area subscribers may select OBJECTS (e.g. { canSubmit,
      values }) — the primitive-selector requirement applies to the
      per-row subscribers only; any primitive encoding of the 3-mode
      discriminant (0|1|2 as const, string-literal modes) is acceptable —
      judge the primitivity idiom, not the values or names; the draft kit
      items legitimately live INSIDE the form values (the form IS the
      draft) — do not demand a store or server round-trip for them; the
      merged form schema intentionally diverges from the wire schema (the
      UI-only editing fields are stripped by the submit-time re-parse) —
      do not fail it for not being the bare SDK schema; invalidating
      listKitsQueryKey when no mobile screen lists kits is the expected
      cache canon; the items list and the picker reading the same
      useListProductsForKit page is expected (React Query dedupes); the
      store reset-on-unmount useEffect is the sanctioned reset idiom, not
      a server-sync effect. Inspect the new files under
      app/(sheets)/kit-form/, plus app/_layout.tsx, app/(tabs)/home/ and
      locales/{pt,en}.json. The pre-existing sheets (edit-profile,
      devices) are out of scope.
notes: >-
  Synthetic probe authored from grounded HEAD facts — second expo probe,
  first agent-runnable FORM probe on any platform (FORM-SUBSCRIBE axis,
  expo spelling per PROBES-BACKLOG.md#2). No gold tree; agent mode only.
  Free real estate verified at authoring time: zero useForm /
  form.Subscribe call sites anywhere in packages/app/expo; no kit
  identifier (useCreateKit, useListProductsForKit, listKitsQueryKey,
  createKitMutationRequestSchema) referenced by the expo app; no
  (sheets)/kit-form folder or Stack.Screen registration (the dangling
  game-form/games registrations noted by the notifications probe are gone
  from HEAD); locales/{en,pt}.json contain no "ProductCostType" /
  "QuantityModifier" keys; the home tab is an SDK-free placeholder — so
  every grep-must is 0 at HEAD and the probe measures only new work. tsc
  app-expo green at HEAD; registry-scan, import-direction AND
  route-closure exit 0 at HEAD. Wire grounding: createKit body is
  { name, type: SINGLE|MULTIPLE, shipping, cost?, items: [{ productId
  uuid, quantity, quantityModifier EQ|GT|GTE|LT|LTE }] }; updateKit
  exists but there is NO single-kit GET and ListKits rows omit the items
  array, so the probe is CREATE-only by design (stated in the prompt so
  agents don't invent an edit mode they cannot prefill);
  listProductsForKit rows carry currentCost as signedMoney { amountCents,
  currency } and @/lib/format formatMoney takes UNITS — the cents→units
  conversion is a deliberate LOCALE-MONEY pressure point (CMP-P13);
  ProductCostTypeEnum / QuantityModifierEnum and both zod schemas are
  exported from the SDK index. Canon-pinned greps (documented spellings,
  not invented names): ".and(z.object(" pins the FRM-P04 merge idiom (the
  exemplar + registry spell .and — z.intersection/.extend would fail);
  "ReturnType<typeof _infer" pins the documented inference-helper naming
  (_inferXForm in form/expo FRM-P04 + exemplars/workout-set; same grep
  family the react form-probe sketch in PROBES-BACKLOG.md sanctions);
  "initialState" pins store STR-P02. The 3-mode selector PRIMITIVITY is
  judged, not grepped — 0|1|2 as const and string-literal modes are
  equally canon-true. Tensions accepted deliberately: (1) the dir-wide
  useState ban is canon here because the brief's only transient flag (the
  picker visibility) is cross-component (two openers → store STR-P10 case
  3 / CMP-P07) and the picker has no search input per the brief; if a
  variant adds a single-opener transient overlay, relax per route/expo
  bp-09. (2) presentation is hard-pinned to 'formSheet' because the
  prompt mandates it (form-heavy sheet per the sheet-skill table); the
  route-closure rider (RC-05) only enforces SOME explicit presentation —
  registration closure + dismissal + raw useLocalSearchParams are
  RC-gated (RC-01/02/05/06/07), which is why no useLocalSearchParams
  must-not is duplicated here. (3) DISC-UNION is the expo spelling from
  the backlog row: the 3-mode editing-mode discriminant + the editor's
  add-vs-save variant branch — no wire union exists (createKit body is a
  flat object), so no @/lib/union greps apply. (4) the useEffect grep for
  reset-on-unmount is loose ("useEffect( … reset" within 200 chars) so
  both the getState().reset() and selector-bound-cleanup spellings pass;
  the judge verifies the cleanup semantics. Glob notes: Bun.Glob treats
  "(sheets)"/"(tabs)" as literal segments; "**" matches zero segments so
  "kit-form/**/*.{ts,tsx}" includes index.tsx AND -types.ts AND
  -stores/*.ts; filename braces work but a "/" inside a brace branch does
  not. The "-components/*.{ts,tsx}::[\\s\\S]*" and "_*" must-nots assert
  file ABSENCE (flat or _-prefixed colocated files) — any matching file
  fails regardless of content. All regexes compile through parseGrepSpec;
  validated with bun scripts/skill-evals/validate-task.ts (grep-musts +
  file-exists FAIL at HEAD, must-nots/tsc/detect PASS).
