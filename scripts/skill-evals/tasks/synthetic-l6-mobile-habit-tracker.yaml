id: synthetic-l6-mobile-habit-tracker
# L6 app #4 — the FIRST MOBILE (Expo) app-from-idea probe. Novelty: breadth across the MOBILE CANON
# the mobile-canon program established — realtime (realtime/expo), onboarding (onboarding/expo), push
# (push/expo), sheets (sheet/expo), social auth (better-auth socialProviders), scheduled reminders
# (scheduler). Measures whether a fresh agent TRANSFERS those canons into a new Expo app vs reinvents
# them. Same orchestrated harness (extraTools:[Task]); RUN WITH AGENT_MODEL=opus (judgment-heavy).
# Stage vector via id prefixes model#/build#/canon#/test#/flows#. Gold: scripts/skill-evals/seeds/
# l6-mobile-habit-tracker/GOLD.md.
title: Autonomous build — minimal mobile habit-tracker (Expo) from a one-line idea (orchestrated, multi-agent)
tier: holdout
builder: fable
sourceSpec: scripts/skill-evals/seeds/l6-mobile-habit-tracker/GOLD.md
goldRef: ""
baseRef: ""
timeoutMs: 10800000
extraTools:
  - Task
prompt: >
  BUILD A MINIMAL MOBILE HABIT-TRACKER APP (Expo), end to end, in this monorepo, from this one-line
  idea: "A user signs in with Google or Apple, is onboarded on first launch, creates habits via a
  sheet and checks them off daily; the habits view updates live when a habit is checked off elsewhere;
  the user registers for push and gets scheduled reminders to do a habit. Auth + the realtime /
  onboarding / push / sheet / scheduler canons are PROVIDED by the template."
  You are the ORCHESTRATOR (you have the Task tool) — model, lock the contract, plan with handoffs,
  then DISPATCH a fresh worker subagent per Task. Follow the full pipeline in the preamble; YOU own
  all modeling JUDGMENT, workers execute.
  ARCHITECTURE (non-negotiable, it is the grading rubric): DDD + Clean + CQRS + Event-Driven per the
  root CLAUDE.md and docs/BACKEND.md / docs/FRONTEND.md. The frontend is EXPO (packages/app/expo) —
  read packages/app/expo/CLAUDE.md and the expo skill variants.
  DECOMPOSE into SOUND bounded contexts: a `habit` context owns the Habit aggregate (its OWN context —
  identity + a cadence/schedule + the check-in INVARIANT: a habit may be checked off at most once per
  period; a second check-off in the same period is rejected with a NAMED domain error). Check-ins are
  value objects / child records on the habit's period UNLESS they have an independent lifecycle. Habit
  raises an integration event `HabitCheckedOff` carrying a `storeId` (the realtime tenancy key). NO
  god `tracker` context; the reminder is NOT a persisted aggregate — it is a notification with a future
  `scheduledAt` via the `scheduler` canon.
  CONTRACT LOCK: freeze the `HabitCheckedOff` integration event (+ storeId) + any Habit enums in
  packages/contracts, add it to the BROWSER_EVENTS union in the ui ListenEvents controller, add the
  habit tables (Drizzle); run `bun contracts` + `bun sdk`.
  READ-SIDE: a HabitListProjection (the user's habits + today's check-in state) driven by a projector
  from the habit events, exposed via a ui BFF query.
  FRONTEND (Expo — TRANSFER the template canons, do NOT reinvent them):
  - Realtime (skill realtime/expo): the live habits view owns the GetHabits query + EXACTLY ONE
    useServerEvents(<HabitCheckedOff>…) that invalidates the query key (NO setQueryData, NO
    refetchInterval); useServerEventSource mounted once via <ServerEventsMount/> in the authed layout.
  - Onboarding (skill onboarding/expo): a first-launch wizard under app/(onboarding)/ (ROUTES, not a
    useState step index), completion persisted to expo-secure-store, gated by an <OnboardingGate>.
  - Sheets (skill sheet/expo): the create-habit form is an Expo Router SHEET under app/(sheets)/,
    validating the SDK create-habit mutation schema — not a full-screen route.
  - Push (skill push/expo): one <PushRegistration/> mount — permission → Expo token → useRegisterFcmToken
    with the SDK FcmPlatform enum (no per-screen registration, no hardcoded platform string).
  - Social auth: the login screen offers BOTH auth.signIn.social({ provider: 'google' }) AND
    ({ provider: 'apple', … }) against the configured socialProviders.
  Scheduled reminder (skill scheduler): a reminder is a notification with a future scheduledAt
  persisted SCHEDULED (not delivered now). Status/priority/labels via the typed enums.* i18n catalog
  in BOTH locales. EVERY actionable button wired; NO hardcoded user-facing text (use t()).
  TESTS (TDD — per .claude/skills/test/typescript): the Habit aggregate context lives at
  packages/api/typescript/src/habit/. Write COLOCATED tests there that PASS: (a) an ENTITY test
  asserting the check-in invariant (a second check-off in the same period is rejected with the named
  domain error); (b) a USE CASE test in TestBed integration mode (`TestBed.create('integration', …)`)
  for CreateHabit / CheckOffHabit. Green: `cd packages/api/typescript && bun test src/habit`.
  GATES before done: `cd packages/api/typescript && bun x tsc -p tsconfig.build.json --noEmit` AND
  `bun test src/habit` (green); `cd packages/app/expo && bun x tsc --noEmit`; `bun run detect` clean.
  Final message: the bounded contexts, the frozen contract, per-Task worker dispatch + gate results,
  the tests written, and which canon axes (realtime/onboarding/sheets/push/scheduler/social) you
  TRANSFERRED + which core flows are covered.

axes:
  - APP-FROM-IDEA
  - MOBILE
  - DDD-DECOMPOSITION
  - CANON-TRANSFER
  - REALTIME
  - ONBOARDING
  - PUSH
  - SHEETS
  - SCHEDULER
  - SOCIAL-AUTH

graders:
  # ── model stage — Habit aggregate decomposition ──
  - kind: judge
    model: sonnet
    spec: >
      Inspect the bounded contexts under packages/api/typescript/src/. Judge the DDD DECOMPOSITION for
      a minimal habit tracker (names may differ — grade soundness): a `habit` context owns the Habit
      aggregate with a real check-in INVARIANT (at most one check-off per period; a second is rejected
      with a named domain error). PASS only if: (1) Habit is its OWN aggregate/context with that
      invariant — NOT an anemic CRUD bag; (2) check-ins are value objects / child records UNLESS they
      have an independent lifecycle (no gratuitous CheckIn aggregate); (3) NO god `tracker` context
      owning habit+checkin+reminder+everything; (4) the reminder is a notification with scheduledAt
      (the scheduler canon), NOT a persisted reminder aggregate. Name the contexts + verdict per criterion.
    id: model#bc-decomposition
  # ── build stage — mechanical, naming-independent ──
  - kind: tsc
    spec: backend
    id: build#tsc-backend
  - kind: tsc
    spec: app-expo
    id: build#tsc-expo
  - kind: detect
    spec: registry-scan
    id: build#detect-registry
  - kind: detect
    spec: import-direction
    id: build#detect-imports
  - kind: detect
    spec: projection-shape
    id: build#detect-projection
  # ── test stage — colocated TDD, green ──
  - kind: file-exists
    spec: "packages/api/typescript/src/habit/**/*.test.ts"
    id: test#colocated-exists
  - kind: grep-must
    spec: "packages/api/typescript/src/habit/**/*.test.ts::TestBed\\.create\\(\\s*'integration'"
    id: test#integration-mode
  - kind: test-green
    spec: packages/api/typescript/src/habit
    id: test#green
  # ── canon-transfer stage — naming-independent greps over the Expo app (the NOVEL axes) ──
  - kind: grep-must
    spec: "packages/app/expo/**/*.{ts,tsx}::useServerEvents\\("
    id: canon#realtime-subscribe
  - kind: grep-must
    spec: "packages/app/expo/**/*.{ts,tsx}::ServerEventsMount"
    id: canon#realtime-mounted-once
  - kind: grep-must-not
    spec: "packages/app/expo/**/*.{ts,tsx}::setQueryData|refetchInterval"
    id: canon#realtime-no-surgery
  - kind: grep-must
    spec: "packages/app/expo/app/(onboarding)/**::.*"
    id: canon#onboarding-routes
  - kind: grep-must
    spec: "packages/app/expo/**/*.{ts,tsx}::OnboardingGate"
    id: canon#onboarding-gate
  - kind: grep-must
    spec: "packages/app/expo/app/(sheets)/**::.*"
    id: canon#sheets-route
  - kind: grep-must
    spec: "packages/app/expo/**/*.{ts,tsx}::useRegisterFcmToken"
    id: canon#push-register
  - kind: grep-must
    spec: "packages/app/expo/**/*.{ts,tsx}::signIn\\.social"
    id: canon#social-signin
  - kind: grep-must
    spec: "packages/api/typescript/src/**/*.ts::scheduledAt"
    id: canon#scheduler-scheduledat
  # ── canon-transfer judge — did the agent CONSUME the canons vs reinvent? ──
  - kind: judge
    model: sonnet
    spec: >
      Judge whether the Expo habit-tracker TRANSFERRED the template's mobile canons (consumed them) vs
      reinvented/ignored them. Report per axis: (1) REALTIME — exactly one useServerEvents in the live
      habits view invalidating the SDK query key (no setQueryData/refetchInterval), connection mounted
      once via <ServerEventsMount/> in the authed layout; (2) ONBOARDING — a first-launch wizard built
      from routes under app/(onboarding)/ (NOT a useState step index), persisted completion + an
      <OnboardingGate>; (3) SHEETS — the create-habit form is an Expo Router sheet under app/(sheets)/,
      not a full-screen route; (4) PUSH — one <PushRegistration/> mount using useRegisterFcmToken with
      the SDK FcmPlatform enum (no per-screen registration / hardcoded platform); (5) SOCIAL — the
      login offers BOTH google and apple via auth.signIn.social; (6) SCHEDULER — a reminder is a
      notification with a future scheduledAt (persisted scheduled), NOT a setTimeout in a handler. PASS
      if ≥5 of the 6 axes are genuinely transferred; FAIL (naming which) if ≤4.
    id: canon#transfer
  # ── flows stage ──
  - kind: judge
    model: sonnet
    spec: >
      Judge whether the build implements the CORE HABIT-TRACKER FLOWS end to end (backend aggregate/
      usecase + wire + Expo frontend), per scripts/skill-evals/seeds/l6-mobile-habit-tracker/GOLD.md.
      Report coverage of each: (1) sign in with Google or Apple → onboarded on first launch; (2) create
      a habit via a sheet → it appears in the list; (3) check off a habit; a second check-off in the
      same period is rejected (the invariant); (4) the live habits view updates on a HabitCheckedOff
      event (useServerEvents → invalidate, no reload); (5) a scheduled reminder persisted with a future
      scheduledAt (SCHEDULED, not delivered now); (6) push registration runs once in the authed area.
      PASS if ≥4 of the 6 are genuinely implemented end to end (not scaffolded shells); per-flow verdict.
      FAIL if ≤3.
    id: flows#core-coverage

notes: >-
  L6 app #4 (mobile habit-tracker) — the FIRST mobile/Expo app-from-idea probe and the capstone of the
  mobile-canon program (sub-project F). It grades CANON-TRANSFER of the six mobile canons the program
  shipped: realtime/expo, onboarding/expo, push/expo, sheet/expo, social-auth (better-auth
  socialProviders), scheduler. ORCHESTRATED (extraTools [Task]); RUN WITH AGENT_MODEL=opus. Builds
  FROM SCRATCH — judges (naming varies) + naming-independent canon greps (useServerEvents,
  ServerEventsMount, OnboardingGate, useRegisterFcmToken, signIn.social, scheduledAt) + mechanical
  gates (app-expo tsc, detect) + the frozen HabitCheckedOff contract anchor. Stage vector via id
  prefixes model#/build#/canon#/test#/flows#. HEAVY: 3h, AGENT_RESUMES=2-3, opus orchestrator ~2×
  slower. First run is a MEASUREMENT of mobile canon-transfer; not expected perfect. Validator note:
  at HEAD every grader FAILs/empty = free real estate (no habit-tracker exists); tsc/detect pass at
  HEAD so build#* pass vacuously pre-build.
