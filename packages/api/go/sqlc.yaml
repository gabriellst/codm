version: "2"
# Single schema source: the Go side does NOT own a schema. It reads the
# Drizzle-owned contract, snapshotted (schema-only) into core/db/sql/schema.sql
# via `pg_dump -n gateway -n shared` (sqlc option B — safer than parsing the
# drizzle migration files, which sqlc's parser can choke on for multi-schema /
# CREATE SCHEMA / --> statement-breakpoint input).
#
# Regenerate the snapshot after any contract migration:
#   docker exec <pg> pg_dump --schema-only --no-owner --no-privileges \
#     -n gateway -n shared -U postgres codedm \
#     | grep -vE '^\\(restrict|unrestrict)' > packages/api/go/core/db/sql/schema.sql
# then: (cd packages/api/go && sqlc generate)
#
# sqlc generates the MODELS (a compile-time drift guard: a contract column
# change that the hand-written repo SQL still references breaks `go build`).
# Queries stay mostly hand-written (dynamic/batch); they are added under
# internal/channel/db/query/ in the repos-adopt-generated-structs step.
sql:
  - engine: postgresql
    schema: "core/db/sql/schema.sql"
    queries: "internal/channel/db/query"
    gen:
      go:
        package: "channeldb"
        out: "internal/channel/db/gen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        # Enum columns are overridden onto the contract wire enums
        # (template/contracts-go/wire) so the models share the single enum
        # source with the rest of the Go + TS stack instead of degrading to
        # bare `string`.
        #
        # NOTE (coordination): these reference the wire enum type names present
        # in this worktree's generated wire package — ChannelKind / ContactKind.
        # When the Phase 1 enum rename (ChannelKind->Platform, ContactKind->
        # RemoteType) propagates into packages/contracts/generated/go/wire,
        # update the `type:` values below (ChannelKind->Platform,
        # ContactKind->RemoteType) and re-run `sqlc generate`.
        overrides:
          - column: "gateway.channels.status"
            go_type:
              import: "template/contracts-go/wire"
              package: "wire"
              type: "ChannelStatus"
          - column: "gateway.channels.platform"
            go_type:
              import: "template/contracts-go/wire"
              package: "wire"
              type: "ChannelKind"
          - column: "gateway.messages.platform"
            go_type:
              import: "template/contracts-go/wire"
              package: "wire"
              type: "ChannelKind"
          - column: "gateway.messages.direction"
            go_type:
              import: "template/contracts-go/wire"
              package: "wire"
              type: "Direction"
          - column: "gateway.remotes.platform"
            go_type:
              import: "template/contracts-go/wire"
              package: "wire"
              type: "ChannelKind"
          - column: "gateway.remotes.type"
            go_type:
              import: "template/contracts-go/wire"
              package: "wire"
              type: "ContactKind"
