upstream app_react_node {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen ${PORT} default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml
        font/woff2;

    # Start client-side hashed assets — served directly by nginx (no Node round-trip).
    # Files live at /usr/share/nginx/html/app/assets/* thanks to the build's
    # `base: '/app/'`, which writes assets to .output/public/assets/* with the prefix.
    location /app/assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # React SPA + auth SSR — proxied to the Start Node server. Node handles
    # SSR routes (/app/sign-in, /app/sign-up, /app/reset-password) and the
    # SPA shell for client-only routes (/app/dashboard, /app/games).
    location /app/ {
        proxy_pass         http://app_react_node;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 30s;
    }

    # Astro static assets (the Astro build emits hashed files under /_astro/)
    location /_astro/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Sitemap / robots
    location = /sitemap-index.xml { try_files $uri =404; }
    location = /robots.txt        { try_files $uri =404; }

    # Default: Astro pages (landing pt at /, en at /en/, blog at /blog/*).
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
