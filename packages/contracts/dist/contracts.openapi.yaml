openapi: 3.0.0
info:
  title: Template Contracts
  version: 0.0.0
tags: []
paths: {}
components:
  schemas:
    AgentReplyDraftedEvent:
      type: object
      required:
        - name
        - issueId
        - threadId
        - labelIssueKey
        - labelThreadId
        - text
      properties:
        name:
          type: string
          enum:
            - integration.agent.reply_drafted
        issueId:
          type: string
        threadId:
          type: string
        labelIssueKey:
          type: string
        labelThreadId:
          type: string
        text:
          type: string
      allOf:
        - $ref: '#/components/schemas/IntegrationEvent'
      description: BC5 Issue Execution -> BC4 Thread & Routing -> BC1 Channel Gateway. An agent drafted a reply for an issue; carries the issue label so the gateway can prefix it on delivery. Descends whatscode ChatMessageEvent. The IssueLabel VO is flattened to labelIssueKey/labelThreadId (both required here — every agent reply is labeled).
    ArtifactKind:
      type: string
      enum:
        - IMAGE
        - FILE
        - LINK
      description: Kind of non-code output an agent recorded. IMAGE/FILE reference a local path; LINK references a URL (e.g. a preview deploy).
    ArtifactRecordedEvent:
      type: object
      required:
        - name
        - artifactId
        - threadId
        - kind
        - artifactName
      properties:
        name:
          type: string
          enum:
            - integration.artifact.recorded
        artifactId:
          type: string
        threadId:
          type: string
        issueId:
          type: string
        kind:
          $ref: '#/components/schemas/ArtifactKind'
        artifactName:
          type: string
      allOf:
        - $ref: '#/components/schemas/IntegrationEvent'
      description: BC5 Issue Execution -> BC6 Artifact Registry. A non-code output (image/file/link) was produced by an agent. The draft's payload field `name` is renamed `artifactName` to avoid colliding with the envelope `name` discriminator.
    AttachFlowStyle:
      type: string
      enum:
        - FULLSCREEN
        - SIDE_PANEL
      description: How the Attach-Thread wizard is presented. FULLSCREEN takeover or SIDE_PANEL. A general preference surfaced in Settings.
    BufferSize:
      type: string
      enum:
        - '25'
        - '50'
        - '100'
        - '200'
      description: Rolling per-thread context buffer size, in messages. A closed set of tiers {25,50,100,200}. Modeled as a STRING enum (the wire codegen carries string enums; numeric-literal unions are not first-class) — the domain narrows it to the numeric tiers and the DB stores it as text via the shared text-column convention.
    ChannelConnectedEvent:
      type: object
      required:
        - name
        - channelId
        - kind
        - accountDetail
        - pairedAt
      properties:
        name:
          type: string
          enum:
            - integration.channel.connected
        channelId:
          type: string
        kind:
          $ref: '#/components/schemas/ChannelKind'
        accountDetail:
          type: string
        pairedAt:
          type: string
          format: date-time
      allOf:
        - $ref: '#/components/schemas/IntegrationEvent'
      description: BC1 Channel Gateway -> BC4 Thread & Routing. A channel finished pairing and is reachable. Descends medscall integration.channel.connected.
    ChannelDeliveryRequestedEvent:
      type: object
      required:
        - name
        - channelId
        - contactExternalId
        - contactDisplayName
        - contactKind
        - text
        - senderIdentity
      properties:
        name:
          type: string
          enum:
            - integration.channel.delivery_requested
        channelId:
          type: string
        contactExternalId:
          type: string
        contactDisplayName:
          type: string
        contactKind:
          $ref: '#/components/schemas/ContactKind'
        text:
          type: string
        labelIssueKey:
          type: string
        labelThreadId:
          type: string
        senderIdentity:
          $ref: '#/components/schemas/SenderIdentity'
      allOf:
        - $ref: '#/components/schemas/IntegrationEvent'
      description: BC4 Thread & Routing -> BC1 Channel Gateway (command-event). Orders the gateway to deliver an outbound message. In medscall this is an HTTP send call; modeled here as an integration event so it rides the same outbox/transport as the rest of the lock. The label prefix is applied by the gateway on agent replies (senderIdentity=AGENT). ownerId travels on the envelope.
    ChannelDisconnectedEvent:
      type: object
      required:
        - name
        - channelId
        - kind
        - affectedThreadIds
      properties:
        name:
          type: string
          enum:
            - integration.channel.disconnected
        channelId:
          type: string
        kind:
          $ref: '#/components/schemas/ChannelKind'
        affectedThreadIds:
          type: array
          items:
            type: string
      allOf:
        - $ref: '#/components/schemas/IntegrationEvent'
      description: BC1 Channel Gateway -> BC4 Thread & Routing. A channel session was torn down; the core parks the affected threads. Descends medscall integration.channel.disconnected.
    ChannelKind:
      type: string
      enum:
        - WHATSAPP
        - INSTAGRAM_DM
        - TELEGRAM
      description: Messaging platform a Channel bridges. Frozen for three (founder decision 4); only WHATSAPP is realized in the first gateway phase — INSTAGRAM_DM and TELEGRAM are reserved variants. Descends the medscall Platform enum. Persisted on channel-side projections (Go-owned).
    ChannelMessageReceivedEvent:
      type: object
      required:
        - name
        - channelId
        - messageId
        - contactExternalId
        - contactDisplayName
        - contactKind
        - senderExternalId
        - isGroup
        - text
        - platform
        - receivedAt
      properties:
        name:
          type: string
          enum:
            - integration.channel_message.received
        channelId:
          type: string
          description: The channel this message arrived on (top-level binding; intentionally represents the draft ContactRef.channelId sub-field).
        messageId:
          type: string
        contactExternalId:
          type: string
        contactDisplayName:
          type: string
        contactKind:
          $ref: '#/components/schemas/ContactKind'
        senderExternalId:
          type: string
        isGroup:
          type: boolean
        text:
          type: string
        quotedEntryId:
          type: string
        platform:
          $ref: '#/components/schemas/ChannelKind'
        receivedAt:
          type: string
          format: date-time
      allOf:
        - $ref: '#/components/schemas/IntegrationEvent'
      description: BC1 Channel Gateway -> BC4 Thread & Routing. A normalized inbound message on a connected channel. Descends medscall integration.channel_message.received. The ContactRef VO is flattened to scalar contact* fields (the wire codegen carries scalars + enums, not nested models); the core reassembles it. `receivedAt` is when the platform says the message was sent. ownerId travels on the envelope.
    ChannelOutboundDeliveredEvent:
      type: object
      required:
        - name
        - channelId
        - contactExternalId
        - contactDisplayName
        - contactKind
        - senderIdentity
        - deliveredAt
      properties:
        name:
          type: string
          enum:
            - integration.channel.outbound_delivered
        channelId:
          type: string
        contactExternalId:
          type: string
        contactDisplayName:
          type: string
        contactKind:
          $ref: '#/components/schemas/ContactKind'
        labelIssueKey:
          type: string
        labelThreadId:
          type: string
        senderIdentity:
          $ref: '#/components/schemas/SenderIdentity'
        deliveredAt:
          type: string
          format: date-time
      allOf:
        - $ref: '#/components/schemas/IntegrationEvent'
      description: BC1 Channel Gateway -> BC4 Thread & Routing. An outbound message was delivered to the channel (optimistic emit). Descends medscall channel.message_sent. The ContactRef and the optional IssueLabel are flattened to scalar fields; label* is present only on agent replies.
    ChannelPairingQrUpdatedEvent:
      type: object
      required:
        - name
        - channelId
        - kind
        - qrPayload
        - qrExpiresAt
      properties:
        name:
          type: string
          enum:
            - integration.channel.pairing_qr_updated
        channelId:
          type: string
        kind:
          $ref: '#/components/schemas/ChannelKind'
        qrPayload:
          type: string
        qrExpiresAt:
          type: string
          format: date-time
      allOf:
        - $ref: '#/components/schemas/IntegrationEvent'
      description: BC1 Channel Gateway -> BC4 Thread & Routing. A fresh pairing QR/token was produced (rotates ~every 30s). Descends medscall WhatsAppQRCodeUpdated; drives the T06 live QR over SSE.
    ChannelStatus:
      type: string
      enum:
        - DISCONNECTED
        - PAIRING
        - CONNECTED
      description: Connection health of a Channel. DISCONNECTED (no session) → PAIRING (QR/OAuth in progress) → CONNECTED (reachable). Descends the medscall channel status.
    ClassificationMethod:
      type: string
      enum:
        - REPLY_QUOTE
        - CONTEXT_MATCH
        - NEW_ISSUE
        - CLARIFIED
      description: 'How the router demultiplexed a single-stream inbound message into an issue. Resolution order: REPLY_QUOTE (authoritative) > CONTEXT_MATCH (>= threshold) > NEW_ISSUE > CLARIFIED (resolved a prior clarification).'
    ContactKind:
      type: string
      enum:
        - CONTACT
        - GROUP
      description: Whether a channel counterparty is a single contact or a group conversation. Flattened out of the ContactRef value object onto the wire (the codegen carries scalars + enums, not nested models); the domain reassembles ContactRef as a Value Object.
