    Direction:
      type: string
      enum:
        - SENT
        - RECEIVED
      description: Whether a gateway message row is outbound (SENT by the owner) or inbound (RECEIVED). Descends the medscall channel Direction. The gateway.messages projector derives it from which lifecycle event drove the row (channel_message.sent -> SENT, channel_message.received -> RECEIVED); persisted as the `direction` column.
    GroupRole:
      type: string
      enum:
        - member
        - admin
        - super_admin
      description: 'Role of a member inside a group. Descends the medscall channel GroupRole. Lowercase wire values preserved verbatim. Defined-and-dormant: the gateway.remote_memberships projection stores the boolean `is_admin` today; this enum is the harmonized closed set for consumers that need the full member/admin/super_admin gradient.'
    HistorySyncType:
      type: string
      enum:
        - initial
        - recent
      description: Classifies a whatsmeow HistorySync batch by its SyncType. Descends the medscall channel HistorySyncType — only the two user-facing variants are surfaced (FULL, PUSH_NAME, NON_BLOCKING_DATA, ON_DEMAND are dropped at the source mapper). Lowercase wire values preserved verbatim. Carried by the sync_progress wire event's `historySyncType` field.
    IntegrationEvent:
      type: object
      required:
        - name
        - entityId
        - ownerId
        - occurredAt
      properties:
        name:
          type: string
          description: 'Discriminator: dotted event name.'
        entityId:
          type: string
          description: UUID of the originating aggregate or entity.
        ownerId:
          type: string
          description: Tenant or owner this event belongs to.
        occurredAt:
          type: string
          format: date-time
          description: RFC3339 timestamp when the event occurred.
      discriminator:
        propertyName: name
        mapping:
          integration.billing.subscription_changed: '#/components/schemas/SubscriptionChangedEvent'
          integration.channel_message.received: '#/components/schemas/ChannelMessageReceivedEvent'
          integration.channel.connected: '#/components/schemas/ChannelConnectedEvent'
          integration.channel.disconnected: '#/components/schemas/ChannelDisconnectedEvent'
          integration.channel.pairing_qr_updated: '#/components/schemas/ChannelPairingQrUpdatedEvent'
          integration.channel.outbound_delivered: '#/components/schemas/ChannelOutboundDeliveredEvent'
          integration.channel.delivery_requested: '#/components/schemas/ChannelDeliveryRequestedEvent'
          integration.channel_message.sent: '#/components/schemas/ChannelMessageSentEvent'
          integration.channel_message.edited: '#/components/schemas/ChannelMessageEditedEvent'
          integration.channel_message.deleted: '#/components/schemas/ChannelMessageDeletedEvent'
          integration.channel_message.delivered: '#/components/schemas/ChannelMessageDeliveredEvent'
          integration.channel_message.seen: '#/components/schemas/ChannelMessageSeenEvent'
          integration.channel.remote_created: '#/components/schemas/ChannelRemoteCreatedEvent'
          integration.channel.remote_updated: '#/components/schemas/ChannelRemoteUpdatedEvent'
          integration.channel.remote_deleted: '#/components/schemas/ChannelRemoteDeletedEvent'
          integration.channel.membership_added: '#/components/schemas/ChannelMembershipAddedEvent'
          integration.channel.membership_removed: '#/components/schemas/ChannelMembershipRemovedEvent'
          integration.channel.messages_synced: '#/components/schemas/ChannelMessagesSyncedEvent'
          integration.channel.remotes_synced: '#/components/schemas/ChannelRemotesSyncedEvent'
          integration.channel.sync_started: '#/components/schemas/ChannelSyncStartedEvent'
          integration.channel.sync_progress: '#/components/schemas/ChannelSyncProgressEvent'
          integration.channel.sync_completed: '#/components/schemas/ChannelSyncCompletedEvent'
          integration.channel.presence_updated: '#/components/schemas/ChannelPresenceUpdatedEvent'
          integration.channel.chat_presence_updated: '#/components/schemas/ChannelChatPresenceUpdatedEvent'
          integration.channel.logged_out: '#/components/schemas/ChannelLoggedOutEvent'
          integration.channel_special_platform_event.received: '#/components/schemas/ChannelSpecialPlatformEventReceivedEvent'
          integration.thread.attached: '#/components/schemas/ThreadAttachedEvent'
          integration.message.classified: '#/components/schemas/MessageClassifiedEvent'
          integration.issue.opened: '#/components/schemas/IssueOpenedEvent'
          integration.issue.completed: '#/components/schemas/IssueCompletedEvent'
          integration.agent.reply_drafted: '#/components/schemas/AgentReplyDraftedEvent'
          integration.issue.stop_raised: '#/components/schemas/IssueStopRaisedEvent'
          integration.issue.stop_resolved: '#/components/schemas/IssueStopResolvedEvent'
          integration.issue.archived: '#/components/schemas/IssueArchivedEvent'
          integration.artifact.recorded: '#/components/schemas/ArtifactRecordedEvent'
          integration.workspace.removed: '#/components/schemas/WorkspaceRemovedEvent'
      description: Base envelope for all cross-service integration events.
    IssueArchiveReason:
      type: string
      enum:
        - MANUAL
        - AUTO_24H
        - THREAD_DETACHED
      description: Why an Issue was archived. MANUAL (operator), AUTO_24H (scheduler sweep of COMPLETED issues older than 24h), THREAD_DETACHED (parent thread detached). Harmonized name (modeling called it ArchiveReason) — scoped to the issue lifecycle.
    IssueArchivedEvent:
      type: object
      required:
        - name
        - issueId
        - threadId
        - reason
      properties:
        name:
          type: string
          enum:
            - integration.issue.archived
        issueId:
          type: string
        threadId:
          type: string
        reason:
          $ref: '#/components/schemas/IssueArchiveReason'
      allOf:
        - $ref: '#/components/schemas/IntegrationEvent'
      description: BC5 Issue Execution -> BC4 Thread & Routing. An issue was archived (manually, by the 24h sweep, or because the thread was detached); updates the issue-list projections.
    IssueCompletedEvent:
      type: object
      required:
        - name
        - issueId
        - threadId
        - key
        - completedAt
      properties:
        name:
          type: string
          enum:
            - integration.issue.completed
        issueId:
          type: string
        threadId:
          type: string
        key:
          type: string
        completedAt:
          type: string
          format: date-time
      allOf:
        - $ref: '#/components/schemas/IntegrationEvent'
      description: BC5 Issue Execution -> BC4 Thread & Routing. An issue completed; starts the 24h auto-archive clock and updates status/metrics.
    IssueOpenedEvent:
      type: object
      required:
        - name
        - issueId
        - threadId
        - key
        - title
        - provider
      properties:
        name:
          type: string
          enum:
            - integration.issue.opened
        issueId:
          type: string
        threadId:
          type: string
        key:
          type: string
        title:
          type: string
        provider:
          $ref: '#/components/schemas/ProviderKind'
      allOf:
        - $ref: '#/components/schemas/IntegrationEvent'
      description: BC5 Issue Execution -> BC4 Thread & Routing. A new issue was opened (unique key per thread); triggers the terminal session spawn and a transcript/status update.
    IssueStatus:
      type: string
      enum:
        - NEEDS_INPUT
        - WORKING
        - COMPLETED
      description: Lifecycle of an Issue (a unit of work with its own terminal session). NEEDS_INPUT → WORKING → COMPLETED. Richer than whatscode's ChatSessionStatus{ACTIVE,CLOSED}.
    IssueStopRaisedEvent:
      type: object
      required:
        - name
        - stopId
        - issueId
        - threadId
        - kind
      properties:
        name:
          type: string
          enum:
            - integration.issue.stop_raised
        stopId:
          type: string
        issueId:
          type: string
        threadId:
          type: string
        kind:
          $ref: '#/components/schemas/StopKind'
      allOf:
        - $ref: '#/components/schemas/IntegrationEvent'
      description: BC5 Issue Execution -> BC4 Thread & Routing. An agent stopped and needs the human; flips the thread to NEEDS_ATTENTION, lights the dock badge and the Home callout.
    IssueStopResolvedEvent:
      type: object
      required:
        - name
        - stopId
        - issueId
        - resolution
      properties:
        name:
          type: string
          enum:
            - integration.issue.stop_resolved
        stopId:
          type: string
        issueId:
          type: string
        resolution:
          $ref: '#/components/schemas/StopResolution'
      allOf:
        - $ref: '#/components/schemas/IntegrationEvent'
      description: 'BC5 Issue Execution -> BC4 Thread & Routing. A stop was resolved by the operator. TAKE_OVER additionally pauses the thread (the consumer looks up issue -> thread). Payload kept exactly as the frozen draft: stopId, issueId, resolution.'
    Language:
      type: string
      enum:
        - pt-BR
        - en-US
      description: UI locale the app ships translations for.
    MembershipAction:
      type: string
      enum:
        - joined
        - left
        - promoted
        - demoted
      description: "A live change to a group's member set. Descends the medscall channel MembershipAction. Lowercase wire values preserved verbatim. Defined-and-dormant: the membership_added / membership_removed wire events model the join/leave facts directly (with `isAdmin`); this enum is the harmonized closed set for the promoted/demoted transitions the source also emits."
    MessageClassifiedEvent:
      type: object
      required:
        - name
        - threadId
        - entryId
        - method
      properties:
        name:
          type: string
          enum:
            - integration.message.classified
        threadId:
          type: string
        entryId:
          type: string
        method:
          $ref: '#/components/schemas/ClassificationMethod'
        issueId:
          type: string
      allOf:
        - $ref: '#/components/schemas/IntegrationEvent'
      description: BC4 Thread & Routing -> BC5 Issue Execution. A single-stream inbound message was demultiplexed into an issue (or fell through to clarification). issueId is absent only when the method resolved to a clarification.
    MessageType:
      type: string
      enum:
        - TEXT
        - IMAGE
        - VIDEO
        - AUDIO
        - DOCUMENT
        - STICKER
        - LOCATION
        - CONTACT
        - POLL
        - LIST
        - BUTTON
        - REACTION
        - STATUS
      description: Kind of payload a channel message carries. Descends the medscall channel MessageType — the full whatsmeow-derived surface is ported verbatim; only TEXT is exercised in the first gateway phase, the rest are defined-and-dormant. Materialized on the gateway.messages projection's content union (contentJson is the serialized variant).
    OwnerKind:
      type: string
      enum:
        - ORGANIZATION
        - INDIVIDUAL
      description: Discriminator for the tenant aggregate (Owner). Generic, product-agnostic placeholder values — a product specializes them (e.g. CLINIC / SOLO_DOCTOR, STORE / MERCHANT) by re-labelling. The kernel only cares that an ownerId resolves to some kind. Persisted on owner.owners.kind.
    PresenceType:
      type: string
      enum:
        - AVAILABLE
        - UNAVAILABLE
        - COMPOSING
        - RECORDING
        - PAUSED
      description: "A contact's overall availability signal on a channel. Descends the medscall channel PresenceType (whatsmeow *events.Presence). Defined-and-dormant: the presence_updated wire event carries the raw `unavailable` boolean + `lastSeen`; this enum is the harmonized closed set for consumers that want a named state."
    ProviderKind:
      type: string
      enum:
        - CLAUDE_CODE
        - CODEX
        - OPENCODE
      description: Terminal coding-agent CLI a thread/issue runs against. Harmonized name (source modeling called it ProviderName) — aligns with the *Kind convention across the wire enums.
    ProviderStatus:
      type: string
      enum:
        - DETECTED
        - NOT_INSTALLED
      description: Whether a provider CLI was found on the machine. Result of PATH + known-install-dir probing (BC3 detection Service).
    Role:
      type: string
      enum:
        - OWNER
        - ADMIN
        - MEMBER
      description: Membership role within a Store. OWNER + ADMIN may manage; MEMBER may view + use most features.
    SenderIdentity:
      type: string
      enum:
        - AGENT
        - ROUTER
        - OPERATOR
      description: Who an outbound channel message is delivered as. AGENT (labeled agent reply), ROUTER (clarification question, no label), OPERATOR (direct message while paused). Promoted from the modeling's inline senderIdentity union.
    SpecialPlatformEventType:
      type: string
      enum:
        - qr_code_updated
      description: Discriminator for a platform-specific out-of-band event carried by channel_special_platform_event.received. Descends the medscall channel ChannelSpecialPlatformEventType. Lowercase wire value preserved verbatim. qr_code_updated is realized concretely by the frozen pairing_qr_updated event; this generic envelope + enum is defined-and-dormant for future platform-native events.
    StopKind:
      type: string
      enum:
        - SERVER_ERROR
        - BLOCKED_BY_CLASSIFICATION
        - HUMAN_REQUESTED
        - APPROVAL_NEEDED
      description: Why an agent stopped and flagged the thread 'Needs you'. Each kind admits a specific set of resolutions (see StopResolution). Only kinds enabled in StopPolicyConfig can be raised.
    StopResolution:
      type: string
      enum:
        - RETRY
        - REVIEW_AND_SEND
        - TAKE_OVER
        - APPROVE
        - DENY
      description: How an operator resolves a stop. The resolution must match the stop kind (e.g. APPROVE/DENY only for APPROVAL_NEEDED); TAKE_OVER additionally pauses the thread for direct conversation.
    SubscriptionChangedEvent:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          enum:
            - integration.billing.subscription_changed
      allOf:
        - $ref: '#/components/schemas/IntegrationEvent'
      description: "Published by the TS billing context whenever an owner's subscription posture changes (created / plan changed / canceled / resubscribed / access-affecting settlement). A THIN TRIGGER: no plan or status payload — consumers (quota's GovernResourcesOnSubscriptionChanged) re-derive the effective entitlement from billing's derivers at handling time, so a stale or reordered delivery can never apply stale facts. The owner travels on the envelope `ownerId`."
    ThreadAttachedEvent:
      type: object
      required:
        - name
        - threadId
        - channelId
        - contactExternalId
        - contactDisplayName
        - contactKind
        - workspaceId
        - providers
      properties:
        name:
          type: string
          enum:
            - integration.thread.attached
        threadId:
          type: string
        channelId:
          type: string
          description: The channel this thread is bound to (thread-level binding, not part of the flattened ContactRef).
        contactExternalId:
          type: string
        contactDisplayName:
          type: string
        contactKind:
          $ref: '#/components/schemas/ContactKind'
        workspaceId:
          type: string
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderKind'
      allOf:
        - $ref: '#/components/schemas/IntegrationEvent'
      description: BC4 Thread & Routing -> BC5 Issue Execution. A conversation was bound to a workspace + providers; warms up workspace indexing. The ContactRef VO is flattened to scalar contact* fields.
    ThreadMode:
      type: string
      enum:
        - STEER
        - DIRECT
      description: Operator composer mode on a Thread. STEER = agents live, typed text is a whisper injected into agent context (never sent to the channel); DIRECT = thread paused, the operator talks directly on the channel as themselves. Promoted from the modeling's inline composerMode (mirrors the SenderIdentity promotion).
    ThreadStatus:
      type: string
      enum:
        - RUNNING
        - IDLE
        - NEEDS_ATTENTION
        - PAUSED
      description: Aggregate operating status of a Thread, derived from its issues + pause state. Drives the sidebar pill and Home cards. Referenced by the browser thread-status SSE frame.
