      description: Kind of transcript entry in a thread conversation. CONTACT (inbound), AGENT (agent reply), OPERATOR_DIRECT (operator spoke directly while paused), WHISPER (in-app steer, never sent to channel), ACTION (router/system audit line). Pattern from whatscode ChatEvent subtypes.
    WorkspaceBadge:
      type: string
      enum:
        - GIT
        - CLAUDE_PROJECT
      description: Detected trait of a registered workspace folder. GIT = a .git repository; CLAUDE_PROJECT = a Claude project marker. A workspace may carry both.
    WorkspaceRemovedEvent:
      type: object
      required:
        - name
        - workspaceId
        - path
      properties:
        name:
          type: string
          enum:
            - integration.workspace.removed
        workspaceId:
          type: string
        path:
          type: string
      allOf:
        - $ref: '#/components/schemas/IntegrationEvent'
      description: BC2 Workspace Registry -> BC4 Thread & Routing / BC5 Issue Execution. A workspace folder was removed; downstream contexts invalidate references to it.
