# `name` PINA o project namespace do compose. Sem ele o compose deriva o nome do DIRETÓRIO deste
# arquivo — `docker` — e QUALQUER outro repo cujo compose também more em `docker/` cai no MESMO
# namespace: o `stack:up` daqui ADOTA os containers do outro (renomeia para `${PROJECT}-${SERVICE}-*`
# e recria), e o outro repo perde a stack sem nada reportar o porquê. Já aconteceu com um monorepo
# vizinho. O nome é o único ponto onde isso se corta.
name: codm

services:
  lgtm:
    build:
      context: .
      dockerfile: Dockerfile.lgtm
    container_name: ${PROJECT}-${SERVICE}-lgtm
    ports:
      - "3000:3000"   # Grafana
      - "3100:3100"   # Loki
      - "3200:3200"   # Tempo
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8126:8126"   # Datadog APM
      - "9009:9009"   # Mimir
    volumes:
      - lgtm_tempo:/var/tempo
      - lgtm_loki:/var/loki
      - lgtm_mimir:/var/mimir
      - lgtm_grafana:/var/lib/grafana
    restart: unless-stopped
    networks:
      - default

  redis:
    image: redis:alpine
    container_name: ${PROJECT}-${SERVICE}-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default

volumes:
  redis_data:
  lgtm_tempo:
  lgtm_loki:
  lgtm_mimir:
  lgtm_grafana:
