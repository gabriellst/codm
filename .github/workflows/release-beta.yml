# Canal BETA = main (roadmap decisão 3): cada merge substitui a prerelease rolante `beta`.
# As máquinas do founder assinam este canal (echo beta > $CODM_DATA_DIR/update-channel) — o
# incidente do "daemon com binário de 15h" morre aqui. Desde 07/08/2026 o beta TAMBÉM é assinado
# com Developer ID e notarizado — não por causa do Gatekeeper, mas porque um app ad-hoc perde a
# permissão de disco a cada update e derruba os agentes (ver docs/RELEASE.md). Os ARTEFATOS DE
# UPDATE seguem assinados com a chave minisign (TAURI_SIGNING_PRIVATE_KEY), que é outra coisa e é
# o que o cliente verifica.
#
# O beta sai para TRÊS sistemas (docs/RELEASE.md, "Plataformas"): macOS arm64, Linux x64 e Windows
# x64, cada um no seu runner HOSPEDADO do GitHub, NATIVAMENTE.
#
# Por que isso merece um parágrafo: entre 07/08 e 26/08/2026 este workflow inteiro rodou no Mac mini
# do founder. A razão era cota — repositório PRIVADO fatura minutos hospedados (macOS 10×, Windows
# 2×, contra 2.000/mês), e em 2026-08-07 isso estourou (57 builds macOS num dia, ~3.250 minutos
# faturados) e derrubou TODOS os workflows; depois o billing reprovado travou a perna Windows, que
# virou um cross-compile experimental por `cargo-xwin` num runner Linux. Em 2026-08-26 o repositório
# ficou PÚBLICO, e Actions em repositório público é gratuito e ilimitado nos runners hospedados dos
# três SOs. O custo que justificava tudo aquilo deixou de existir, então o Mac mini saiu da reta de
# release e com ele saíram: o cross-compile do Windows (a perna é nativa de novo, e os testes
# `#[cfg(windows)]` do shell voltaram a rodar no fluxo normal), o container amd64 sob Rosetta do
# Linux (`ubuntu-latest` é x86_64 de verdade — sem patch de magic bytes do linuxdeploy, sem wrapper
# de `ldd`, sem sysctl de ipv6), o keychain de login destravado à mão, o `CARGO_TARGET_DIR` fora do
# workspace e a fila de três pernas num runner só (a v0.5.4 levou ~35 min de wall-clock para ~10 de
# compute). Agora as três pernas rodam EM PARALELO, em máquinas diferentes — que é também o que dá
# razão de existir à viagem dos artefatos entre `build` e `publish`.
#
# Um build por SO alimenta UM latest.json com as três plataformas; se um SO falhar, NADA é
# publicado — um manifest parcial deixaria uma plataforma presa numa versão enquanto o release
# avança.
name: release-beta

on:
  push:
    branches: [main]
    # Só o que ENTRA no app dispara um beta. Antes era todo push na main, e num único dia isso
    # gerou 36 builds — a maioria por mudança em docs, spec ou backend que o bundle nem carrega.
    # Mesmo filtro de caminho que o deploy-landing já usa (e por isso rodou 5 vezes no mesmo dia).
    # O filtro sobrevive à volta para runners hospedados: em repositório público os minutos são
    # gratuitos, mas 36 builds num dia continuam sendo 36 prereleases rolantes trocando de baixo do
    # pé de quem está no canal beta — o motivo do filtro nunca foi só dinheiro.
    paths:
      - 'packages/app/**'
      - 'packages/api/**'
      - 'packages/client/**'
      - 'packages/contracts/**'
      - 'scripts/release/**'
      - '.github/workflows/release-beta.yml'
  # Para publicar um beta sem esperar um push que case com os caminhos acima.
  workflow_dispatch: {}

# Um beta por vez; um merge novo cancela o build do anterior — o canal só quer o mais recente.
concurrency:
  group: release-beta
  cancel-in-progress: true

permissions:
  contents: write

env:
  # A ORIGEM PÚBLICA (spec SP2.5). Nasceu porque o repo era privado e asset de release privado 404a
  # para GET anônimo; o repo ficou público em 2026-08-26, mas a origem NÃO muda: esta base está
  # embarcada em todo app já instalado (config/updater.ts é compilado dentro do binário). Mudar aqui
  # sem mudar lá — ou mudar nos dois — deixa para trás exatamente quem já usa o produto.
  R2_PUBLIC: https://pub-ae0c8cac60c94920b35464575c09e67d.r2.dev
  R2_BUCKET: codm-releases

jobs:
  # ── 1. insumos, UMA vez ───────────────────────────────────────────────────────────────────────
  prepare:
    # Job UTILITY (não builda nada): só git/bash/jq — todos na imagem do runner — mais o `bun` que a
    # `uses:` abaixo traz. `ubuntu-latest` é o runner mais barato em tempo de partida, e desde
    # 2026-08-26 (repo público) não custa cota nenhuma. `publish` exige os três builds via `needs`,
    # então uma falha em qualquer um derruba a release inteira (D4: sem manifest parcial).
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      # A config do shell é GERADA (config/*.ts → tauri.conf.json, capabilities, shell-env.json) e
      # comitada; um build sobre um JSON desregenerado assaria uma CSP/env de ontem com a config de
      # hoje. Drift = build vermelho, AQUI — antes de qualquer um dos três builds gastar minutos de
      # cargo. Roda uma vez em `prepare` (é um check de repo, não depende do runner do build).
      - name: desktop config em dia
        run: bun desktop:generate --check


      # Versão do beta: base da conf + `-beta.<run>` — semver crescente por merge, sem commit de
      # bump (spec decisão 4). Injetada via --config em cada build, nunca escrita no repo. Calculada
      # AQUI, uma vez, para os três builds saírem com a MESMA versão (github.run_number é o mesmo
      # nos três, mas um único cálculo é um único lugar para errar).
      - name: version
        id: v
        run: echo "version=$(jq -r .version packages/app/tauri/src-tauri/tauri.conf.json)-beta.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # MESMO defeito invisível, uma camada mais fundo — ver o comentário gêmeo em
      # release-stable.yml. Com a chave vazia o console resolve para o NoopAnalyticsService e a
      # telemetria some SEM erro; a v0.3.0 saiu assim. O que falhou nas duas vezes não foi a repo
      # variable não existir, foi ela não CHEGAR ao passo de build — que é o que este teste cobre.
      - name: posthog presente
        run: |
          test -n "${{ vars.VITE_POSTHOG_KEY }}" || {
            echo "::error::vars.VITE_POSTHOG_KEY vazia — o app sairia com a telemetria desligada em silêncio. Defina a repo variable antes de publicar."
            exit 1
          }
          echo "posthog: ${{ vars.VITE_POSTHOG_HOST }} (chave presente, ${#POSTHOG_KEY} chars)"
        env:
          POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}

  # ── 2. um build por SO ────────────────────────────────────────────────────────────────────────
  build:
    needs: prepare
    strategy:
      # `fail-fast: false`, de propósito: o `publish` já exige os três verdes via `needs`, então a
      # garantia "um SO falhou ⇒ nada é publicado" não depende de cancelar os irmãos — e cancelar um
      # irmão no meio só joga fora o paralelismo que os runners hospedados devolveram.
      fail-fast: false
      matrix:
        include:
          # macOS arm64 — `macos-latest` é Apple Silicon (a imagem macOS 14+ do GitHub é ARM64). O
          # passo "runner macOS é arm64" abaixo CONFERE isso em vez de confiar: a chave desta
          # entrada (`darwin-aarch64`) também é a chave do manifest, então um runner x86_64
          # publicaria um bundle Intel sob a chave arm64 — updater quebrado sem nenhum erro.
          - key: darwin-aarch64
            runner: macos-latest
            bundles: app,dmg
          # Linux x64 — NATIVO em `ubuntu-latest` (x86_64 de verdade). Até 2026-08-26 era um
          # container amd64 sob Rosetta no Mac mini, e era o Rosetta que exigia a pilha inteira de
          # contorno que sumiu junto: patch dos bytes de magic do linuxdeploy, wrapper de `ldd`,
          # ipv6 desligado por sysctl, reconciliação de toolchain no entrypoint. Numa máquina Linux
          # real nada disso é problema. AppImage é o formato do updater (o .deb não se
          # auto-atualiza; existe para quem prefere o gerenciador de pacotes).
          #
          # `ubuntu-latest` acompanha a imagem mais nova do GitHub, e o glibc do runner vira o PISO
          # do AppImage: linkado em 24.04 ele não roda numa 22.04. Se aparecer relato de
          # `GLIBC_2.3x not found`, o conserto é fixar esta linha em `ubuntu-22.04` — ao custo de
          # essa imagem estar em fim de vida no GitHub.
          # `ubuntu-22.04`, não `ubuntu-latest` (24.04), por DOIS motivos que apontam para o mesmo
          # lado. (1) O bundler do AppImage baixa o linuxdeploy — que é ele mesmo um AppImage — e na
          # 24.04 ele morre sem stderr algum mesmo com `APPIMAGE_EXTRACT_AND_RUN=1` (medido nos dois
          # primeiros builds hospedados, 2026-08-26: só sobra `failed to run linuxdeploy`, porque o
          # Tauri engole a saída do bundler). (2) O glibc da imagem é o PISO do AppImage publicado:
          # linkado na 24.04 ele recusa rodar numa 22.04, e quem paga essa conta é o usuário, não o
          # CI. Quando a 22.04 sair do GitHub, o substituto é a imagem mais VELHA ainda suportada —
          # não a mais nova.
          - key: linux-x86_64
            runner: ubuntu-22.04
            bundles: appimage,deb
          # Windows x64 — NATIVO em `windows-latest`, de volta desde 2026-08-26. Entre 25/08 e 26/08
          # esta perna foi CROSS-COMPILADA num runner Linux via `cargo-xwin` (rota que o próprio
          # Tauri documenta como EXPERIMENTAL), porque o billing hospedado estava reprovado — e o
          # cross nunca conseguiu provar o que mais importa: que o PE que ele linka executa. Aqui
          # executa, então o smoke dos sidecars e os testes `#[cfg(windows)]` do shell (que viviam
          # num workflow `workflow_dispatch`-only à parte, apagado nesta mudança) rodam no fluxo
          # normal, gateando a release. NSIS segue como formato único: o updater o instala em
          # silêncio, e um MSI seria um segundo caminho de update.
          - key: windows-x86_64
            runner: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        # NÃO é redundante: o shell default do Windows é pwsh, e todo passo abaixo é escrito em bash
        # (git-bash no Windows) — um `||`, um `test` ou um heredoc executado em pwsh falha, às vezes
        # em silêncio. macOS e Linux já usam bash por padrão.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/api/go/go.mod

      # A chave desta entrada (`darwin-aarch64`) é a chave do manifest e vira o sufixo dos artefatos.
      # `macos-latest` é ARM desde a imagem macOS 14, mas "é" não é "continuará sendo": se o GitHub
      # mover o alias, o bundle sairia x86_64 com nome arm64 e o updater entregaria o binário errado
      # a toda máquina Apple Silicon — sem um único erro no caminho. Um `uname -m` custa nada.
      - name: runner macOS é arm64
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = "arm64" || {
            echo "::error::runner macOS é $(uname -m), não arm64 — a chave darwin-aarch64 publicaria um bundle da arquitetura errada. Fixe o runner numa imagem ARM (ex.: macos-15)."
            exit 1
          }

      # Toolchain de sistema do Tauri no Ubuntu (webkit2gtk 4.1 + tray + rsvg) e o que este shell
      # puxa por cima: libdbus-1-dev (keyring `sync-secret-service`), patchelf (AppImage). O runner
      # hospedado não traz nada disso. `runner.os` é a condição certa aqui — é identidade de SO
      # (só o Linux linka contra webkit2gtk), não uma inferência sobre o runner.
      - name: deps de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf

      # Runner hospedado é DESCARTÁVEL: o Rust vem da action e o cache de cargo é bem-vindo em toda
      # perna. O veto histórico a `Swatinem/rust-cache` NÃO era sobre a action ser ruim — era sobre
      # runner PERSISTENTE: o passo de save dela poda `~/.cargo/bin` para salvar um cache enxuto, e
      # em 2026-08-07 isso apagou o binário `rustup` da máquina do founder, deixando cargo/rustc/
      # rustfmt como symlinks pendurados (o build que causou o estrago passou verde; quem falhou foi
      # o workflow seguinte, com `Executable not found in $PATH: "cargo"`). Num runner que morre com
      # o job, essa poda não tem vítima. A regra que fica: ao adicionar qualquer action de
      # cache/setup, olhe o que o passo `Post` dela escreve FORA do workspace — aqui, nada
      # sobrevive ao job de qualquer forma.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/tauri/src-tauri

      # `BUNDLE_DIR` declarado UMA VEZ aqui e consumido por lookup nos passos que precisam do bundle
      # (`stage`, o gate de assinatura), em vez de cada um recalcular a expressão por conta própria
      # (rail non-negotiable #5). Foi essa duplicação que já divergiu uma vez, com o `tauri build`
      # verde e o `stage` falhando logo depois.
      - name: bundle dir (declarado uma vez)
        run: echo "BUNDLE_DIR=packages/app/tauri/src-tauri/target/release/bundle" >> "$GITHUB_ENV"

      - name: deps
        run: bun install --frozen-lockfile


      # Sem `--target`: cada perna builda para o próprio host — `build-sidecars.ts` resolve o triple
      # e o prebuild nativo do libsql a partir de `process.platform`/`process.arch`. O modo cross do
      # script (`--target win32-x64`) existia só para a fase do `cargo-xwin` e foi removido com ela;
      # o script rejeita qualquer argumento hoje, em vez de aceitar um `--target` que ninguém honra.
      - name: sidecars
        run: cd packages/app/tauri && bun config/build-sidecars.ts

      # Os testes `#[cfg(windows)]` do shell (reaper/lifecycle/watchdog) só COMPILAM num host
      # Windows, e este é o único job do repo que roda cargo num. Eles viviam em
      # `windows-native-tests.yml` (`workflow_dispatch`-only, não-bloqueante) enquanto a perna
      # Windows era cross-compilada num runner Linux; com a perna nativa de volta eles rodam aqui,
      # GATEANDO a release — que é o lugar deles. `--lib` compila só a crate, sem bundle; os
      # binários dos sidecars já existem (passo acima), então o `build.rs` resolve
      # `externalBin`/`resources` sem erro.
      - name: cargo test do shell (testes cfg(windows))
        if: runner.os == 'Windows'
        run: cargo test --manifest-path packages/app/tauri/src-tauri/Cargo.toml --lib

      # O gate que o build sozinho nunca dá (build-sidecars.ts: "compila limpo e morre no primeiro
      # connect"). Sobe os dois binários recém-compilados como o shell sobe — cwd daemon-runtime,
      # mesmo env — e exige 200 no health de cada um. É AQUI que um prebuild do libsql faltando, um
      # Go que não linka no SO, ou uma migração quebrada aparecem: antes do tauri build de 10 min,
      # não na máquina do usuário. Contrato do script (A-smoke-sidecars): invocado da raiz, sem
      # args; resolve sozinho data dir temporário, CODM_MIGRATIONS_DIR e portas; CODM_APP_VERSION
      # é env opcional.
      #
      # Roda nas TRÊS pernas desde 2026-08-26. Enquanto o Windows era cross-compilado num runner
      # Linux esta perna pulava o smoke (não dá para executar um PE Windows no Linux) e a prova
      # ficava num workflow manual; agora cada binário é exercitado no SO em que vai rodar, antes
      # de virar release.
      - name: smoke dos sidecars
        env:
          CODM_APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: bun scripts/release/smoke-sidecars.ts

      # A Apple exige que TODO Mach-O dentro do bundle seja assinado com Developer ID E com
      # timestamp seguro. O Tauri assina o .app e os `externalBin`, mas NÃO o que entra por
      # `bundle.resources` — e o closure do libsql traz um `.node`, que é Mach-O; a notarização da
      # v0.4.0 reprovou exatamente nele. Num runner hospedado NÃO existe keychain com o
      # certificado, então o passo monta um temporário a partir do `.p12` dos secrets — o mesmo que
      # o próprio bundler do Tauri faz mais adiante, só que aqui precisa acontecer ANTES.
      - name: assina os Mach-O aninhados nos resources
        if: runner.os == 'macOS'
        env:
          IDENTITY: "Developer ID Application: BK COMPANY LTDA (V4F6T68S5B)"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN="$RUNNER_TEMP/codm-nested-signing.keychain-db"

          # Só os diretórios STAGED COMO RESOURCE. Os sidecars (`codm-daemon`, `codm-gateway`) ficam
          # de fora de propósito: o Tauri os assina como `externalBin`, e a notarização confirmou —
          # ela reclamou do `.node` e de mais nada.
          LIST="$RUNNER_TEMP/nested-machos.txt"
          : > "$LIST"
          find packages/app/tauri/src-tauri/binaries/daemon-runtime \
               packages/app/tauri/src-tauri/binaries/migrations \
               -type f 2>/dev/null | while IFS= read -r f; do
            # `if`, nunca `cmd && cmd`: sob `set -e` o `&&` que falha no ÚLTIMO comando do corpo
            # mata o laço, e o primeiro `.js` do node_modules (não é Mach-O) fazia grep sair 1 e o
            # passo morrer sem imprimir uma linha sequer. Reproduzido no /bin/bash 3.2 do runner.
            if file "$f" | grep -q "Mach-O"; then printf '%s\n' "$f" >> "$LIST"; fi
          done
          if [ ! -s "$LIST" ]; then echo "nenhum Mach-O aninhado — nada a assinar"; exit 0; fi

          KEYCHAIN_PW="$(openssl rand -base64 24)"
          CERT="$RUNNER_TEMP/codm-nested-cert.p12"
          # O keychain e o .p12 saem do disco aconteça o que acontecer, e a lista de busca volta ao
          # que era. O runner morre com o job, mas o `.p12` DECODIFICADO ficaria legível pelos
          # passos seguintes do mesmo job — o trap fecha essa janela (e mantém o passo honesto caso
          # um dia volte a rodar numa máquina persistente).
          PREV_KEYCHAINS="$(security list-keychains -d user | sed 's/[",]//g' | xargs)"
          cleanup() {
            security list-keychains -d user -s $PREV_KEYCHAINS >/dev/null 2>&1 || true
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
            rm -f "$CERT"
          }
          trap cleanup EXIT

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          # Sem isto o codesign trava num prompt de autorização que não existe num runner sem TTY.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # `codesign` procura na LISTA DE BUSCA, não no keychain que acabamos de criar — sem
          # acrescentá-lo aqui, a identidade importada segue invisível.
          security list-keychains -d user -s "$KEYCHAIN" $PREV_KEYCHAINS >/dev/null

          found=0
          while IFS= read -r f; do
            found=$((found + 1))
            echo "assinando $f"
            codesign --force --timestamp --options runtime --keychain "$KEYCHAIN" -s "$IDENTITY" "$f"
            codesign -dv --verbose=2 "$f" 2>&1 | grep -E "^Authority=Developer ID Application" || {
              echo "::error::$f não ficou com Developer ID depois do codesign"
              exit 1
            }
          done < "$LIST"
          echo "Mach-O aninhados assinados: $found"

      # A origem da nuvem NÃO é uma repo variable: é a decisão declarada em config/cloud.ts,
      # derivada por config/env.ts e renderizada em shell-env.json — o MESMO valor que o build.rs
      # entrega ao supervisor Rust e este passa ao daemon em CODM_CLOUD_URL. O console recebe pelo
      # VITE_CODM_CLOUD_URL exportado aqui (o Vite resolve VITE_* no BUILD). Um release sem ela
      # produz um app cujo login abre localhost:3030 e um daemon que responde 503 CLOUD_UNREACHABLE
      # a toda tela — defeito INVISÍVEL no artefato (os assets vão comprimidos dentro do binário;
      # nenhum grep no .app prova que a URL foi assada). Medido na v0.1.3 (console) e na v0.5.1
      # (daemon). Um passo POR SO (não em `prepare`): GITHUB_ENV não atravessa jobs, e cada entrada
      # da matriz roda no seu próprio job.
      - name: cloud url do manifesto
        run: |
          CLOUD_URL="$(jq -r .daemon.CODM_CLOUD_URL packages/app/tauri/src-tauri/shell-env.json)"
          case "$CLOUD_URL" in
            https://*) ;;
            *)
              echo "::error::shell-env.json daemon.CODM_CLOUD_URL='$CLOUD_URL' não é uma origem https — corrija config/cloud.ts e rode bun desktop:generate"
              exit 1
              ;;
          esac
          echo "VITE_CODM_CLOUD_URL=$CLOUD_URL" >> "$GITHUB_ENV"
          echo "cloud: $CLOUD_URL"

      # UM ATALHO DE `ldd` PARA BINÁRIO ESTÁTICO — sem ele o AppImage não é empacotado.
      #
      # O plugin gtk do linuxdeploy roda `ldd` em tudo que está no AppDir, inclusive nos dois
      # sidecars. O gateway é um binário Go ESTÁTICO: `ldd` responde "not a dynamic executable" e
      # sai com código 1 — comportamento correto dele —, e o linuxdeploy trata qualquer saída não
      # zero como fatal: `terminate called after throwing 'std::runtime_error' what(): Failed to run
      # ldd: exited with code 1`, plugin gtk exit 134, bundling abortado. Levou três builds para
      # aparecer porque o Tauri engole o stderr do bundler (daí o `--verbose` abaixo).
      #
      # O atalho NÃO MENTE: ele chama o `ldd` de verdade e só traduz o caso do binário estático para
      # a frase que o linuxdeploy sabe ler, com saída zero. Um binário dinâmico com dependência
      # faltando continua reportando o que reportava. A imagem do container que saiu na migração
      # tinha esse mesmo wrapper embutido; aqui ele fica declarado, onde se lê.
      - name: atalho de ldd para os sidecars estáticos (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/ldd" <<'SH'
          #!/bin/sh
          out=$(/usr/bin/ldd "$@" 2>&1) && { printf '%s\n' "$out"; exit 0; }
          printf '\tnot a dynamic executable\n'
          exit 0
          SH
          chmod +x "$RUNNER_TEMP/bin/ldd"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # `--bundles` restringe o que este SO empacota (a conf gerada segue com `targets: 'all'`):
      # macOS app+dmg, Linux appimage+deb, Windows só nsis. Os artefatos de update (.sig) saem
      # junto do bundle que o updater consome em cada SO (app.tar.gz / AppImage / -setup.exe).
      #
      # Cada perna builda para o próprio host: sem `--runner`/`--target`. A limpeza de
      # `$BUNDLE_DIR` que existia aqui saiu junto com o self-hosted — ela existia porque o
      # `CARGO_TARGET_DIR` morava num volume persistente e os bundles ACUMULAVAM entre runs, e os
      # globs do `stage` (`*.deb`, `*.dmg`, `*-setup.exe`) exigem exatamente um arquivo por pasta.
      # Num runner descartável o diretório nasce vazio a cada run.
      - name: tauri build
        env:
          # O linuxdeploy que o bundler do AppImage baixa é ELE MESMO um AppImage, e montar um
          # AppImage exige FUSE — que a imagem do `ubuntu-latest` não traz. Sem esta linha ele morre
          # sem stderr algum (o Tauri engole a saída do bundler) e o único sinal é
          # `failed to bundle project: failed to run linuxdeploy` — medido no primeiro build
          # hospedado, 2026-08-26. `EXTRACT_AND_RUN` manda extrair em vez de montar: nada de FUSE,
          # nada de sudo. Inócua nas outras pernas — só o bundler do AppImage lê esta variável.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # VITE_CODM_CLOUD_URL chega pelo GITHUB_ENV do passo "cloud url do manifesto" acima —
          # lida do shell-env.json comitado, não de uma repo variable. O console é compilado DENTRO
          # do tauri build (beforeBuildCommand) e o Vite resolve VITE_* no BUILD.
          # Telemetria de produto (SP4). O Vite resolve VITE_* no BUILD: sem estas linhas o app sai
          # com a chave vazia e a telemetria fica desligada EM SILÊNCIO — sem erro, só um dashboard
          # que nunca enche. Repo variables, não secrets: a chave de ingest do PostHog é pública.
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          # A MESMA chave minisign assina os três SOs — é a pubkey embarcada que o cliente verifica.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Chave gerada com --ci = senha vazia; sem esta linha o build tenta abrir um prompt de
          # senha num runner sem TTY e morre com "Device not configured" (medido localmente).
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Assinatura Apple — NÃO é a chave acima (aquela é minisign, do updater). Sem estas o
          # build sai ad-hoc, e o grant de TCC de um app ad-hoc fica preso ao cdhash: todo update
          # invalida a permissão de disco e os agentes gerados pelo daemon perdem o workspace
          # (medido na v0.2.0, 07/08/2026 — "System Policy: deny file-read-data /Users/.../Desktop").
          # Nos runners Linux/Windows estas variáveis são ignoradas — só o bundler macOS as lê
          # (as APPLE_* de secrets chegam vazias; a identity abaixo é constante e inofensiva lá).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: BK COMPANY LTDA (V4F6T68S5B)"
          # Notarização: sem ela o Gatekeeper barra o .dmg baixado do R2.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: V4F6T68S5B
          # Janela de instalação do DMG (fundo + posição dos ícones, config/dmg.ts): o bundler a
          # aplica abrindo o volume no Finder por AppleScript, e PULA esse passo quando vê CI=true
          # (`--skip-jenkins`, tauri#592) — sem esta linha o DMG sai sem `.DS_Store` e a janela vem
          # crua (medido na v0.5.3). ESTE É O PONTO DE RISCO DA MIGRAÇÃO PARA RUNNER HOSPEDADO: no
          # Mac mini o runner era um LaunchAgent na sessão gráfica e tinha (depois de um grant
          # manual) Automação → Finder; um runner hospedado não tem esse grant e pode não ter
          # sessão gráfica utilizável. Se o primeiro DMG hospedado sair cru — ou o bundler morrer
          # com `exit 64` em "failed to run bundle_dmg.sh" —, a decisão já tomada é voltar SÓ esta
          # perna (`darwin-aarch64`) para o runner self-hosted do mini, NÃO desfazer a migração das
          # outras duas. Ver docs/RELEASE.md, "A janela do DMG precisa do Finder".
          TAURI_BUNDLER_DMG_IGNORE_CI: ${{ runner.os == 'macOS' && 'true' || '' }}

        run: cd packages/app/tauri && bun x tauri build --verbose --bundles ${{ matrix.bundles }} --config "{\"version\":\"${{ needs.prepare.outputs.version }}\"}"

      # A conf fica com signingIdentity '-' de propósito (rail DSK-10: build local não deve exigir
      # certificado); a identidade real vem do APPLE_SIGNING_IDENTITY acima, que a sobrepõe. Se essa
      # sobreposição falhar, o app sai ad-hoc e o defeito é INVISÍVEL no artefato — só aparece na
      # máquina do usuário, quando o TCC prende a permissão de disco ao cdhash e os agentes perdem o
      # workspace no update seguinte (v0.2.0, 07/08/2026). Verificar na saída é a única defesa.
      #
      # O caminho sai de $BUNDLE_DIR, o MESMO declarado no passo "bundle dir" acima e consumido pelo
      # `stage` logo abaixo — nunca recomputado aqui: um gate apontando para outro caminho falharia
      # por motivo errado, ou pior, passaria por não encontrar nada para reprovar.
      - name: assinatura Apple presente no bundle
        if: runner.os == 'macOS'
        run: |
          APP=$(ls -d "$BUNDLE_DIR"/macos/*.app | head -1)
          if ! codesign -dv --verbose=2 "$APP" 2>&1 | grep -q "^Authority=Developer ID Application"; then
            echo "::error::$APP saiu SEM Developer ID (provavelmente ad-hoc). Confira os secrets APPLE_*."
            codesign -dv --verbose=2 "$APP" 2>&1 | head -20
            exit 1
          fi
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "^Authority=|^TeamIdentifier="

      # Nomes FIXOS de asset — a URL do manifest não muda entre versões (config/updater.ts). Os
      # nomes novos carregam o SO (`codm-linux-x86_64.AppImage`, `codm-windows-x86_64-setup.exe`)
      # porque `x86_64` sozinho não diz qual; o macOS mantém `codm-aarch64.*` — URL que a landing e
      # todo app instalado já conhecem.
      #
      # $BUNDLE_DIR vem do `$GITHUB_ENV` escrito lá em cima ("bundle dir") — o `stage` só faz lookup
      # da env var, nunca recomputa a expressão (foi exatamente essa duplicação que divergiu uma vez,
      # com o `tauri build` verde e o `stage` falhando logo depois).
      # O nome que o Tauri estampou em cada instalador (`CoDM_<versão>..._<arch>.<ext>`, de
      # productName + version da conf) é o nome que o browser deve SALVAR — vai no
      # Content-Disposition do alias, lá no `publish`. Lido do artefato, NUNCA remontado por uma
      # segunda fórmula (uma fórmula paralela diverge na primeira mudança de nome do bundler).
      #
      # Cada entrada escreve o SEU PRÓPRIO `NAMES-<matrix.key>.env` — nunca um nome compartilhado:
      # os três artifacts se fundem num único `dist-release/` no `publish` (`merge-multiple:
      # true`), e um nome de arquivo repetido entre eles perderia dois dos três na sobrescrita
      # silenciosa. O `case` abaixo chaveia por `matrix.key` — a chave da matriz É a chave do
      # manifest, então o mapeamento fica preso ao contrato que o `publish` consome, e não a um
      # `$RUNNER_OS` que só por coincidência hoje é 1:1 com ela.
      - name: stage
        run: |
          set -euo pipefail
          BUNDLE="$BUNDLE_DIR"
          mkdir -p dist-release
          NAMES="dist-release/NAMES-${{ matrix.key }}.env"
          case "${{ matrix.key }}" in
            darwin-aarch64)
              cp "$BUNDLE"/macos/*.app.tar.gz     dist-release/codm-aarch64.app.tar.gz
              cp "$BUNDLE"/macos/*.app.tar.gz.sig dist-release/codm-aarch64.app.tar.gz.sig
              cp "$BUNDLE"/dmg/*.dmg              dist-release/codm-aarch64.dmg
              echo "DMG_NAME=$(basename "$(ls "$BUNDLE"/dmg/*.dmg | head -1)")" >> "$NAMES" ;;
            linux-x86_64)
              cp "$BUNDLE"/appimage/*.AppImage     dist-release/codm-linux-x86_64.AppImage
              cp "$BUNDLE"/appimage/*.AppImage.sig dist-release/codm-linux-x86_64.AppImage.sig
              cp "$BUNDLE"/deb/*.deb               dist-release/codm-linux-x86_64.deb
              echo "APPIMAGE_NAME=$(basename "$(ls "$BUNDLE"/appimage/*.AppImage | head -1)")" >> "$NAMES"
              echo "DEB_NAME=$(basename "$(ls "$BUNDLE"/deb/*.deb | head -1)")" >> "$NAMES" ;;
            windows-x86_64)
              cp "$BUNDLE"/nsis/*-setup.exe     dist-release/codm-windows-x86_64-setup.exe
              cp "$BUNDLE"/nsis/*-setup.exe.sig dist-release/codm-windows-x86_64-setup.exe.sig
              echo "SETUP_EXE_NAME=$(basename "$(ls "$BUNDLE"/nsis/*-setup.exe | head -1)")" >> "$NAMES" ;;
            *) echo "::error::matrix.key desconhecido: ${{ matrix.key }}"; exit 1 ;;
          esac
          ls -la dist-release

      # Cada SO entrega o seu pedaço; o `publish` junta os três. `if-no-files-found: error` porque
      # um stage vazio não pode virar um manifest sem plataforma em silêncio.
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.key }}
          path: dist-release/
          if-no-files-found: error
          retention-days: 3

  # ── 3. um manifest, uma release, um upload ────────────────────────────────────────────────────
  publish:
    needs: [prepare, build]
    # Job UTILITY: baixa os três artifacts, fala com GitHub e R2. `ubuntu-latest` traz `gh`, `jq` e
    # `stat` do GNU (o `-c %s` do passo de verificação) prontos — nada a provisionar além do bun/node
    # das `uses:` abaixo. É aqui que os artefatos das TRÊS máquinas se encontram: com as pernas em
    # paralelo em runners diferentes, o upload/download de artifact é a única forma de juntá-los.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # O wrangler (upload R2, mais abaixo) roda sob NODE, nao sob bun: sob bun ele sai com codigo
      # 0 sem subir nada em cerca de metade das execucoes — o que aqui publicaria um latest.json
      # apontando para um asset inexistente. Ver o comentario longo em deploy-landing.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist-release

      # A lista COMPLETA, conferida antes de tocar em release ou R2: `needs` garante que os três
      # jobs passaram, não que cada um stageou tudo que o manifest vai apontar.
      - name: todos os artefatos presentes
        run: |
          set -e
          for f in codm-aarch64.app.tar.gz codm-aarch64.app.tar.gz.sig codm-aarch64.dmg \
                   codm-linux-x86_64.AppImage codm-linux-x86_64.AppImage.sig codm-linux-x86_64.deb \
                   codm-windows-x86_64-setup.exe codm-windows-x86_64-setup.exe.sig; do
            test -s "dist-release/$f" || { echo "::error::artefato ausente ou vazio: $f"; exit 1; }
          done
          ls -la dist-release

      # Um `NAMES-<key>.env` por SO (do `stage`, no `build`) — cada um com o nome que o Tauri
      # estampou naquele instalador. `source`ados aqui, viram env do JOB inteiro (`$GITHUB_ENV`) e
      # alimentam o `--content-disposition` do upload abaixo. As QUATRO variáveis são exigidas: um
      # `stage` que não escreveu a sua quebraria o alias correspondente em silêncio.
      - name: nomes dos artefatos (Content-Disposition)
        run: |
          set -euo pipefail
          for f in dist-release/NAMES-*.env; do
            test -s "$f" || { echo "::error::$f ausente ou vazio — o stage daquele SO não gravou o nome"; exit 1; }
            cat "$f" >> "$GITHUB_ENV"
          done
          # Sinalização ENTRE JOBS, não artefato de release: some daqui para não virar asset do GH
          # release (`dist-release/*` no passo `publish` abaixo) nem quebrar o `verifica no r2`
          # (que assume que TUDO que sobrou em dist-release/ subiu ao bucket).
          rm -f dist-release/NAMES-*.env

      - name: nomes cobrem os 4 instaladores
        run: |
          set -euo pipefail
          for v in DMG_NAME APPIMAGE_NAME DEB_NAME SETUP_EXE_NAME; do
            test -n "${!v:-}" || { echo "::error::$v vazio — algum NAMES-<key>.env não gravou a variável esperada"; exit 1; }
          done
          echo "DMG_NAME=$DMG_NAME APPIMAGE_NAME=$APPIMAGE_NAME DEB_NAME=$DEB_NAME SETUP_EXE_NAME=$SETUP_EXE_NAME"

      # Um latest.json, três plataformas — as chaves são as que o tauri-plugin-updater consulta
      # (`<os>-<arch>` do alvo Rust). Cada URL é o artefato de UPDATE daquele SO, não o instalador
      # humano (dmg/deb ficam fora do manifest). Este passo consome o CLI multi-`--platform` do
      # make-manifest (task do FRONT B) — o CLI antigo, single-platform, aceitaria esta invocação
      # em silêncio (argv.indexOf pega o primeiro --url) e publicaria um manifest só-darwin; por
      # isso o passo seguinte ASSERTA as três chaves antes de tocar release ou R2.
      - name: manifest
        run: >
          bun scripts/release/make-manifest.ts
          --version "${{ needs.prepare.outputs.version }}"
          --notes "beta — main@${{ github.sha }}"
          --out dist-release/latest.json
          --platform darwin-aarch64 --url "$R2_PUBLIC/beta/codm-aarch64.app.tar.gz" --sig-file dist-release/codm-aarch64.app.tar.gz.sig
          --platform linux-x86_64 --url "$R2_PUBLIC/beta/codm-linux-x86_64.AppImage" --sig-file dist-release/codm-linux-x86_64.AppImage.sig
          --platform windows-x86_64 --url "$R2_PUBLIC/beta/codm-windows-x86_64-setup.exe" --sig-file dist-release/codm-windows-x86_64-setup.exe.sig

      # Código de saída não é prova (lição do wrangler): o manifest precisa CONTER as três
      # plataformas, com url https e assinatura não vazia, antes de qualquer publicação. Um
      # manifest parcial deixaria um SO preso numa versão para sempre — em silêncio.
      - name: manifest cobre as 3 plataformas
        run: |
          set -euo pipefail
          jq -e '.platforms | keys == ["darwin-aarch64","linux-x86_64","windows-x86_64"]' dist-release/latest.json
          jq -e '.platforms | all(.url and (.url | startswith("https://")) and (.signature | length > 0))' dist-release/latest.json
          jq '.version, (.platforms | keys)' dist-release/latest.json

      # SHA-256 de tudo que vai ao ar. O instalador Windows não tem assinatura Authenticode nesta
      # fase (candidatura ao SignPath em aberto) e o SmartScreen barra o download — o checksum é o
      # único meio que damos hoje a quem quer conferir o que baixou antes de executar. Formato
      # padrão `sha256sum`, um artefato por linha, nomes IGUAIS aos dos assets: quem baixar tudo
      # numa pasta roda `sha256sum -c SHA256SUMS.txt` e pronto.
      #
      # Gerado dos MESMOS bytes que sobem, aqui, antes de qualquer upload — nunca relido do
      # GitHub/R2 depois. Um checksum calculado sobre o que já está publicado não prova nada: ele
      # descreveria o arquivo corrompido com a mesma naturalidade.
      #
      # Escrito em $RUNNER_TEMP e só então movido: `sha256sum * > SHA256SUMS.txt` no mesmo diretório
      # corre o risco de a redireção criar o arquivo antes do glob expandir, e o somatório passaria
      # a incluir a si mesmo (vazio) — falso-verde silencioso na verificação de quem baixou.
      - name: sha256 dos artefatos
        run: |
          set -euo pipefail
          cd dist-release
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS.txt"
          mv "$RUNNER_TEMP/SHA256SUMS.txt" SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Prerelease ROLANTE: recria a release `beta` inteira a cada merge. Prerelease nunca é vista
      # pelo endpoint stable (releases/latest ignora prereleases por natureza).
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete beta --yes --cleanup-tag || true
          gh release create beta --prerelease \
            --title "beta ${{ needs.prepare.outputs.version }}" \
            --notes "Canal beta (main@${{ github.sha }}) — macOS arm64 (assinado e notarizado), Linux x64 (AppImage/deb) e Windows x64 (NSIS, sem assinatura: o SmartScreen avisa). Instalação e canais: docs/RELEASE.md." \
            dist-release/*

      # A ORIGEM PÚBLICA é o R2 (spec SP2.5): repo privado ⇒ assets do GitHub 404am anônimos —
      # tanto para o download da landing quanto para o auto-updater. O canal beta é ROLANTE:
      # sobrescreve os mesmos objetos a cada merge; a versão vive no latest.json — e no NOME que o
      # browser salva: os quatro instaladores de nome fixo sobem com `Content-Disposition:
      # attachment; filename=$X_NAME` ($DMG_NAME/$APPIMAGE_NAME/$DEB_NAME/$SETUP_EXE_NAME, do
      # `stage`), porque `<a download>` é ignorado em origem cruzada (r2.dev).
      #
      # `npx`, nunca `bunx` — ver deploy-landing.yml. E o latest.json sobe POR ÚLTIMO: um manifest
      # que aponta para um binário que ainda não subiu é um updater baixando 404.
      - name: upload r2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # put <nome=arquivo em dist-release> <content-type> [nome salvo pelo browser]
          put() {
            local name="$1" ctype="$2" cd="${3:-}"
            if [ -n "$cd" ]; then
              npx --yes wrangler@4.120.0 r2 object put "$R2_BUCKET/beta/$name" --file "dist-release/$name" --content-type "$ctype" --content-disposition "attachment; filename=\"$cd\"" --remote
            else
              npx --yes wrangler@4.120.0 r2 object put "$R2_BUCKET/beta/$name" --file "dist-release/$name" --content-type "$ctype" --remote
            fi
          }
          put codm-aarch64.app.tar.gz            application/gzip
          put codm-aarch64.app.tar.gz.sig        text/plain
          put codm-aarch64.dmg                   application/x-apple-diskimage                    "$DMG_NAME"
          put codm-linux-x86_64.AppImage         application/vnd.appimage                          "$APPIMAGE_NAME"
          put codm-linux-x86_64.AppImage.sig     text/plain
          put codm-linux-x86_64.deb              application/vnd.debian.binary-package             "$DEB_NAME"
          put codm-windows-x86_64-setup.exe      application/vnd.microsoft.portable-executable      "$SETUP_EXE_NAME"
          put codm-windows-x86_64-setup.exe.sig  text/plain
          # `text/plain` (sem Content-Disposition): a lista de checksums é para ABRIR no navegador
          # ao lado do botão de download, não para virar um arquivo baixado que ninguém olha.
          put SHA256SUMS.txt                     "text/plain; charset=utf-8"
          put latest.json                        application/json

      # O wrangler já saiu 0 sem publicar (deploy-landing, 2026-08-08). Código de saída não é prova;
      # o objeto no ar é. Confere tamanho byte a byte contra o arquivo local, para os nove.
      - name: verifica no r2
        run: |
          set -euo pipefail
          for f in dist-release/*; do
            name=$(basename "$f")
            local_size=$(stat -c %s "$f")
            remote_size=$(curl -sfI "$R2_PUBLIC/beta/$name" | tr -d '\r' | awk 'tolower($1)=="content-length:"{print $2}')
            if [ "$local_size" != "$remote_size" ]; then
              echo "::error::$name no R2 tem ${remote_size:-nada} bytes; local tem $local_size — o upload não aconteceu."
              exit 1
            fi
            echo "ok $name ($local_size bytes)"
          done
