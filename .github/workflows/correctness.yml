name: correctness

# Rung-2 merge gate (docs/CORRECTNESS.md §4): the mechanical detectors run on every push /
# PR. New violations gate; pre-existing debt is frozen in the per-detector *.baseline.json
# files and ratcheted down over time. Companion to tsc + test, which run in the same job.
#
# Há um SEGUNDO job, `linux`: o shell desktop sai para Linux e Windows, e um PR que só compila no
# Mac do founder passava verde até o beta quebrar 10 minutos depois do merge. O job compila os
# sidecars, faz `cargo check` do shell e sobe os sidecars (smoke) num Linux de verdade. Windows fica
# de fora daqui — quem pega quebra de Windows é a perna nativa do release-beta, que desde 2026-08-26
# roda `cargo test --lib` (os testes `#[cfg(windows)]`) e o smoke num `windows-latest`.
#
# RUNNERS: hospedados. Entre 07/08 e 26/08/2026 estes jobs rodaram no Mac mini do founder — não por
# preferência, mas porque a cota de Actions de repositório PRIVADO estourou em 2026-08-07 e levou o
# gate de merge junto (a cota é uma só para a conta: quando os builds macOS a esgotaram, este
# workflow barato parou também). Em 2026-08-26 o repositório ficou público, Actions passou a ser
# gratuito e ilimitado, e o gate voltou a não depender de nenhuma máquina estar ligada.
#
# Com isso saiu também o guard `if:` que impedia PR de fork de executar nos jobs de entrada: ele
# existia porque `pull_request` é o ÚNICO gatilho deste arquivo e um fork rodaria código arbitrário
# na máquina do founder. Sem máquina do founder na jogada, não há o que proteger — o runner é
# descartável e o GitHub já não entrega secrets a workflow de fork. A política do repositório
# (Actions → Fork pull request workflows → "Require approval for all outside collaborators")
# continua valendo por outros motivos e não é gerida por este arquivo.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  detect:
    # `bun run test` inclui `app-tauri:test` (cargo test do shell, com `dependsOn: sidecars`) e
    # `client:test` (cargo test da SDK rust), então este job precisa de MAIS que bun: Go para o
    # gateway, Rust para as duas crates e as libs de sistema do Tauri. Tudo isso vinha de graça
    # quando o runner era o Mac do founder; num runner hospedado é provisionamento explícito, nos
    # passos abaixo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # registry-scan / slice-closure walk `git ls-files` — need full history-free but
          # complete tree; default fetch-depth 1 is fine since they read the working tree.
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/api/go/go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/tauri/src-tauri

      # Mesma lista canônica dos workflows de release: webkit2gtk 4.1 + tray + rsvg (Tauri), mais
      # libdbus-1-dev (keyring) e patchelf. O `cargo test` do shell linka contra ela.
      - name: Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # O //go:embed do gateway (public/embed.go) aponta docs/openapi.json — GERADO, presente em
      # todo checkout de dev e ausente num runner limpo. Sem isto o type-check (que compila o Go)
      # morre com "no matching files found" — mesmo fix do release-beta (2026-08-07).
      - name: Generated embed inputs (openapi)
        run: |
          cp -n .env.example .env
          bun emit-openapi

      # O `nice -n 10` que envolvia estes três passos saiu com o self-hosted: ele existia para o CI
      # ceder CPU ao daemon de produção do founder, que roda na mesma máquina. Num runner
      # descartável não há com quem dividir.
      - name: Mechanical detectors (rung-2 gate)
        run: bun run detect

      - name: Type-check
        run: bun tsc

      - name: Tests
        run: bun run test

  # O filtro existe como JOB, não como `on.paths`: `on.paths` filtraria o workflow inteiro, e o
  # `detect` tem de rodar sempre. O path-set é o do release-beta.yml MAIS `scripts/release/` (o
  # smoke deste job mora lá) e este próprio arquivo. A redeclaração é presa por
  # scripts/release/workflow-paths.test.ts (test:tooling): se o filtro do beta mudar sem este mudar
  # junto, o tooling fica vermelho.
  changes:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: o diff toca o que entra no app?
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # Branch novo (before = zeros) ou base inalcançável: na dúvida, roda.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"; echo "base indisponível — rodando"; exit 0
          fi
          # Materializa o diff ANTES do grep: com pipefail, `git diff | grep -q` pode morrer em
          # 141 (SIGPIPE — o grep casa cedo e sai enquanto o git ainda escreve) e o else PULARIA
          # o job linux num diff que toca o app — fail-closed na direção errada.
          git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed.txt"
          if grep -Eq '^(packages/app/|packages/api/|packages/client/|packages/contracts/|scripts/release/|\.github/workflows/correctness\.yml)' "$RUNNER_TEMP/changed.txt"; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"; echo "toca o app — rodando"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"; echo "só docs/specs — job linux pulado"
          fi

  linux:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    # Linux de verdade, hospedado — até 2026-08-26 isto era um container amd64 sob Rosetta no Mac
    # mini, com toda a pilha de contorno que o Rosetta exigia. Runner descartável: as deps de
    # sistema, a toolchain Rust e o cache de cargo são provisionados aqui (o veto histórico a
    # `Swatinem/rust-cache` era sobre runner PERSISTENTE — ver release-beta.yml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/api/go/go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/tauri/src-tauri

      # A mesma lista canônica que release-beta.yml/release-stable.yml instalam na perna Linux.
      - name: deps de sistema (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf

      - name: deps
        run: bun install --frozen-lockfile

      - name: openapi (insumo gerado do embed)
        run: |
          cp -n .env.example .env
          bun emit-openapi

      # ANTES do cargo check: `build.rs` (tauri_build) resolve `bundle.externalBin` + `resources` da
      # conf, e sem `binaries/` o check morre em `resource path binaries/codm-daemon-<triple> doesn't
      # exist` — a mesma razão pela qual `app-tauri:test` depende de `sidecars` (project.json).
      - name: sidecars
        run: cd packages/app/tauri && bun config/build-sidecars.ts

      # `check`, não `build`/`test`: é o que separa "compila no Linux" (o que um PR precisa provar)
      # de "linka e empacota" (o que o beta prova, com o custo que isso tem). `--locked` porque o
      # Cargo.lock é commitado e um lock que muda sozinho num runner é um lock errado no repo.
      # `check` no perfil DEBUG de propósito: com build.devUrl na conf o generate_context! não
      # embute o frontendDist (packages/app/react/dist/client — gitignorado, ausente aqui);
      # `--release`/custom-protocol exigiria o build do SPA e quebraria neste runner.
      - name: cargo check do shell
        run: cd packages/app/tauri/src-tauri && cargo check --locked

      # Os binários que acabaram de compilar SOBEM? (scripts/release/smoke-sidecars.ts — mesmo cwd
      # e env que o shell usa; é o gate que build-sidecars.ts diz que um build nunca dá. Contrato:
      # repo root, zero args, exit != 0 em falha, imprime os 200 de daemon e gateway.)
      - name: smoke dos sidecars
        run: bun scripts/release/smoke-sidecars.ts
