# Canal STABLE = tags vX.Y.Z (roadmap decisão 3). O cliente lê $R2/stable/latest.json
# (config/updater.ts — desde SP2.5 o updater aponta ao R2, não ao GitHub: repo privado 404a GET
# anônimo em release asset). O beta escreve em beta/, então o canal rolante nunca alcança quem
# está no stable — o isolamento vem dos prefixos R2 distintos. A tag só vira release se casar com
# a versão da conf: um manifest cuja versão diverge do bundle instalado é um updater quebrado em
# silêncio.
#
# Três SOs desde 2026-08-25, na MESMA forma do release-beta.yml (prepare → build por SO → publish
# agregado) — leia os dois juntos. macOS e Linux rodam self-hosted no Mac mini do founder (Linux
# num container amd64 sob Rosetta — infra/runners/linux-x64/). Desde 2026-08-26 (diretriz do
# founder, verbatim: "não podemos contar com o billing do GitHub, temos que usar o mac mini" —
# addendum 2026-08-26 em .specs/2026-08-25-windows-linux-build-design.md) o Windows TAMBÉM saiu do
# runner hospedado: passou a ser CROSS-COMPILADO no MESMO runner self-hosted Linux, via a rota que
# o próprio Tauri v2 documenta (`cargo-xwin`, EXPERIMENTAL por documentação do Tauri — aceita pelo
# founder nesta fase). `windows-latest` virou `windows-native-tests.yml` (workflow_dispatch-only,
# não-bloqueante — valida nativamente o que o cross-build não pode provar sozinho). Desde
# 2026-08-25 (auditoria coordenada com o founder) `prepare` e `publish` — as jobs UTILITY, que não
# fazem parte da matriz por SO — TAMBÉM rodam no mesmo runner self-hosted Linux: com o Windows
# cross desde 2026-08-26, esta release inteira não consome mais NENHUM minuto hospedado do GitHub
# (a única exposição que resta é o dispatch manual de `windows-native-tests.yml`). `publish` ainda
# exige os três builds via `needs`, então uma falha em qualquer um segue derrubando a release
# inteira (D4: sem manifest parcial) — o que mudou foi a exposição a billing, não essa garantia.
# O que muda no stable: retenção TOTAL no R2 (nome versionado por artefato) + um alias fixo por
# instalador para o botão da landing.
name: release-stable

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  R2_PUBLIC: https://pub-ae0c8cac60c94920b35464575c09e67d.r2.dev
  R2_BUCKET: codm-releases

jobs:
  prepare:
    # Job UTILITY — self-hosted desde 2026-08-25, mesmo runner Linux (self-hosted, Mac mini) que a
    # entrada linux-x86_64 do `build` já usa. Custo zero de cota; ver o comentário no topo do
    # arquivo e o gêmeo em release-beta.yml. Só usa git/bash/jq (na imagem) + bun (via `uses:`).
    runs-on: [self-hosted, Linux, X64]
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      # A config do shell é GERADA (config/*.ts → tauri.conf.json, capabilities, shell-env.json) e
      # comitada; um build sobre um JSON desregenerado assaria uma CSP/env de ontem com a config de
      # hoje. Drift = build vermelho, AQUI — antes de qualquer um dos três builds gastar minutos de
      # cargo. Roda uma vez em `prepare` (é um check de repo, não depende do runner do build).
      - name: desktop config em dia
        run: bun desktop:generate --check

      # O GATE da decisão 4: tag == versão da conf, ou nada é publicado. Roda ANTES de qualquer
      # build — uma tag errada custaria três builds (um deles a 2×) para descobrir o mesmo erro.
      - name: verify tag matches conf version
        id: v
        run: |
          CONF="v$(jq -r .version packages/app/tauri/src-tauri/tauri.conf.json)"
          if [ "$CONF" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != versão da conf ${CONF} — suba a versão em config/ e regenere antes de taggear"
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # MESMO defeito invisível, uma camada mais fundo: com a chave vazia o console não quebra nem
      # avisa — `AnalyticsService/index.ts` resolve para o NoopAnalyticsService e a telemetria some
      # em silêncio. Um dashboard vazio é indistinguível de "ninguém usou o app", então o erro só
      # apareceria semanas depois, como uma pergunta sobre os números. A v0.3.0 saiu exatamente
      # assim. Repo variable existir não basta — o que falhou nas duas vezes foi ela não CHEGAR ao
      # passo de build, e é isso que este teste cobre.
      - name: posthog presente
        run: |
          test -n "${{ vars.VITE_POSTHOG_KEY }}" || {
            echo "::error::vars.VITE_POSTHOG_KEY vazia — o app sairia com a telemetria desligada em silêncio. Defina a repo variable antes de publicar."
            exit 1
          }
          echo "posthog: ${{ vars.VITE_POSTHOG_HOST }} (chave presente, ${#POSTHOG_KEY} chars)"
        env:
          POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}

  build:
    needs: prepare
    # Serializa SÓ o entry darwin-aarch64 do matrix ENTRE OS DOIS workflows (beta e stable) — o
    # mesmo Mac mini roda os dois, e dois `codesign`/`security` concorrentes disputam a MESMA lista
    # de busca do keychain de login (corrida medida). O group é a MESMA string fixa
    # ('release-signing-macos') nos dois arquivos só para esse entry, então um build beta e um
    # stable que colidam fazem fila (`cancel-in-progress: false` — nenhum é descartado) em vez de
    # correr. Linux e Windows (cross, desde 2026-08-26 — ambos no MESMO runner self-hosted Linux,
    # mas SEM keychain nenhum envolvido) não têm esse risco — cada run recebe um group ÚNICO
    # (workflow+run_id+key), que nunca colide com outro run e por isso nunca espera.
    concurrency:
      group: ${{ matrix.key == 'darwin-aarch64' && 'release-signing-macos' || format('nosig-{0}-{1}-{2}', github.workflow, github.run_id, matrix.key) }}
      cancel-in-progress: false
    # MACMINI_KEYCHAIN_PASSWORD ainda NÃO existe como secret (checado 2026-08-25) — o campo fica
    # vazio em toda run, e é por isso que o passo de destravar abaixo é `if`-guardado pela
    # EXISTÊNCIA dele, não pelo SO sozinho: sem o secret, o comportamento de hoje continua idêntico.
    # Precisa estar no nível do JOB (não do step) porque um step não enxerga o próprio `env:` no seu
    # próprio `if:` — o `if` decide se o step roda ANTES do `env:` daquele step existir.
    env:
      MACMINI_KEYCHAIN_PASSWORD: ${{ secrets.MACMINI_KEYCHAIN_PASSWORD }}
    strategy:
      # `fail-fast: false`, de propósito (uniformidade com release-beta.yml, pedida pela sessão
      # coordenadora): `publish` já exige os três verdes via `needs`, e desde 2026-08-26 as três
      # entradas são self-hosted NO MESMO runner Linux, rodando serializadas — cancelar uma no meio
      # não libera capacidade para nenhuma outra, então fail-fast não economiza nada aqui.
      fail-fast: false
      matrix:
        include:
          # Self-hosted no Mac mini do founder (custo zero de cota; ver release-beta.yml e
          # docs/RELEASE.md). CUIDADO ao tornar o repo público: runner self-hosted + repo público
          # deixa qualquer PR de fork executar código nesta máquina.
          #
          # `hosted` é o campo DECLARADO que os passos de provisionamento abaixo leem (non-negotiable
          # 5 do CLAUDE.md) — desde 2026-08-26 as TRÊS entradas são self-hosted (`hosted: false`).
          # `sidecarTarget`/`tauriRunner`/`crossTarget`/`smoke` são os OUTROS campos DECLARADOS que
          # os passos `sidecars`/`tauri build`/`smoke dos sidecars` consomem — vazios/`true` nas
          # entradas nativas, preenchidos só na entrada cross. Ver o comentário gêmeo, mais
          # detalhado, em release-beta.yml.
          - key: darwin-aarch64
            runner: '["self-hosted", "macOS", "ARM64"]'
            bundles: app,dmg
            hosted: false
            sidecarTarget: ''
            tauriRunner: ''
            crossTarget: ''
            smoke: true
            nice: nice -n 10
          # Linux x64 — self-hosted no MESMO Mac mini desde 2026-08-25 (container amd64 sob Rosetta,
          # infra/runners/linux-x64/); deps de sistema + Rust já vêm na imagem.
          - key: linux-x86_64
            runner: '["self-hosted", "Linux", "X64"]'
            bundles: appimage,deb
            hosted: false
            sidecarTarget: ''
            tauriRunner: ''
            crossTarget: ''
            smoke: true
            nice: ''
          # Windows x64 — desde 2026-08-26 CROSS-COMPILADO no MESMO runner self-hosted Linux que a
          # entrada `linux-x86_64` acima usa (diretriz do founder — addendum 2026-08-26 em
          # .specs/2026-08-25-windows-linux-build-design.md), via a rota `cargo-xwin` documentada
          # pelo Tauri v2 (EXPERIMENTAL por documentação própria dele; aceita pelo founder). Ver o
          # comentário detalhado desta mesma entrada em release-beta.yml — mesma razão, mesmos
          # campos, mesmo `smoke: false` (o runner Linux não executa um PE Windows para provar o
          # health; só `windows-native-tests.yml` + a validação manual da AC-15 fazem isso).
          - key: windows-x86_64
            runner: '["self-hosted", "Linux", "X64"]'
            bundles: nsis
            hosted: false
            sidecarTarget: win32-x64
            tauriRunner: cargo-xwin
            crossTarget: x86_64-pc-windows-msvc
            smoke: false
            nice: ''
    runs-on: ${{ fromJSON(matrix.runner) }}
    defaults:
      run:
        # macOS e Linux (self-hosted) já são bash por padrão — redundante para os dois, explícito
        # por segurança. Desde 2026-08-26 nenhuma entrada roda num Windows de verdade (a
        # `windows-x86_64` cross-compila num runner Linux); a pegadinha do shell default do Windows
        # ser pwsh não se aplica mais aqui — segue valendo só para `windows-native-tests.yml`.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/api/go/go.mod

      # Gate pelo campo DECLARADO `matrix.hosted`, não por `runner.os`: o Linux self-hosted
      # (infra/runners/linux-x64/Dockerfile) já nasce com esta lista instalada na imagem. Este
      # passo só dispararia se um futuro entry Linux voltasse a ser hospedado.
      - name: deps de sistema (Linux)
        if: runner.os == 'Linux' && matrix.hosted
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf

      - name: toolchain Rust (runners hospedados)
        if: matrix.hosted
        uses: dtolnay/rust-toolchain@stable
      - name: cache do cargo (runners hospedados)
        if: matrix.hosted
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/tauri/src-tauri

      # NÃO reintroduza Swatinem/rust-cache em runner self-hosted — ver o comentário longo em
      # release-beta.yml: o passo de save dela poda `~/.cargo/bin` e apagou o `rustup` da máquina do
      # founder em 2026-08-07. Runners persistentes não precisam dela; o `target/` mora fora do
      # workspace (passo abaixo) — vale para os dois self-hosted (macOS e Linux).
      - name: cargo target fora do workspace (runners persistentes)
        if: '!matrix.hosted'
        run: echo "CARGO_TARGET_DIR=$HOME/.cache/codm-cargo-target" >> "$GITHUB_ENV"

      # `BUNDLE_DIR` deriva do MESMO literal que o `stage` computava inline antes — declarado UMA
      # VEZ aqui, consumido por lookup em `stage` e em qualquer outro passo que precise do bundle,
      # em vez de cada um recalcular a expressão por conta própria (rail non-negotiable #5:
      # contrato declarado, sem desvio por convenção). Passo INCONDICIONAL (ao contrário do passo
      # acima): `$CARGO_TARGET_DIR` só existe em `$GITHUB_ENV` nos runners self-hosted, então o
      # fallback `${CARGO_TARGET_DIR:-...}` precisa rodar sempre — numa leg `matrix.hosted` (campo
      # já declarado na matriz, mesmo que nenhuma entrada atual o use) ele resolve para o target
      # padrão do crate; se este passo também fosse gated por `!matrix.hosted`, `stage` morreria
      # com variável não-declarada sob `set -u` nessa leg — exatamente o desvio de edge-case que a
      # regra 5 do CLAUDE.md proíbe.
      - name: bundle dir (declarado uma vez)
        run: echo "BUNDLE_DIR=${CARGO_TARGET_DIR:-packages/app/tauri/src-tauri/target}${{ matrix.crossTarget && format('/{0}', matrix.crossTarget) || '' }}/release/bundle" >> "$GITHUB_ENV"

      - name: deps
        run: bun install --frozen-lockfile

      # O gateway Go embute public/docs/openapi.json (//go:embed) e o arquivo é GERADO —
      # existe em qualquer checkout de dev, mas nunca num runner limpo. Sem este step o build
      # do sidecar morre com "pattern docs/openapi.json: no matching files found" (1º run real,
      # 2026-08-07). O .env de exemplo basta: o emit curto-circuita o boot após gerar o spec.
      - name: openapi (insumo gerado do embed)
        run: |
          cp -n .env.example .env
          bun emit-openapi

      # `matrix.sidecarTarget` é o contrato CONGELADO com `build-sidecars.ts` (ver release-beta.yml):
      # vazio nas entradas nativas, `--target win32-x64` só na `windows-x86_64` (cross).
      - name: sidecars
        run: cd packages/app/tauri && bun config/build-sidecars.ts${{ matrix.sidecarTarget && format(' --target {0}', matrix.sidecarTarget) || '' }}

      # Ver release-beta.yml: sobe os binários recém-compilados como o shell sobe (mesmo env de
      # src-tauri/src/sidecars/mod.rs) e exige 200. CONTRATO do script (congelado com a task que o
      # cria): portas EFÊMERAS, nunca as default 3030/3032 — o Mac mini self-hosted roda o daemon de
      # PRODUÇÃO nelas, e um smoke na porta default daria 200 contra o binário errado (falso-verde)
      # — e verificação de que quem respondeu foi o PID que o próprio script lançou.
      #
      # Pulado quando `matrix.smoke` é `false` — só a `windows-x86_64` cross: o binário é um PE
      # Windows, e este runner Linux não consegue executá-lo. `windows-native-tests.yml` faz esse
      # smoke nativamente; AC-15 exige validação manual do NSIS cross-compilado numa máquina
      # Windows real antes do primeiro stable multi-SO.
      - name: smoke dos sidecars
        if: matrix.smoke != false
        env:
          CODM_APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: bun scripts/release/smoke-sidecars.ts

      # A Apple exige que TODO Mach-O dentro do bundle seja assinado com Developer ID E com
      # timestamp seguro. O Tauri assina o .app e os binários declarados em `externalBin`, mas NÃO o
      # que entra por `bundle.resources` — e o closure do libsql traz um `.node`, que é Mach-O. A
      # notarização da v0.4.0 reprovou exatamente nele, com as duas mensagens: "not signed with a
      # valid Developer ID certificate" e "does not include a secure timestamp".
      #
      # Assina por BUSCA, não por caminho fixo: o dia em que outro prebuild nativo entrar no closure
      # ele já sai assinado, em vez de reprovar numa notarização 12 minutos build adentro. `file`
      # decide o que é Mach-O — extensão não decide (`.node` é Mach-O, `.js` ao lado não é).
      # O keychain de login do mini fica TRAVADO quando a sessão não está desbloqueada ("User
      # interaction is not allowed") e o codesign morre mesmo com o p12 correto. Guardado pela
      # EXISTÊNCIA do secret (job env acima): sem MACMINI_KEYCHAIN_PASSWORD o passo é pulado e o
      # comportamento atual permanece — degrada limpo, o secret ainda não existe hoje.
      - name: destrava o keychain de login (mini)
        if: runner.os == 'macOS' && env.MACMINI_KEYCHAIN_PASSWORD != ''
        run: security unlock-keychain -p "$MACMINI_KEYCHAIN_PASSWORD" ~/Library/Keychains/login.keychain-db

      # O CERTIFICADO NÃO ESTÁ NO KEYCHAIN DESTE PROCESSO, e é por isso que o passo monta um. O
      # runner é self-hosted, então a máquina TEM o certificado — no keychain de login do founder.
      # Mas o Actions roda como serviço, com sessão e keychain próprios, e um `codesign` daqui
      # responde `no identity found` (medido). O Tauri não sofre disso porque importa o `.p12` dos
      # secrets num keychain temporário dentro do próprio passo dele; aqui fazemos o mesmo, antes.
      - name: assina os Mach-O aninhados nos resources
        if: runner.os == 'macOS'
        env:
          IDENTITY: "Developer ID Application: BK COMPANY LTDA (V4F6T68S5B)"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          # Só os diretórios STAGED COMO RESOURCE. Os sidecars (`codm-daemon`, `codm-gateway`) ficam
          # de fora de propósito: o Tauri os assina como `externalBin`, e a notarização confirmou —
          # ela reclamou do `.node` e de mais nada.
          LIST="$RUNNER_TEMP/nested-machos.txt"
          : > "$LIST"
          find packages/app/tauri/src-tauri/binaries/daemon-runtime \
               packages/app/tauri/src-tauri/binaries/migrations \
               -type f 2>/dev/null | while IFS= read -r f; do
            # `if`, nunca `cmd && cmd`: sob `set -e` o `&&` que falha no ÚLTIMO comando do corpo
            # mata o laço, e o primeiro `.js` do node_modules (não é Mach-O) fazia grep sair 1 e o
            # passo morrer sem imprimir uma linha sequer. Reproduzido no /bin/bash 3.2 do runner.
            if file "$f" | grep -q "Mach-O"; then printf '%s\n' "$f" >> "$LIST"; fi
          done
          if [ ! -s "$LIST" ]; then echo "nenhum Mach-O aninhado — nada a assinar"; exit 0; fi

          KEYCHAIN="$RUNNER_TEMP/codm-nested-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          CERT="$RUNNER_TEMP/codm-nested-cert.p12"
          # O keychain e o .p12 saem do disco aconteça o que acontecer, e a lista de busca volta ao
          # que era: este runner é a máquina de trabalho do founder, não um descartável.
          PREV_KEYCHAINS="$(security list-keychains -d user | sed 's/[",]//g' | xargs)"
          cleanup() {
            security list-keychains -d user -s $PREV_KEYCHAINS >/dev/null 2>&1 || true
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
            rm -f "$CERT"
          }
          trap cleanup EXIT

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          # Sem isto o codesign trava num prompt de autorização que não existe num runner sem TTY.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # `codesign` procura na LISTA DE BUSCA, não no keychain que acabamos de criar — sem
          # acrescentá-lo aqui, a identidade importada segue invisível.
          security list-keychains -d user -s "$KEYCHAIN" $PREV_KEYCHAINS >/dev/null

          found=0
          while IFS= read -r f; do
            found=$((found + 1))
            echo "assinando $f"
            codesign --force --timestamp --options runtime --keychain "$KEYCHAIN" -s "$IDENTITY" "$f"
            codesign -dv --verbose=2 "$f" 2>&1 | grep -E "^Authority=Developer ID Application" || {
              echo "::error::$f não ficou com Developer ID depois do codesign"
              exit 1
            }
          done < "$LIST"
          echo "Mach-O aninhados assinados: $found"

      # A origem da nuvem NÃO é uma repo variable: é a decisão declarada em config/cloud.ts,
      # derivada por config/env.ts e renderizada em shell-env.json — o MESMO valor que o build.rs
      # entrega ao supervisor Rust e este passa ao daemon em CODM_CLOUD_URL. O console recebe pelo
      # VITE_CODM_CLOUD_URL exportado aqui (o Vite resolve VITE_* no BUILD). Um release sem ela
      # produz um app cujo login abre localhost:3030 e um daemon que responde 503 CLOUD_UNREACHABLE
      # a toda tela — defeito INVISÍVEL no artefato (os assets vão comprimidos dentro do binário;
      # nenhum grep no .app prova que a URL foi assada). Medido na v0.1.3 (console) e na v0.5.1
      # (daemon). Um passo POR SO (não em `prepare`): GITHUB_ENV não atravessa jobs, e cada entrada
      # da matriz roda no seu próprio job.
      - name: cloud url do manifesto
        run: |
          CLOUD_URL="$(jq -r .daemon.CODM_CLOUD_URL packages/app/tauri/src-tauri/shell-env.json)"
          case "$CLOUD_URL" in
            https://*) ;;
            *)
              echo "::error::shell-env.json daemon.CODM_CLOUD_URL='$CLOUD_URL' não é uma origem https — corrija config/cloud.ts e rode bun desktop:generate"
              exit 1
              ;;
          esac
          echo "VITE_CODM_CLOUD_URL=$CLOUD_URL" >> "$GITHUB_ENV"
          echo "cloud: $CLOUD_URL"

      # O CARGO_TARGET_DIR vive num volume persistente do runner; os artefatos de bundle têm a
      # versão no nome (`CoDM_<versão>_<arch>.<ext>`) e ACUMULAM entre runs — os globs do `stage`
      # (`*.deb`, `*-setup.exe`, `*.dmg`) exigem exatamente um build por pasta. Medido no run
      # 32934975156 (release-beta): `cp: target 'dist-release/codm-linux-x86_64.deb' is not a
      # directory`, com duas versões presentes em `deb/`. Uniforme para todas as entradas da
      # matriz (macOS incluído — o `.dmg` também carrega a versão no nome) e para os dois tipos de
      # runner: `rm -rf` de um bundle dir num runner hospedado/efêmero é inofensivo (o disco morre
      # com o job de qualquer forma) — condicionar a limpeza a `matrix.hosted` seria o mesmo desvio
      # de edge-case do passo `bundle dir` acima.
      - name: limpa bundle de runs anteriores
        run: rm -rf "$BUNDLE_DIR"

      # Sem `--config version`: no stable a versão É a da conf (gate acima). Desde 2026-08-26 a
      # entrada `windows-x86_64` também injeta `--runner cargo-xwin --target
      # x86_64-pc-windows-msvc` (via `matrix.tauriRunner`/`matrix.crossTarget` — ver release-beta.yml).
      - name: tauri build
        env:
          # VITE_CODM_CLOUD_URL chega pelo GITHUB_ENV do passo "cloud url do manifesto" acima —
          # lida do shell-env.json comitado, não de uma repo variable.
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Chave gerada com --ci = senha vazia; sem esta linha o build tenta abrir um prompt de
          # senha num runner sem TTY e morre com "Device not configured" (medido localmente).
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Assinatura Apple — NÃO é a chave acima (aquela é minisign, do updater). Sem estas o
          # build sai ad-hoc, e o grant de TCC de um app ad-hoc fica preso ao cdhash: todo update
          # invalida a permissão de disco e os agentes gerados pelo daemon perdem o workspace
          # (medido na v0.2.0, 07/08/2026 — "System Policy: deny file-read-data /Users/.../Desktop").
          #
          # TODAS condicionadas a macOS: o bundler ignora APPLE_* fora do macOS, mas o certificado
          # é material crítico (ver memória apple-signing-material) e não entra no ambiente de
          # runners hospedados de terceiros sem necessidade.
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: "${{ runner.os == 'macOS' && 'Developer ID Application: BK COMPANY LTDA (V4F6T68S5B)' || '' }}"
          # Notarização: sem ela o Gatekeeper barra o .dmg baixado do R2.
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && 'V4F6T68S5B' || '' }}
          # A janela de instalação do DMG (fundo + posição dos ícones, config/dmg.ts) é aplicada por
          # um AppleScript no Finder dentro do bundler — e o bundler PULA esse passo quando vê
          # CI=true (`--skip-jenkins`, tauri#592), porque runner hospedado não tem Finder. O nosso
          # tem: é um LaunchAgent na sessão gráfica do mini. Sem esta linha o DMG sai com o
          # background.png copiado mas sem .DS_Store — janela crua (medido na v0.5.3). Exige o
          # grant de Automação → Finder para o `node` do runner (externals/nodeXX/bin/node — o
          # cliente que o TCC enxerga nos passos `run:`); o diálogo NÃO aparece, o 1º run falha em
          # 2 min e cria a entrada, e ela é ligada à mão nos Ajustes (docs/RELEASE.md).
          TAURI_BUNDLER_DMG_IGNORE_CI: ${{ runner.os == 'macOS' && 'true' || '' }}

        run: cd packages/app/tauri && ${{ matrix.nice }} bun x tauri build --bundles ${{ matrix.bundles }}${{ matrix.tauriRunner && format(' --runner {0}', matrix.tauriRunner) || '' }}${{ matrix.crossTarget && format(' --target {0}', matrix.crossTarget) || '' }}

      # A conf fica com signingIdentity '-' de propósito (rail DSK-10: build local não deve exigir
      # certificado); a identidade real vem do APPLE_SIGNING_IDENTITY acima, que a sobrepõe. Se essa
      # sobreposição falhar, o app sai ad-hoc e o defeito é INVISÍVEL no artefato — só aparece na
      # máquina do usuário, quando o TCC prende a permissão de disco ao cdhash e os agentes perdem o
      # workspace no update seguinte (v0.2.0, 07/08/2026). Verificar na saída é a única defesa.
      - name: assinatura Apple presente no bundle
        if: runner.os == 'macOS'
        run: |
          APP=$(ls -d "$BUNDLE_DIR"/macos/*.app | head -1)
          if ! codesign -dv --verbose=2 "$APP" 2>&1 | grep -q "^Authority=Developer ID Application"; then
            echo "::error::$APP saiu SEM Developer ID (provavelmente ad-hoc). Confira os secrets APPLE_*."
            codesign -dv --verbose=2 "$APP" 2>&1 | head -20
            exit 1
          fi
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "^Authority=|^TeamIdentifier="

      # Nomes FIXOS no stage (os mesmos do beta) — o `publish` é quem versiona ao subir ao R2.
      # $BUNDLE_DIR vem do `$GITHUB_ENV` escrito no passo "cargo target fora do workspace" — mesmo
      # mecanismo do release-beta.yml. O `stage` só faz lookup da env var, nunca recomputa a
      # expressão.
      #
      # O nome que o Tauri estampou em cada instalador (`CoDM_<versão>_<arch>.<ext>`, de
      # productName + version da conf) é o nome que o browser deve SALVAR — vai no
      # Content-Disposition do alias, lá no `publish`. Lido do artefato, NUNCA remontado por uma
      # segunda fórmula (uma fórmula paralela diverge na primeira mudança de nome do bundler). Cada
      # entrada escreve o SEU PRÓPRIO `NAMES-<matrix.key>.env` — nunca um nome compartilhado: os
      # três artifacts se fundem num único `dist-release/` no `publish` (`merge-multiple: true`), e
      # um nome de arquivo repetido entre eles perderia dois dos três na sobrescrita silenciosa. O
      # `case` chaveia por `matrix.key`, NÃO por `$RUNNER_OS` — desde 2026-08-26 `linux-x86_64` e
      # `windows-x86_64` (cross) rodam as duas no MESMO runner Linux.
      - name: stage
        run: |
          set -euo pipefail
          BUNDLE="$BUNDLE_DIR"
          mkdir -p dist-release
          NAMES="dist-release/NAMES-${{ matrix.key }}.env"
          case "${{ matrix.key }}" in
            darwin-aarch64)
              cp "$BUNDLE"/macos/*.app.tar.gz     dist-release/codm-aarch64.app.tar.gz
              cp "$BUNDLE"/macos/*.app.tar.gz.sig dist-release/codm-aarch64.app.tar.gz.sig
              cp "$BUNDLE"/dmg/*.dmg              dist-release/codm-aarch64.dmg
              echo "DMG_NAME=$(basename "$(ls "$BUNDLE"/dmg/*.dmg | head -1)")" >> "$NAMES" ;;
            linux-x86_64)
              cp "$BUNDLE"/appimage/*.AppImage     dist-release/codm-linux-x86_64.AppImage
              cp "$BUNDLE"/appimage/*.AppImage.sig dist-release/codm-linux-x86_64.AppImage.sig
              cp "$BUNDLE"/deb/*.deb               dist-release/codm-linux-x86_64.deb
              echo "APPIMAGE_NAME=$(basename "$(ls "$BUNDLE"/appimage/*.AppImage | head -1)")" >> "$NAMES"
              echo "DEB_NAME=$(basename "$(ls "$BUNDLE"/deb/*.deb | head -1)")" >> "$NAMES" ;;
            windows-x86_64)
              cp "$BUNDLE"/nsis/*-setup.exe     dist-release/codm-windows-x86_64-setup.exe
              cp "$BUNDLE"/nsis/*-setup.exe.sig dist-release/codm-windows-x86_64-setup.exe.sig
              echo "SETUP_EXE_NAME=$(basename "$(ls "$BUNDLE"/nsis/*-setup.exe | head -1)")" >> "$NAMES" ;;
            *) echo "::error::matrix.key desconhecido: ${{ matrix.key }}"; exit 1 ;;
          esac
          ls -la dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.key }}
          path: dist-release/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [prepare, build]
    # Job UTILITY — self-hosted desde 2026-08-25, mesmo runner Linux do `prepare` acima e mesma
    # razão. GITHUB_TOKEN continua funcionando igual (injetado pelo Actions, não pelo runner).
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # O wrangler roda sob NODE, nao sob bun — ver deploy-landing.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist-release

      - name: todos os artefatos presentes
        run: |
          set -e
          for f in codm-aarch64.app.tar.gz codm-aarch64.app.tar.gz.sig codm-aarch64.dmg \
                   codm-linux-x86_64.AppImage codm-linux-x86_64.AppImage.sig codm-linux-x86_64.deb \
                   codm-windows-x86_64-setup.exe codm-windows-x86_64-setup.exe.sig; do
            test -s "dist-release/$f" || { echo "::error::artefato ausente ou vazio: $f"; exit 1; }
          done
          ls -la dist-release

      # Um `NAMES-<key>.env` por SO (do `stage`, no `build`) — cada um com o nome que o Tauri
      # estampou naquele instalador. `source`ados aqui, viram env do JOB inteiro (`$GITHUB_ENV`) e
      # alimentam o `--content-disposition` dos aliases no upload abaixo. As QUATRO variáveis são
      # exigidas: um `stage` que não escreveu a sua quebraria o alias correspondente em silêncio.
      - name: nomes dos artefatos (Content-Disposition)
        run: |
          set -euo pipefail
          for f in dist-release/NAMES-*.env; do
            test -s "$f" || { echo "::error::$f ausente ou vazio — o stage daquele SO não gravou o nome"; exit 1; }
            cat "$f" >> "$GITHUB_ENV"
          done
          # Sinalização ENTRE JOBS, não artefato de release: some daqui para não virar asset do GH
          # release (`dist-release/*` no passo `publish` abaixo) nem quebrar o `verifica no r2`.
          rm -f dist-release/NAMES-*.env

      - name: nomes cobrem os 4 instaladores
        run: |
          set -euo pipefail
          for v in DMG_NAME APPIMAGE_NAME DEB_NAME SETUP_EXE_NAME; do
            test -n "${!v:-}" || { echo "::error::$v vazio — algum NAMES-<key>.env não gravou a variável esperada"; exit 1; }
          done
          echo "DMG_NAME=$DMG_NAME APPIMAGE_NAME=$APPIMAGE_NAME DEB_NAME=$DEB_NAME SETUP_EXE_NAME=$SETUP_EXE_NAME"

      # stable = URLs VERSIONADAS no manifest (config/updater.ts: canal de arquivo quer URL única).
      - name: manifest
        run: >
          bun scripts/release/make-manifest.ts
          --version "${{ needs.prepare.outputs.version }}"
          --notes "stable ${GITHUB_REF_NAME}"
          --out dist-release/latest.json
          --platform darwin-aarch64 --url "$R2_PUBLIC/stable/CODM_${GITHUB_REF_NAME}_aarch64.app.tar.gz" --sig-file dist-release/codm-aarch64.app.tar.gz.sig
          --platform linux-x86_64 --url "$R2_PUBLIC/stable/CODM_${GITHUB_REF_NAME}_linux-x86_64.AppImage" --sig-file dist-release/codm-linux-x86_64.AppImage.sig
          --platform windows-x86_64 --url "$R2_PUBLIC/stable/CODM_${GITHUB_REF_NAME}_windows-x86_64-setup.exe" --sig-file dist-release/codm-windows-x86_64-setup.exe.sig

      # GUARD do acoplamento cross-front: o make-manifest de UMA plataforma (a versão anterior do
      # script) aceitaria a invocação acima em SILÊNCIO — `arg()` pega a primeira ocorrência de cada
      # flag, ignora `--platform` e sai 0 com um latest.json só-darwin. Um manifest parcial é um
      # updater quebrado para Linux/Windows sem nenhum erro em lugar nenhum; este passo é a única
      # defesa que não depende do outro front ter mergeado primeiro.
      - name: manifest tem as 3 plataformas
        run: |
          KEYS=$(jq -r '.platforms|keys|sort|join(",")' dist-release/latest.json)
          test "$KEYS" = "darwin-aarch64,linux-x86_64,windows-x86_64" || {
            echo "::error::latest.json com plataformas '$KEYS' — o make-manifest N-plataformas (FRONT B) não está no ar ou a invocação divergiu"
            exit 1
          }
          echo "manifest ok: $KEYS"

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "codm ${GITHUB_REF_NAME}" \
            --notes "Release estável — macOS arm64, Linux x64 (AppImage/deb) e Windows x64 (NSIS). Instalação e canais: docs/RELEASE.md." \
            dist-release/*

      # stable = retenção TOTAL (decisão do founder): cada versão fica no R2 sob nome versionado;
      # latest.json e os aliases dos instaladores apontam sempre para a mais nova (o botão da
      # landing usa os aliases). Ordem: versionados → aliases → latest.json por ÚLTIMO.
      #
      # A URL de cada alias é fixa, mas o ARQUIVO que o browser salva leva a versão: os quatro
      # aliases sobem com `Content-Disposition: attachment; filename="CoDM_<versão>..."` ($X_NAME,
      # do `stage`) — os objetos VERSIONADOS não precisam disso, o próprio nome no R2 já é o nome
      # certo. `<a download>` não serviria — o browser ignora o atributo em origem cruzada (r2.dev).
      - name: upload r2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # put <nome no R2> <arquivo local em dist-release> <content-type> [nome salvo pelo browser]
          put() {
            local name="$1" file="$2" ctype="$3" cd="${4:-}"
            if [ -n "$cd" ]; then
              npx --yes wrangler@4.120.0 r2 object put "$R2_BUCKET/stable/$name" --file "dist-release/$file" --content-type "$ctype" --content-disposition "attachment; filename=\"$cd\"" --remote
            else
              npx --yes wrangler@4.120.0 r2 object put "$R2_BUCKET/stable/$name" --file "dist-release/$file" --content-type "$ctype" --remote
            fi
          }
          T="${GITHUB_REF_NAME}"
          put "CODM_${T}_aarch64.app.tar.gz"             codm-aarch64.app.tar.gz            application/gzip
          put "CODM_${T}_aarch64.app.tar.gz.sig"         codm-aarch64.app.tar.gz.sig        text/plain
          put "CODM_${T}_aarch64.dmg"                    codm-aarch64.dmg                   application/x-apple-diskimage
          put "CODM_${T}_linux-x86_64.AppImage"          codm-linux-x86_64.AppImage         application/vnd.appimage
          put "CODM_${T}_linux-x86_64.AppImage.sig"      codm-linux-x86_64.AppImage.sig     text/plain
          put "CODM_${T}_linux-x86_64.deb"               codm-linux-x86_64.deb              application/vnd.debian.binary-package
          put "CODM_${T}_windows-x86_64-setup.exe"       codm-windows-x86_64-setup.exe      application/vnd.microsoft.portable-executable
          put "CODM_${T}_windows-x86_64-setup.exe.sig"   codm-windows-x86_64-setup.exe.sig  text/plain
          # aliases fixos — os instaladores humanos que a landing linka
          put codm-aarch64.dmg                codm-aarch64.dmg               application/x-apple-diskimage                    "$DMG_NAME"
          put codm-linux-x86_64.AppImage      codm-linux-x86_64.AppImage     application/vnd.appimage                          "$APPIMAGE_NAME"
          put codm-linux-x86_64.deb           codm-linux-x86_64.deb          application/vnd.debian.binary-package             "$DEB_NAME"
          put codm-windows-x86_64-setup.exe   codm-windows-x86_64-setup.exe  application/vnd.microsoft.portable-executable      "$SETUP_EXE_NAME"
          put latest.json                     latest.json                    application/json

      # Código de saída do wrangler não é prova (deploy-landing, 2026-08-08); o objeto no ar é.
      - name: verifica no r2
        run: |
          set -euo pipefail
          check() {
            local_size=$(stat -c %s "dist-release/$2")
            remote_size=$(curl -sfI "$R2_PUBLIC/stable/$1" | tr -d '\r' | awk 'tolower($1)=="content-length:"{print $2}')
            [ "$local_size" = "$remote_size" ] || { echo "::error::$1 no R2 tem ${remote_size:-nada} bytes; local tem $local_size"; exit 1; }
            echo "ok $1"
          }
          T="${GITHUB_REF_NAME}"
          check "CODM_${T}_aarch64.app.tar.gz" codm-aarch64.app.tar.gz
          check "CODM_${T}_linux-x86_64.AppImage" codm-linux-x86_64.AppImage
          check "CODM_${T}_windows-x86_64-setup.exe" codm-windows-x86_64-setup.exe
          check codm-aarch64.dmg codm-aarch64.dmg
          check codm-linux-x86_64.AppImage codm-linux-x86_64.AppImage
          check codm-linux-x86_64.deb codm-linux-x86_64.deb
          check codm-windows-x86_64-setup.exe codm-windows-x86_64-setup.exe
          check latest.json latest.json
