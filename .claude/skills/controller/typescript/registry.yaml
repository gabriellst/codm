    exemplar: |
      import { injectable } from 'tsyringe-neo'
      import { Controller, HttpStatusCode, z } from '@codedm/core-typescript'
      import { AuthAccountMiddleware } from '@auth/middlewares/AuthAccountMiddleware'
      import { RequireOwner } from '@owner/middlewares'
      import { UpdateXInputSchema, UpdateXOutputSchema } from '@context/usecases/UpdateX'

      export const UpdateXControllerInput = z
        .object({
          params: z.object({ xId: z.uuid() }),
          body: UpdateXInputSchema.omit({ xId: true, userId: true }),
          ctx: z.object({
            user: z.object({ id: z.string() }),
            session: z.object({ ownerId: z.string() }),
          }),
        })
        .example([{
          params: { xId: '123e4567-e89b-12d3-a456-426614174000' },
          body: { name: 'Updated' },
          ctx: { user: { id: 'user-uuid' }, session: { ownerId: 'owner-uuid' } },
        }])

      export const UpdateXControllerOutput = UpdateXOutputSchema

      @injectable()
      export class UpdateXController extends Controller<typeof UpdateXControllerInput, typeof UpdateXControllerOutput> {
        readonly path = '/x/:xId'
        readonly method = 'patch'
        readonly description = 'Update an X'
        readonly inputSchema = UpdateXControllerInput
        readonly outputSchema = UpdateXControllerOutput
        override middlewares = [AuthAccountMiddleware, RequireOwner]
        constructor(private readonly updateX: UpdateX) { super() }

        async handle(request: this['input']): Promise<this['output']> {
          const { params, body } = request
          await this.updateX.execute({
            ...body,
            xId: params.xId,
            userId: request.ctx.user.id,
          })
          return { status: HttpStatusCode.NO_CONTENT }
        }
      }

