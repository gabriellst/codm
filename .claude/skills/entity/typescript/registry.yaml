    exemplar: |
      const XSchema = z.object({
        name: z.string().trim().min(1, { error: 'NAME_REQUIRED' as DomainErrors }).max(255, { error: 'INVALID_NAME' as DomainErrors }),
        email: z.instance(Email),
        status: z.enum(StatusEnum),
        ownerId: z.instance(Id),
      })
      export type XProps = Z.infer<typeof XSchema>

      export class X extends AggregateRoot<typeof XSchema> {
        static override schema = XSchema
        static create(data: { name: string; email: string; ownerId: string }): X {
          return new X({ ...data, status: StatusEnum.ACTIVE })
        }
        updateName(name: string): void {
          this.name = name
          this.validate()
        }
        activate(): void { this.status = StatusEnum.ACTIVE }
        deactivate(): void { this.status = StatusEnum.INACTIVE }
        isActive(): boolean { return this.status === StatusEnum.ACTIVE }
      }
      export interface X extends XProps {}

