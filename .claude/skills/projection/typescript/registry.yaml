    skeletons:
      repository: |
        import { injectable } from 'tsyringe-neo'
        import { eq } from 'drizzle-orm'
        import { DrizzleClient, tryCatchAsync } from '@template/core-typescript'
        import type { Transaction } from '@template/core-typescript'
        // import { {{camelName}}Projection } from '@template/contracts/db'
        import { {{Name}}Projection, type {{Name}}ProjectionProps } from './{{Name}}'

        /**
         * Read + projection-write surface for {{Name}}Projection.
         *
         * Canonical (mandatory) methods:
         *   - findByKey: read half of `find → applyEvent → save`
         *   - save:      write half (upsert by natural key)
         *   - insertIfNew: replay-safe creation (ON CONFLICT DO NOTHING)
         *
         * Atomic ops are EDGE CASES — add one only when a canonical-flow trigger fails:
         *   • hot-row contention (concurrent writes to the same row)
         *   • bulk operation (one event mutates N rows)
         *   • monotonic constraint (only-if-greater)
         *   • conditional update (requires SQL atomicity)
         *   • cache-mirror bulk upsert (archetype A / B1)
         *
         * Each atomic method should carry a comment naming the trigger that justifies it.
         */
        export abstract class {{Name}}ProjectionRepository {
        	// ── Canonical (always required) ──────────────────────────────────────
        	abstract findByKey(/* key: TODOKey */ key: unknown, tx?: Transaction): Promise<{{Name}}Projection | null>
        	abstract save(projection: {{Name}}Projection, tx?: Transaction): Promise<void>
        	abstract insertIfNew(projection: {{Name}}Projection, tx?: Transaction): Promise<boolean>

        	// ── Atomic ops (edge cases — justify each one in a comment) ──────────
        	// abstract markXyzMany(ids: string[], at: Date, tx?: Transaction): Promise<void>
        }

        @injectable()
        export class Drizzle{{Name}}ProjectionRepository extends {{Name}}ProjectionRepository {
        	constructor(private db: DrizzleClient) {
        		super()
        	}

        	async findByKey(key: unknown, tx?: DrizzleClient): Promise<{{Name}}Projection | null> {
        		const dbClient = tx ?? this.db
        		const result = await tryCatchAsync(async () => {
        			// const rows = await dbClient.select().from({{camelName}}Projection).where(eq({{camelName}}Projection.id, key as string)).limit(1)
        			// return rows[0]
        			return undefined
        		})
        		if (!result.success || !result.data) return null
        		return this.toDomain(result.data)
        	}

        	async save(projection: {{Name}}Projection, tx?: DrizzleClient): Promise<void> {
        		const dbClient = tx ?? this.db
        		const row = this.toPersistence(projection)
        		// await dbClient.insert({{camelName}}Projection).values(row).onConflictDoUpdate({
        		//   target: [{{camelName}}Projection.id],
        		//   set: { ...row, id: undefined },
        		// })
        	}

        	async insertIfNew(projection: {{Name}}Projection, tx?: DrizzleClient): Promise<boolean> {
        		const dbClient = tx ?? this.db
        		const row = this.toPersistence(projection)
        		// const result = await dbClient.insert({{camelName}}Projection).values(row).onConflictDoNothing().returning()
        		// return result.length > 0
        		return false
        	}

        	private toDomain(row: unknown): {{Name}}Projection {
        		return new {{Name}}Projection(row as {{Name}}ProjectionProps)
        	}

        	private toPersistence(projection: {{Name}}Projection): unknown {
        		return projection.props
        	}
        }

