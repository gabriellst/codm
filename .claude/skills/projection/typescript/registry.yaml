    exemplar: |
      // packages/api/typescript/src/channel/projections/Message.ts
      import { z } from '@template/core-typescript'
      import { Direction } from '@channel/enums'
      import type { MessageReceivedEvent, MessageSentEvent, MessageEditedEvent, MessageDeletedEvent } from '@channel/events'

      export const MessageProjectionSchema = z.object({
        channelId: z.string(),
        remoteId: z.string(),
        platformMessageId: z.string(),
        direction: z.enum(Direction),
        occurredAt: z.date(),
        editedAt: z.date().nullable(),
        deletedAt: z.date().nullable(),
      })

      export type MessageProjectionProps = z.infer<typeof MessageProjectionSchema>
      export type MessageProjectionEvent =
        | MessageReceivedEvent
        | MessageSentEvent
        | MessageEditedEvent
        | MessageDeletedEvent

      export class MessageProjection {
        constructor(public props: MessageProjectionProps) {}

        static create(event: MessageReceivedEvent): MessageProjection
        static create(event: MessageSentEvent): MessageProjection
        static create(event: MessageReceivedEvent | MessageSentEvent): MessageProjection {
          switch (event.name) {
            case 'channel.message_received':
              return new MessageProjection({ channelId: event.payload.channelId, direction: Direction.RECEIVED, ... })
            case 'channel.message_sent':
              return new MessageProjection({ channelId: event.payload.channelId, direction: Direction.SENT, ... })
          }
        }

        applyEvent(event: MessageEditedEvent): void
        applyEvent(event: MessageDeletedEvent): void
        applyEvent(event: MessageEditedEvent | MessageDeletedEvent): void {
          switch (event.name) {
            case 'channel.message_edited': this.props.editedAt = event.payload.editedAt; return
            case 'channel.message_deleted': this.props.deletedAt = event.payload.at; return
          }
        }
      }

  scaffold: |
    # Scaffold both files (projection class + projection repository) in one shot:
    bun cli projection <context> <Name>

    # Print to stdout for review without writing:
    bun cli projection <context> <Name> --print

    # The CLI emits:
    #   packages/api/typescript/src/<context>/projections/<Name>.ts
    #   packages/api/typescript/src/<context>/projections/<Name>ProjectionRepository.ts
    #
    # Then manually:
    # 1. Fill in MessageProjectionEvent union (import event classes from @<context>/events)
    # 2. Add the static create(event) overloads + applyEvent(event) overloads
    # 3. Wire the Drizzle table mapping in the repository's toDomain/toPersistence stubs
    # 4. Register the repository token in <ctx>/registry.ts — one expandBindings declaration ({ token, mock, real })
    # 5. Add the Drizzle schema for the projection table under shared/db/drizzle/schema/<ctx>.ts
    # 6. bun migrate:create to generate the SQL migration
    # 7. Scaffold the projector: bun cli projector <context> <Name>
