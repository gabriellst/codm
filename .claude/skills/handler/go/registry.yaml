registry:
  type: backend
  layer: application
  depends_on: [event, service]
  depended_by: []
  context_reads: [event]
  lang: go

  snippet:
    skeleton: |
      // Package handlers contains event handlers for the {{ctx}} bounded context.
      package handlers

      import (
      	"context"
      	"log/slog"

      	ctxevents "template/api-go/internal/{{ctx}}/events"
      	"template/core-go/services/mediator"
      	"template/core-go/types"
      )

      // {{Pascal}}Handler reacts to {{snake}} domain events.
      type {{Pascal}}Handler struct{}

      // New{{Pascal}}Handler constructs the handler.
      func New{{Pascal}}Handler() *{{Pascal}}Handler {
      	return &{{Pascal}}Handler{}
      }

      // Compile-time interface check.
      var _ mediator.DomainEventHandler = (*{{Pascal}}Handler)(nil)

      func (h *{{Pascal}}Handler) EventName() string {
      	return ctxevents.{{Pascal}}EventName
      }

      func (h *{{Pascal}}Handler) Handle(ctx context.Context, event types.DomainEventI) error {
      	typed, err := types.UnmarshalDomainEvent[ctxevents.{{Pascal}}Payload](event)
      	if err != nil {
      		return err
      	}

      	slog.InfoContext(ctx, "{{ctx}}: handling {{snake}} event",
      		"entityId", typed.EntityID,
      	)
      	_ = typed

      	// TODO: implement side effects
      	// - Publish integration event via externalMediator.Publish(ctx, integrationEvent)
      	// - Call a use case: _, err = h.useCase.Execute(ctx, input)

      	return nil
      }

