  patterns:
    - id: HDL-GO-01
      name: "EventName() returns the event const from the events package"
      when: always
      rule: |
        func (h *TranscodingJobCompletedHandler) EventName() string {
            return ctxevents.TranscodingJobCompletedEventName
        }

    - id: HDL-GO-02
      name: "Compile-time interface check"
      when: always
      rule: |
        // Domain event handler
        var _ mediator.DomainEventHandler = (*TranscodingJobCompletedHandler)(nil)
        // Integration event handler
        var _ mediator.IntegrationEventHandler = (*EnqueueTranscodingJobHandler)(nil)

    - id: HDL-GO-03
      name: "UnmarshalDomainEvent / UnmarshalIntegrationEvent at top of Handle"
      when: always
      rule: |
        func (h *MyHandler) Handle(ctx context.Context, event types.DomainEventI) error {
            typed, err := types.UnmarshalDomainEvent[events.MyPayload](event)
            if err != nil {
                return err
            }
            // use typed.Payload
        }

    - id: HDL-GO-04
      name: "Handler registered in module.go via fx.Invoke"
      when: always
      rule: |
        fx.Invoke(func(ext mediator.ExternalMediator, internal mediator.InternalMediator,
            enqueue *handlers.EnqueueTranscodingJobHandler,
            completed *handlers.TranscodingJobCompletedHandler,
        ) {
            ext.Register(enqueue)        // integration (external) event
            internal.Register(completed) // domain (internal) event
        }),

    - id: HDL-GO-05
      name: "External mediator injected via constructor (not global)"
      when: "handler publishes integration events"
      rule: |
        type MessageReceivedHandler struct {
            externalMediator mediator.ExternalMediator
        }
        func NewMessageReceivedHandler(ext mediator.ExternalMediator) *MessageReceivedHandler {
            return &MessageReceivedHandler{externalMediator: ext}
        }

    - id: HDL-GO-06
      name: "Idempotency guard before state-changing operations"
      when: "handler creates or updates persistent state"
      rule: |
        existing, err := h.repo.Find(ctx, e.Payload.EntityID.String())
        if err != nil {
            return err
        }
        if existing != nil {
            return nil // already processed — idempotent skip
        }

    - id: HDL-GO-07
      name: "Non-critical handlers swallow errors with structured log"
      when: "handler performs notifications, logging, or best-effort side effects"
      rule: |
        if err := h.notify(ctx, event); err != nil {
            slog.ErrorContext(ctx, "notification failed", "error", err)
            // intentionally return nil
        }
        return nil
    - id: HDL-GO-08
      name: "A exceção nomeada em Go: um *IntegrationHandler por evento, registrado nominalmente"
      when: "um fato do contexto precisa atravessar para outro bounded context/serviço"
      rule: |
        // A regra agnóstica é a mesma do TS (HDL-P13) — "publicação de integração só em publicadores
        // NOMEADOS; todo outro handler é domínio puro" — mas ela se instancia na convenção Go, que já
        // existe e é diferente: um handler POR EVENTO, sufixo *IntegrationHandler, em
        // internal/<ctx>/handlers/, com o ExternalMediator INJETADO no construtor (HDL-GO-05) e
        // registro NOMINAL em module.go. Nunca em use case, repositório, controller/rota ou service.
        //
        // internal/channel/handlers/remotes_synced_handler.go
        func (h *RemotesSyncedIntegrationHandler) Handle(ctx context.Context, event types.DomainEventI) error {
            if err := h.externalMediator.Publish(ctx, integrationEvent); err != nil {
                return err
            }
            return nil
        }
        // internal/channel/module.go — registro nominal, um por linha
        m.Register(handlers.NewRemotesSyncedIntegrationHandler(ext))
      wrong: "Publish() chamado de um use case, de um repositório, de uma rota ou de um service; ou um publicador anônimo/ad-hoc fora de internal/<ctx>/handlers/"

  bad_practices:
    - id: bp-GO-HDL-01
      name: "EventName returns a string literal instead of the const"
      severity: moderate
      mechanical: true
      detect:
        - 'return\s+"[\w]+\.[\w.]+"'
      wrong: |
        func (h *MyHandler) EventName() string {
            return "transcoding.transcoding_job.completed" // literal — typo risk
        }
      right: |
        func (h *MyHandler) EventName() string {
            return ctxevents.TranscodingJobCompletedEventName
        }

    - id: bp-GO-HDL-02
      name: "Handle does not call UnmarshalDomainEvent — accesses raw interface"
      severity: critical
      mechanical: false
      wrong: |
        func (h *MyHandler) Handle(ctx context.Context, event types.DomainEventI) error {
            name := event.GetEventName() // only accesses non-generic interface fields
            // no type-safe access to payload
        }
      right: |
        typed, err := types.UnmarshalDomainEvent[events.MyPayload](event)
        if err != nil {
            return err
        }
        _ = typed.Payload.SomeField

    - id: bp-GO-HDL-03
      name: "Handler not registered in module.go"
      severity: critical
      mechanical: false
      wrong: |
        // Handler constructed but never registered — events are never delivered
        fx.Provide(handlers.NewMyHandler),
        // missing: fx.Invoke(registerHandlers)
      right: |
        fx.Provide(handlers.NewMyHandler),
        fx.Invoke(func(internal mediator.InternalMediator, h *handlers.MyHandler) {
            internal.Register(h)
        }),

    - id: bp-GO-HDL-04
      name: "Integration event handler registered with InternalMediator"
      severity: critical
      mechanical: false
      wrong: |
        // integration.video.uploaded must come from ExternalMediator
        internal.Register(enqueue) // wrong mediator
      right: |
        ext.Register(enqueue) // ExternalMediator for integration events from outside

    - id: bp-GO-HDL-05
      name: "Use case invokes mediator directly instead of going through outbox"
      severity: critical
      mechanical: true
      detect:
        - 'internalMediator\.Publish\('
      wrong: |
        // In a use case Execute():
        h.internalMediator.Publish(ctx, someEvent)
      right: |
        // Entity appends via AppendDomainEvent; repo.Save calls domainEventRepo.SaveAll
        // OutboxDispatcher dispatches → InternalMediator.Dispatch → handler.Handle

    - id: bp-GO-HDL-06
      name: "Handler not idempotent — creates duplicates on retry"
      severity: critical
      mechanical: false
      wrong: |
        func (h *CreateProfileHandler) Handle(ctx context.Context, event types.IntegrationEventI) error {
            // No existence check — inserts duplicate on re-delivery
            profile := entities.NewProfile(e.Payload.UserID)
            return h.repo.Save(ctx, profile)
        }
      right: |
        existing, err := h.repo.Find(ctx, e.Payload.UserID)
        if err != nil {
            return err
        }
        if existing != nil {
            return nil // idempotent skip
        }
        profile := entities.NewProfile(e.Payload.UserID)
        return h.repo.Save(ctx, profile)

    - id: bp-GO-HDL-07
      name: "Handler que EXECUTA uma ação de consumidor único (par Go de handler/typescript bp-09)"
      severity: warning
      mechanical: false
      reason: >
        O handler é o único consumidor do evento e não reage a um fato — executa uma ação. Então o
        evento existe para COMANDAR. Regra de intenção do founder (29-jul-2026), citada literalmente:
        "evento existe para fins reativos, auditoria ou event sourcing — nunca para comandar. Se a
        existência do evento é só para um handler executar algo que poderia ser um comando/use case
        direto, está errado." A forma certa é um comando durável (enfileirado na transação do fato que
        o motiva, executor único, com retry) ou o use case chamado direto. Julgamento, não grep.
      wrong: |
        // evento de wire declarado só para que ISTO rode
        func (h *SendSomethingHandler) Handle(ctx context.Context, event fwtypes.IntegrationEventI) error {
            return h.client.Post(ctx, typed.Payload) // executa, não reage
        }
      right: |
        // O fato, se importa, continua sendo fato; a AÇÃO é comandada — enfileirada na mesma
        // transação do fato, com executor único e retry, ou chamada direto pelo use case.
