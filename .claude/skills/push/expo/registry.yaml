skill: push
platform: expo
depends_on: [component, service]
context_reads:
  - packages/app/expo/lib/use-push-notifications.ts
  - packages/api/typescript/src/notifications/services/PushDeliveryService.ts
  - packages/api/typescript/src/notifications/services/ExpoPushDeliveryService.ts

patterns:
  - id: PUSH-01
    name: "Register the device token once, in the authed area"
    when: always
    rule: "usePushNotifications() requests permission → getExpoPushTokenAsync → useRegisterFcmToken({ token, platform: FcmPlatform }). Mounted once via <PushRegistration/> in the authed layout. setNotificationHandler at module level. getExpoPushTokenAsync guarded in try/catch."
    wrong: "registering from a screen / every render; hardcoding the platform; an unguarded getExpoPushTokenAsync that crashes on simulators"
  - id: PUSH-02
    name: "Real PushDeliveryService reads tokens cross-context + sends via expo-server-sdk, bound for real only"
    when: "implementing real push delivery"
    rule: "ExpoPushDeliveryService extends PushDeliveryService, reads tokens via identity FcmRegistrationTokenRepository, filters Expo.isExpoPushToken, sends chunked via expo-server-sdk, swallows per-ticket errors. Bound for `real` mode only (mock→Mock, integration→Log)."
    wrong: "throwing on a single dead token (fails the batch); binding the network transport for mock/integration"

bad_practices:
  - id: bp-push-01
    name: "Push token registered from a screen / on every render"
    severity: high
    wrong: "a tab screen calling getExpoPushTokenAsync + register on each mount"
    right: "one <PushRegistration/> null-mount in the authed layout, token-deduped"
    reason: "Re-registering on every render spams the endpoint; the registration is a singleton side-effect at the layout."
    mechanical: false
  - id: bp-push-02
    name: "Hardcoded platform string instead of the SDK FcmPlatform enum"
    severity: moderate
    wrong: "register({ token, platform: 'IOS' })"
    right: "register({ token, platform: Platform.OS === 'ios' ? FcmPlatform.IOS : FcmPlatform.ANDROID })"
    reason: "The platform is an SDK enum; a literal drops the exhaustiveness the contract gives (no-enum-widening)."
    mechanical: true
    detect:
      - "platform:\\s*'(IOS|ANDROID|WEB)'"
  - id: bp-push-03
    name: "Real push transport bound for mock/integration"
    severity: critical
    wrong: "{ token: PushDeliveryService, instance: ExpoPushDeliveryService } in the mock or integration registry block"
    right: "ExpoPushDeliveryService only in the real block; mock→Mock, integration→Log"
    reason: "Tests must not hit the Expo Push network. The real transport is real-mode-only."
    mechanical: false
