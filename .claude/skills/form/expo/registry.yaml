registry:
  type: frontend
  layer: presentation
  platform: mobile
  depends_on: [sdk, primitive, store]
  depended_by: []
  context_reads: [primitive, route, sheet, store]
  examples:
    - examples/pairs/synthetic-expo-form-state-subscribe

  file_patterns:
    - "packages/app/expo/app/**/-components/*Form*/index.tsx"
    - "packages/app/expo/app/(sheets)/**/index.tsx"
    - "packages/app/expo/app/(auth)/**/index.tsx"

  patterns:
    # --- Always patterns ---

    - id: FRM-01
      name: "TanStack Form via useForm"
      when: always
      rule: |
        const form = useForm({
          defaultValues,
          validators: { onChange: schema },
          onSubmit: async form => {
            const result = schema.safeParse(form.value)
            if (!result.success) return
            await mutation.mutateAsync({ data: result.data }, { onSuccess, onSettled })
          },
        })
      wrong: "Multiple useState calls for field values"

    - id: FRM-02
      name: "SDK Zod schema as validators.onChange"
      when: always
      rule: |
        import { createItemMutationRequestSchema } from '@template/client-typescript/typescript'
        validators: { onChange: createItemMutationRequestSchema }
      wrong: "Inline z.object({ ... }) inside the form file"

    - id: FRM-03
      name: "DeepPartial defaultValues"
      when: always
      rule: |
        const defaultValues: DeepPartial<CreateItemMutationRequest> = {}
        // Edit:
        const defaultValues: DeepPartial<UpdateItemMutationRequest> = entity ? { ...entity } : {}

    - id: FRM-04
      name: "KeyboardAware wraps any form with text inputs"
      when: "form contains TextInput / Input / NumField"
      rule: |
        import { KeyboardAware } from '@/components/ui/KeyboardAware'
        <KeyboardAware>
          <View className="flex-1 px-5 py-6 gap-4">
            {/* fields */}
            {/* submit button */}
          </View>
        </KeyboardAware>
      reason: "Keeps the focused input above the iOS keyboard and dismisses on tap outside."

    - id: FRM-05
      name: "Native primitive imports"
      when: always
      rule: |
        import { Input, InputGroup, InputPrefix, InputSuffix } from '@/components/ui/Input'
        import { NumField } from '@/components/ui/NumField'
        import { Button } from '@/components/ui/Button'
        import { KeyboardAware } from '@/components/ui/KeyboardAware'
      wrong: |
        import { TextInput, Pressable } from 'react-native'   // raw RN primitives
        import { Input } from '@/components/ui/input'         // web import path

    - id: FRM-06
      name: "Submit disabled by schema.safeParse(values).success"
      when: always
      rule: |
        <form.Subscribe selector={s => ({ canSubmit: s.canSubmit, isSubmitting: s.isSubmitting, values: s.values })}>
          {({ canSubmit, isSubmitting, values }) => {
            const isDisabled = !canSubmit || isSubmitting || mutation.isPending || !schema.safeParse(values).success
            return <Button label="Save" onPress={() => void form.handleSubmit()} disabled={isDisabled} />
          }}
        </form.Subscribe>

    - id: FRM-07
      name: "Submit via Button.onPress, not <form>"
      when: always
      rule: |
        // RN has no <form> element. The Button is the submit trigger.
        <Button onPress={() => void form.handleSubmit()} ... />
      wrong: |
        // Don't try to render a <form> tag — RN doesn't have one.

    # --- Conditional patterns ---

    - id: FRM-C01
      name: "value={field.state.value ?? ''} on text inputs"
      when: "rendering Input for a string field"
      rule: |
        <Input value={field.state.value ?? ''} onChangeText={field.handleChange} onBlur={field.handleBlur} />
      reason: "DeepPartial makes the default undefined — RN warns on uncontrolled→controlled transition."

    - id: FRM-C02
      name: "value={field.state.value ?? 0} on NumField"
      when: "rendering NumField for a number field"
      rule: |
        <NumField value={field.state.value ?? 0} onChange={field.handleChange} ... />

    - id: FRM-C03
      name: "Sheet-as-form dismisses via router.back() on success"
      when: "form lives in app/(sheets)/<name>/index.tsx"
      rule: |
        onSuccess: () => {
          Haptics.notification('success')
          router.back()         // pageSheet
          // or:  router.dismiss()  // fullScreenModal
        }
      reason: "The sheet IS the form. Dismissing the route is how the user 'closes' it."

    - id: FRM-C04
      name: "ScrollView with keyboardShouldPersistTaps='handled' inside KeyboardAware"
      when: "form has more than one screen-height of fields"
      rule: |
        <KeyboardAware>
          <ScrollView
            className="flex-1"
            contentContainerStyle={{ paddingBottom: 16 }}
            keyboardShouldPersistTaps="handled"
          >
            {/* fields */}
          </ScrollView>
        </KeyboardAware>

    - id: FRM-C05
      name: "Wizard step extracts sub-schema from complete mutation schema via @/lib/union"
      when: "form is a step in a multi-step wizard"
      rule: |
        // From completeXMutationRequestSchema (strict, all fields required) — slice the
        // union member by DISCRIMINANT with the helpers, never by positional index:
        import { pickUnionVariantField, unionVariantValues } from '@/lib/union'
        export const PersonalInfoStepSchema = pickUnionVariantField(completeXMutationRequestSchema, { type: 'DOCTOR' }, 'personalInfo')
        // StepData is INFERRED from the slice — never hand-written:
        export type PersonalInfoStepData = z.output<typeof PersonalInfoStepSchema>
        // Partial steps compose with .pick() on the slice; discriminant options for the
        // selector come from unionVariantValues(completeXMutationRequestSchema, 'type').
        // The returned field schema IS a valid TanStack validators.onChange (the whole
        // member from pickUnionVariant is NOT — submit-gate with .safeParse instead).
      wrong: "Extracting from saveDraftXMutationRequestSchema (all fields optional); raw positional access (schema.def.options[0].def.shape.x — index breaks silently when the contract reorders members; match by discriminant via pickUnionVariant{,Field}); hand-writing the StepData type instead of inferring it from the slice"

    - id: FRM-C06
      name: "i18n via react-i18next"
      when: "form has user-visible strings"
      rule: |
        import { useTranslation } from 'react-i18next'
        const { t } = useTranslation()
        <Button label={t('createItem.submit')} ... />
      wrong: "import { t } from '@/lib/i18n'  // web import path"

    - id: FRM-C07
      name: "RN keyboard hints on Input"
      when: "field has a known content type"
      rule: |
        <Input keyboardType="email-address" autoCapitalize="none" textContentType="emailAddress" />
        <Input secureTextEntry textContentType="password" />
        <Input keyboardType="number-pad" />

    # --- Pattern references ---

    - id: FRM-P01
      name: "Haptic feedback on submit success"
      when: "form has a meaningful success action"
      rule: |
        import { Haptics } from 'react-native-nitro-haptics'
        onSuccess: () => Haptics.notification('success')
      examples: ["mobile equivalent of web's toast.success"]

    - id: FRM-P02
      name: "Inline error <Text> below field"
      when: "showing field validation errors"
      rule: |
        {field.state.meta.isTouched && !field.state.meta.isValid ? (
          <Text className="text-accent-danger text-xs font-sans">
            {field.state.meta.errors.join(', ')}
          </Text>
        ) : null}
      reason: "No FieldError primitive on mobile — a plain styled Text is the convention."

    - id: FRM-P03
      name: "Login screen uses tryCatchAsync, not useForm"
      when: "screen is (auth)/login.tsx with Apple Sign-In + biometric"
      rule: |
        // login.tsx is NOT a form. It's a button-driven flow.
        const [busy, setBusy] = useState(false)
        const result = await tryCatchAsync(async () => {
          const credential = await AppleAuthentication.signInAsync(...)
          const { error } = await auth.signIn.social({ ... })
          if (error) throw new Error(error.message ?? 'Sign-in failed')
        })
        if (!result.success) Alert.alert(t('errors.title'), result.error.message)
      source: "packages/app/expo/app/(auth)/login.tsx"

    - id: FRM-P04
      name: "Shared form across composed components (one useForm, threaded as prop)"
      when: "multiple sibling components need to read or write the same form fields (e.g. an edit area alongside a list whose rows can drive the editor)"
      rule: |
        // Screen owns the useForm; children take it as a typed prop.
        // Type the prop via a type-only inference helper in -types.ts:
        function _inferFooForm() {
          const defaults: DeepPartial<FooFormData> = {}
          return useForm({ defaultValues: defaults, validators: { onChange: fooSchema } })
        }
        export type FooForm = ReturnType<typeof _inferFooForm>

        // Each child uses form.Subscribe with a narrow selector. When the
        // selector returns a PRIMITIVE (number/string/boolean), structural
        // equality stops re-renders on unrelated field changes. The
        // canonical 3-mode discriminant in list rows:
        <form.Subscribe
          selector={s => {
            const sel = s.values.editingSelection
            if (sel == null) return 0 as const                            // idle
            return sel.id === item.id ? (1 as const) : (2 as const)        // this | other
          }}
        >
          {mode => /* mode is 0 | 1 | 2 — primitive, equality-checked */}
        </form.Subscribe>
      reason: |
        Sharing the form instance itself avoids the Zustand mirror (microtask
        hop, stale during refetches), Context (re-renders all consumers on
        every commit), and value-prop-drilling (every parent re-render bubbles
        through). The 3-mode primitive selector is the keystone — it keeps
        leaf rows from re-rendering on every NumField keystroke. Compute
        derived booleans (dirty / disabled / mode) INSIDE the selector and
        return the primitive — selecting the whole `values` object just to
        derive one flag re-renders the subscriber on every keystroke.
      source: "./exemplars/workout-set/ (5 files: README.md, -types.ts.txt, screen.tsx.txt, SetEditor.tsx.txt, SetList.tsx.txt, SetRow.tsx.txt)"

  canonical_snippet: |
    import { View, Text } from 'react-native'
    import { useForm } from '@tanstack/react-form'
    import { useQueryClient } from '@tanstack/react-query'
    import { Haptics } from 'react-native-nitro-haptics'
    import { useTranslation } from 'react-i18next'
    import {
      useCreateItem,
      createItemMutationRequestSchema,
      listItemsQueryKey,
      type CreateItemMutationRequest,
    } from '@template/client-typescript/typescript'
    import type { DeepPartial } from '@/lib'
    import { Input, InputGroup } from '@/components/ui/Input'
    import { Button } from '@/components/ui/Button'
    import { KeyboardAware } from '@/components/ui/KeyboardAware'

    export function CreateItemForm({ onSuccess }: { onSuccess?: () => void }) {
      const { t } = useTranslation()
      const queryClient = useQueryClient()
      const createItem = useCreateItem()
      const defaultValues: DeepPartial<CreateItemMutationRequest> = {}

      const form = useForm({
        defaultValues,
        validators: { onChange: createItemMutationRequestSchema },
        onSubmit: async form => {
          const result = createItemMutationRequestSchema.safeParse(form.value)
          if (!result.success) return
          await createItem.mutateAsync(
            { data: result.data },
            {
              onSuccess: () => { Haptics.notification('success'); onSuccess?.() },
              onSettled: () => queryClient.invalidateQueries({ queryKey: listItemsQueryKey() }),
            },
          )
        },
      })

      return (
        <KeyboardAware>
          <View className="flex-1 px-5 py-6 gap-4">
            <form.Field name="name">
              {field => (
                <View className="gap-1.5">
                  <Text className="text-fg-2 font-sans-semi text-xs uppercase">{t('createItem.name.label')}</Text>
                  <InputGroup>
                    <Input
                      value={field.state.value ?? ''}
                      onChangeText={field.handleChange}
                      onBlur={field.handleBlur}
                      placeholder={t('createItem.name.placeholder')}
                    />
                  </InputGroup>
                </View>
              )}
            </form.Field>

            <form.Subscribe selector={s => ({ canSubmit: s.canSubmit, isSubmitting: s.isSubmitting, values: s.values })}>
              {({ canSubmit, isSubmitting, values }) => {
                const isDisabled =
                  !canSubmit || isSubmitting || createItem.isPending ||
                  !createItemMutationRequestSchema.safeParse(values).success
                return <Button label={t('createItem.submit')} fullWidth onPress={() => void form.handleSubmit()} disabled={isDisabled} />
              }}
            </form.Subscribe>
          </View>
        </KeyboardAware>
      )
    }

  scaffold: "bun cli form <route> <name> --i18n=<prefix> --sdk=<SchemaName> [--in-sheets] [--apple-sign-in]"

  bad_practices:
    - id: bp-01
      name: "Raw <TextInput> instead of Input primitive"
      severity: critical
      mechanical: true
      detect:
        - 'import\s*\{[^}]*\bTextInput\b[^}]*\}\s*from\s*[''"]react-native[''"]'
        - '<TextInput[\s/>]'
      wrong: |
        import { TextInput } from 'react-native'
        <TextInput value={field.state.value} onChangeText={field.handleChange} />
      right: |
        import { Input, InputGroup } from '@/components/ui/Input'
        <InputGroup><Input value={field.state.value ?? ''} onChangeText={field.handleChange} /></InputGroup>

    - id: bp-02
      name: "Form without KeyboardAware wrapper"
      severity: critical
      mechanical: false
      wrong: |
        <View><Input ... /><Button ... /></View>
      right: |
        <KeyboardAware><View className="px-5 gap-4"><Input ... /><Button ... /></View></KeyboardAware>

    - id: bp-03
      name: "try/catch around mutateAsync"
      severity: critical
      mechanical: true
      detect:
        - 'try\s*\{[\s\S]*?mutateAsync[\s\S]*?catch'
      wrong: |
        try { await mutation.mutateAsync(...) } catch (e) { Alert.alert('Error', e.message) }
      right: |
        await mutation.mutateAsync({ data }, { onSuccess, onSettled })
        // Global MutationCache.onError handles the error + haptic centrally.

    - id: bp-04
      name: "useState for form field values"
      severity: critical
      mechanical: true
      detect:
        - 'useState\(\s*[''"][''"]\s*\)'
      wrong: |
        const [name, setName] = useState('')
        <Input value={name} onChangeText={setName} />
      right: |
        <form.Field name="name">{field => <Input value={field.state.value ?? ''} onChangeText={field.handleChange} />}</form.Field>

    - id: bp-05
      name: "Reading form.state.values in render body"
      severity: critical
      mechanical: true
      detect:
        - 'form\.state\.values'
      wrong: |
        const values = form.state.values         // static snapshot
        const canSubmit = schema.safeParse(values).success
      right: |
        <form.Subscribe selector={s => s.values}>{values => ...}</form.Subscribe>

    - id: bp-06
      name: "value={field.state.value} without ?? '' / ?? 0"
      severity: critical
      mechanical: true
      detect:
        - 'value=\{\s*field\.state\.value\s*\}'
      wrong: |
        <Input value={field.state.value} ... />
      right: |
        <Input value={field.state.value ?? ''} ... />
      note: "DeepPartial defaults are undefined — uncontrolled→controlled flip emits a warning."

    - id: bp-07
      name: "Hand-coded queryKey instead of SDK helper"
      severity: critical
      mechanical: true
      detect:
        - 'queryKey:\s*\[\s*[''"]'
      wrong: |
        queryClient.invalidateQueries({ queryKey: ['items'] })
      right: |
        import { listItemsQueryKey } from '@template/client-typescript/typescript'
        queryClient.invalidateQueries({ queryKey: listItemsQueryKey() })

    - id: bp-08
      name: "Importing from web path '@/components/ui/input' (lowercase)"
      severity: critical
      mechanical: true
      detect:
        - '[''"]@/components/ui/input[''"]'
      wrong: |
        import { Input } from '@/components/ui/input'
      right: |
        import { Input } from '@/components/ui/Input'   // PascalCase on mobile

    - id: bp-09
      name: "Sheet-as-form does not dismiss after success"
      severity: critical
      mechanical: false
      wrong: |
        onSuccess: () => Haptics.notification('success')   // user is stranded inside the sheet
      right: |
        onSuccess: () => { Haptics.notification('success'); router.back() }

    - id: bp-10
      name: "Using '@/lib/i18n' instead of 'react-i18next'"
      severity: moderate
      mechanical: true
      detect:
        - '[''"]@/lib/i18n[''"]'
      wrong: |
        import { t } from '@/lib/i18n'   // web path, doesn't exist in expo
      right: |
        import { useTranslation } from 'react-i18next'
        const { t } = useTranslation()

    - id: bp-11
      name: "Extracting wizard step schema from a save/draft schema"
      severity: critical
      mechanical: false
      wrong: |
        // saveDraftSchema has every field optional — step validation passes trivially
        const StepSchema = saveDraftSchema.def.shape.personalInfo
      right: |
        // Extract from the strict/complete mutation schema
        const StepSchema = completeXMutationRequestSchema.def.options[0].def.shape.personalInfo

    - id: bp-12
      name: "Syncing server state into the form via useEffect"
      severity: critical
      mechanical: true
      detect:
        - 'useEffect\([\s\S]*?setFieldValue'
      wrong: |
        const { data } = useGetWorkout({ id })
        useEffect(() => {
          if (data) form.setFieldValue('name', data.name)
        }, [data])
      right: |
        // defaultValues is read ONCE at mount — it does NOT auto-sync when a
        // still-loading query resolves later. Gate the form's mount on the
        // loaded entity (or `key` the form component on entity.id) so its
        // defaults are seeded from real data, never from `undefined`.
        function EditScreen({ id }: { id: string }) {
          const { data } = useGetWorkout({ id })
          if (!data) return <FormSkeleton />              // gate-then-mount
          return <EditForm entity={data} />               // mounts with real defaults
        }
        function EditForm({ entity }: { entity: Workout }) {
          const form = useForm({
            defaultValues: { name: entity.name, sets: entity.sets },
            validators: { onChange: schema },
            onSubmit,
          })
          // ...
        }
      note: "V-5 rule: don't sync server state via useEffect. defaultValues is read once at mount — gate the form's mount on the loaded entity (or `key` it on entity.id). Seeding defaultValues from a still-undefined query does NOT auto-sync; the fields stay stuck on the empty defaults."

    - id: bp-13
      name: "Parallel Zustand mirror store for form state"
      severity: critical
      mechanical: true
      detect:
        - '\bcreate\s*<\s*\w*FormState\b'
      wrong: |
        // Adding a useWorkoutFormStore that mirrors form values for cross-component access
        const workoutFormStore = create<WorkoutFormState>(set => ({
          name: '', sets: [], setName: name => set({ name }),
        }))
      right: |
        // Lift the form instance to a shared owner and pass it as a prop
        // OR use form.Provider + useFormContext() from TanStack Form
      note: "V-5 rule: don't add a Zustand mirror store or a FormHost wrapper — lift the form to a shared owner."

    - id: bp-14
      name: "FormHost wrapper component around the form"
      severity: moderate
      mechanical: true
      detect:
        - '\bfunction\s+\w*FormHost\b'
        - 'FormContext\.Provider'
      wrong: |
        // Creating a <WorkoutFormHost> wrapper to provide the form via context
        export function WorkoutFormHost({ children }: { children: React.ReactNode }) {
          const form = useForm({ ... })
          return <FormContext.Provider value={form}>{children}</FormContext.Provider>
        }
      right: |
        // Lift the form to a shared owner (parent component / sheet screen) and pass it as a prop
        export function WorkoutSheet() {
          const form = useForm({ ... })
          return <WorkoutForm form={form} />
        }
      note: "V-5 rule: no FormHost. If form state needs to cross component boundaries, lift to the owning screen."

    - id: bp-16
      name: "Mirroring a form field value into leaf useState + re-deriving it in multiple children"
      severity: critical
      wrong: |
        // Two children each take the field value as a prop, each debounce it
        // into their OWN useState, each re-run the same derived query. The
        // debounced copies drift; the derived result is computed twice.
        function Hint({ candidate }) {
          const [d, setD] = useState('')
          useEffect(() => { const t = setTimeout(() => setD(candidate), 300); return () => clearTimeout(t) }, [candidate])
          const { data } = useCheckAvailable({ username: d })   // copy #1
        }
        function SubmitBtn({ candidate }) {
          const [d, setD] = useState('')
          useEffect(() => { const t = setTimeout(() => setD(candidate), 300); return () => clearTimeout(t) }, [candidate])
          const { data } = useCheckAvailable({ username: d })   // copy #2 — drifts from #1
        }
      right: |
        // The form is the single source. Read the field reactively at the
        // OWNER, derive once, pass the DERIVED result down as a plain prop.
        import { useStore } from '@tanstack/react-form'
        const candidate = useStore(form.store, s => s.values.username)
        const availability = useUsernameAvailability(candidate)   // one debounce, one query
        return <><Hint availability={availability} /><SubmitBtn isValid={availability.isAvailable} /></>
      note: "V-5 corollary: don't mirror-and-drill the form value. The form owns it — derive once at the owner (useStore(form.store, selector)) and pass the derived value down; leaf children stay presentational. See exemplars/workout-set SetEditor."

    - id: bp-15
      name: "Keyboard.dismiss() on SwiftUI TextField (doesn't work)"
      severity: critical
      mechanical: false
      wrong: |
        // SwiftUI TextField uses @FocusState — Keyboard.dismiss() has no effect
        <Pressable onPress={() => Keyboard.dismiss()}>
          <Host><TextField ref={ref} ... /></Host>
        </Pressable>
      right: |
        // Track the TextFieldRef and call ref.blur() instead
        const textFieldRef = useRef<TextFieldRef>(null)
        <Pressable onPress={() => textFieldRef.current?.blur()}>
          <Host><TextField ref={textFieldRef} ... /></Host>
        </Pressable>

  # Canonical form shell — what `bun cli form <route> <Name> --i18n=… --sdk=…`
  # emits. Shape sourced from berzerk-club/feat/training-collaboration's real
  # expo forms (CustomExerciseForm / edit-profile / claim-username):
  #
  #   - TanStack Form + SDK Zod schema (`validators.onChange: <Sdk>`)
  #   - `KeyboardAware` wrapper around `<View>` body + submit area (FRM-04)
  #   - Submit button gated by `schema.safeParse(values).success` (FRM-06)
  #   - `value={field.state.value ?? ''}` defaults (FRM-C01)
  #   - `useTranslation` from react-i18next + `useQueryClient` (always)
  #   - Optional Apple Sign-In handler/button via `--apple-sign-in`
  #
  # Bindings (computed by scripts/cli/expo/artifacts/form.ts):
  #   {{Pascal}}        Form component name (e.g. `CreateGameForm`)
  #   {{InputType}}     Input type alias (e.g. `CreateGameFormInput`)
  #   {{Sdk}}           SDK Zod schema identifier (e.g. `CreateGameBody`)
  #   {{i18nPrefix}}    i18n key prefix (e.g. `game.create`)
  #   {{appleImport}}   `\nimport * as AppleAuthentication …` or empty
  #   {{appleHandler}}  newline + `const handleAppleSignIn = …` block or empty
  #   {{appleButton}}   `<AppleAuthenticationButton …/>` block (in submit area)
  snippet:
    skeleton: |
      import { View, Text } from 'react-native'
      import { useForm } from '@tanstack/react-form'
      import { useQueryClient } from '@tanstack/react-query'
      import { useTranslation } from 'react-i18next'
      import { Haptics } from 'react-native-nitro-haptics'
      import { {{Sdk}} } from '@template/client-typescript/typescript'
      import { KeyboardAware } from '@/components/ui/KeyboardAware'
      import { Button } from '@/components/ui/Button'
      import { Input, InputGroup } from '@/components/ui/Input'
      import type { DeepPartial } from '@/lib/types'{{appleImport}}

      type {{InputType}} = typeof {{Sdk}}['_output']

      interface {{Pascal}}Props {
      	onSuccess?: () => void
      }

      export function {{Pascal}}({ onSuccess }: {{Pascal}}Props) {
      	const { t } = useTranslation()
      	const queryClient = useQueryClient()

      	const form = useForm({
      		defaultValues: {} as DeepPartial<{{InputType}}>,
      		validators: { onChange: {{Sdk}} },
      		onSubmit: async ({ value }) => {
      			const result = {{Sdk}}.safeParse(value)
      			if (!result.success) return
      			// TODO: call the SDK mutation hook with result.data and surface errors via toast.
      			Haptics.notification('success')
      			// TODO: replace with the real list query key: queryClient.invalidateQueries({ queryKey: list{{Pascal}}QueryKey() })
      			await queryClient.invalidateQueries({ queryKey: [] })
      			onSuccess?.()
      		},
      	}){{appleHandler}}

      	return (
      		<KeyboardAware className="flex-1">
      			<View className="px-5 pt-6 gap-4">
      				{/* TODO: render <form.Field> entries here. Example:
      				<form.Field name="example">
      					{field => (
      						<View>
      							<InputGroup>
      								<Input
      									value={field.state.value ?? ''}
      									onChangeText={field.handleChange}
      									onBlur={field.handleBlur}
      									placeholder={t('{{i18nPrefix}}.fields.example.placeholder')}
      								/>
      							</InputGroup>
      							{!field.state.meta.isValid && (
      								<Text className="text-accent-danger font-sans">{String(field.state.meta.errors[0] ?? '')}</Text>
      							)}
      						</View>
      					)}
      				</form.Field> */}
      			</View>

      			<form.Subscribe selector={s => ({ canSubmit: s.canSubmit, isSubmitting: s.isSubmitting, values: s.values })}>
      				{({ canSubmit, isSubmitting, values }) => {
      					const isDisabled = !canSubmit || isSubmitting || !{{Sdk}}.safeParse(values).success
      					return (
      						<View className="px-5 pt-2 pb-6 gap-3">{{appleButton}}
      							<Button
      								fullWidth
      								label={t('{{i18nPrefix}}.submit')}
      								onPress={() => void form.handleSubmit()}
      								disabled={isDisabled}
      							/>
      						</View>
      					)
      				}}
      			</form.Subscribe>
      		</KeyboardAware>
      	)
      }
