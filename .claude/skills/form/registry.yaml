registry:
  type: frontend
  layer: presentation
  depends_on: [sdk, primitive]
  depended_by: []
  context_reads: [schema]

  patterns:
    # === Structural patterns (always) ===
    - id: FRM-01
      name: "SDK schema as validation base"
      when: always
      rule: "import { xMutationRequestSchema } from '@template/client-typescript/typescript'"
      wrong: "redefining validation rules already in SDK"
    - id: FRM-02
      name: "useForm with validators"
      when: always
      rule: "const form = useForm({ defaultValues, validators: { onChange: schema } })"
    - id: FRM-03
      name: "form.Field pattern"
      when: always
      rule: "<form.Field name='x'>{field => <Input ... />}</form.Field>"

    # === Conditional patterns ===
    - id: FRM-C01
      name: "Schema extension"
      when: "form needs extra local validation"
      rule: "schema.and(z.object({ confirm: z.boolean() }))"
    - id: FRM-C02
      name: "Masked input"
      when: "field needs phone/CPF mask"
      rule: "maskito with mask pattern"
    - id: FRM-C03
      name: "Mutation + query invalidation"
      when: "form submits data"
      rule: "mutateAsync({data}, { onSettled: () => queryClient.invalidateQueries() })"
    - id: FRM-C04
      name: "Edit form pre-populate"
      when: "edit form with existing data"
      rule: "defaultValues from fetched data"
    - id: FRM-C05
      name: "Multi-step wizard"
      when: "form has multiple steps"
      rule: "step state + per-step validation via safeParse in onSubmit (per bp-12) + shared form instance"

    # === Real-code extracted patterns (P##) ===

    # -- Form setup --
    - id: FRM-P01
      name: "DeepPartial default values"
      when: always
      rule: |
        const defaultValues: DeepPartial<CreateItemMutationRequest> = {}
        // Edit forms: DeepPartial<UpdateItemMutationRequest> = { name: item.name, ... }
      wrong: "manual interface for form defaults when DeepPartial<T> works; defining all fields explicitly for create forms"
      refs: [SignUpForm, CreatePatientDialog, CreateServiceDialog, CreateUnitDialog, CreateNoteDialog]

    - id: FRM-P02
      name: "safeParse guard in onSubmit"
      when: always
      rule: |
        onSubmit: async form => {
          const result = schema.safeParse(form.value)
          if (!result.success) return
          await mutation.mutateAsync({ data: result.data }, { onSuccess, onSettled })
        }
      wrong: "using raw form.value instead of result.data after safeParse"
      refs: [CreatePatientDialog, UpdateServiceDialog, InviteDoctorDialog]

    - id: FRM-P03
      name: "form.Subscribe safeParse-driven submit button"
      when: always
      rule: |
        <form.Subscribe selector={state => ({ canSubmit: state.canSubmit, isSubmitting: state.isSubmitting, values: state.values })}>
          {({ canSubmit, isSubmitting, values }) => {
            const isDisabled = !canSubmit || isSubmitting || mutation.isPending || !schema.safeParse(values).success
            return <Button type="submit" disabled={isDisabled}>...</Button>
          }}
        </form.Subscribe>
      wrong: "reading form.state.values directly in component body (not reactive); omitting safeParse check on submit button; OR no form.Subscribe wrapper around the submit button at all"
      refs: [CreateServiceDialog, SignUpForm, CreatePatientDialog, InviteMemberDialog]

    # -- Field rendering --
    - id: FRM-P04
      name: "Standard text field with isInvalid + FieldError"
      when: always
      rule: |
        <form.Field name="fieldName">
          {field => {
            const isInvalid = field.state.meta.isTouched && !field.state.meta.isValid
            return (
              <Field>
                <FieldLabel htmlFor={field.name}>Label</FieldLabel>
                <Input id={field.name} value={field.state.value ?? ''} onBlur={field.handleBlur}
                  onChange={e => field.handleChange(e.target.value)} aria-invalid={isInvalid} />
                {isInvalid && <FieldError errors={field.state.meta.errors} />}
              </Field>
            )
          }}
        </form.Field>
      wrong: "using data-invalid instead of aria-invalid; showing errors without isTouched guard; using FieldError without errors prop"
      refs: [UnitStep, ClinicStep, CreateServiceDialog]

    - id: FRM-P05
      name: "Combobox/Select field with || null and id for testability"
      when: "field uses Combobox or Select"
      reason: "Compound inputs must forward id={field.name} so FieldLabel htmlFor connects. This enables accessibility (screen readers) and E2E testing (getByLabel, field() scoping)."
      rule: |
        <FieldLabel htmlFor={field.name}>{t('x.field')}</FieldLabel>
        <Combobox value={field.state.value || null}
          onValueChange={value => field.handleChange(value ?? undefined)} items={ITEMS}>
          <ComboboxInput id={field.name} placeholder={t('x.placeholder')} aria-invalid={isInvalid} />
          ...
        </Combobox>
        // Select:
        <FieldLabel htmlFor={field.name}>{t('x.field')}</FieldLabel>
        <Select value={field.state.value || undefined}
          onValueChange={val => field.handleChange(val as EnumType)}>
          <SelectTrigger id={field.name} aria-invalid={isInvalid}>
            <SelectValue>...</SelectValue>  {/* see FRM-P09 — children, not placeholder */}
          </SelectTrigger>
          ...
        </Select>
      wrong: |
        // Missing id on compound input trigger
        <FieldLabel>Especialidade</FieldLabel>
        <ComboboxInput placeholder="Select..." />
        // Missing htmlFor on label
        <FieldLabel>Unidade</FieldLabel>
        <SelectTrigger aria-invalid={isInvalid}>...</SelectTrigger>
      refs: [UnitStep(state Combobox), InviteMemberDialog(role Select), UpdateServiceDialog(specialty Select)]

    - id: FRM-P09
      name: "Select trigger renders enum label via t() — Base UI gotcha"
      when: "field uses <Select> bound to an enum value"
      reason: "Base UI's <Select.Value> does NOT auto-resolve the label from the matching <Select.Item> children. Passing only `placeholder=` makes the trigger show the raw value (e.g. 'PRO') after the user picks an option. You MUST pass children that compute the translated label. See enum skill ENUM-P11."
      rule: |
        const selectedPlan = field.state.value as PlanNameEnum | undefined
        <Select value={selectedPlan} onValueChange={v => field.handleChange(v as PlanNameEnum)}>
          <SelectTrigger id={field.name} aria-invalid={isInvalid}>
            <SelectValue>
              {selectedPlan ? t(`enums.PlanName.${selectedPlan}`) : t('billing.form.planPlaceholder')}
            </SelectValue>
          </SelectTrigger>
          <SelectContent>
            {ALL_PLANS.map(plan => (
              <SelectItem key={plan} value={plan}>{t(`enums.PlanName.${plan}`)}</SelectItem>
            ))}
          </SelectContent>
        </Select>
      wrong: |
        <SelectTrigger>
          <SelectValue placeholder={t('billing.form.planPlaceholder')} />
        </SelectTrigger>
        {/* Trigger shows raw 'PRO' once a value is selected. */}

    - id: FRM-P06
      name: "DatePicker field"
      when: "field needs date input"
      rule: |
        <DatePicker
          date={field.state.value instanceof Date ? field.state.value : undefined}
          onDateChange={date => field.handleChange(date)}
          placeholder="Select date"
        />
      refs: [CreatePatientDialog]

    # -- Maskito --
    - id: FRM-P07
      name: "Maskito masked input (store digits only)"
      when: "field needs mask and backend expects clean digits"
      rule: |
        const maskRef = useMaskito({ options: phoneMaskOptions })
        <Input ref={maskRef} defaultValue={field.state.value || ''}
          onInput={e => field.handleChange(unmask(e.currentTarget.value))}
          onBlur={field.handleBlur} />
      wrong: "using onChange instead of onInput with Maskito; using value instead of defaultValue when unmasking; defining mask options inline instead of importing from @/lib/masks; defining unmask inline instead of importing from @/lib; OR no useMaskito ref at all on a field that needs masking (CPF, phone, CNPJ, CEP)"
      refs: [SignUpForm(phone,document), CreatePatientDialog(cpf,rg,phone), UnitStep(phone,zipCode), ClinicStep(cnpj)]

    - id: FRM-P08
      name: "Maskito masked input (store formatted value)"
      when: "field needs mask and backend accepts formatted value"
      rule: |
        const maskRef = useMaskito({ options: crmMaskOptions })
        <Input ref={maskRef} defaultValue={field.state.value || ''}
          onInput={e => field.handleChange(e.currentTarget.value)}
          onBlur={field.handleBlur} />
      refs: [DoctorInfoStep(crm,rqe)]

    # -- Mutation patterns --
    - id: FRM-P45
      name: "mutateAsync callback pattern"
      when: "form submits to API"
      rule: |
        await mutation.mutateAsync(
          { data: result.data },
          {
            onSuccess: () => { toast.success('...'); onSuccess?.() },
            onSettled: async () => {
              await queryClient.invalidateQueries({ queryKey: listItemsQueryKey() })
              hide() // useDialogStore — unmount clears form state (or form.formApi.reset() outside dialogs)
            },
          },
        )
      wrong: "using try/catch in mutations (MutationCache handles errors globally); destructuring mutation hooks; hardcoding query keys"
      refs: [CreatePatientDialog, UpdateUnitDialog, InviteDoctorDialog, CreateServiceDialog]

    - id: FRM-P10
      name: "Mutation hook as direct object"
      when: always
      rule: |
        const createItem = useCreateItem()
        createItem.mutateAsync(...) // direct object access
        createItem.isPending        // not destructured
      wrong: "const { mutateAsync } = useCreateItem()"
      refs: [all form files]

    # -- Dialog form --
    - id: FRM-P11
      name: "Dialog form structure — self-contained, opened via useDialogStore"
      when: "form is inside a Dialog"
      rule: |
        // Opened with show(<CreateItemDialog />); NO open/onOpenChange props — hide() unmounts (see react FRM-P35)
        export function CreateItemDialog() {
          const { hide } = useDialogStore()
          const form = useForm({ ... })
          return (
            <DialogContent>
              <DialogHeader><DialogTitle>...</DialogTitle><DialogDescription>...</DialogDescription></DialogHeader>
              <form noValidate onSubmit={e => { e.preventDefault(); e.stopPropagation(); form.handleSubmit() }}>
                <FieldGroup>...</FieldGroup>
                <DialogFooter>
                  <Button type="button" variant="outline" onClick={hide}>Cancel</Button>
                  <form.Subscribe ...>...</form.Subscribe>
                </DialogFooter>
              </form>
            </DialogContent>
          )
        }
      refs: [CreatePatientDialog, UpdateUnitDialog, CreateServiceDialog, InviteDoctorDialog, InviteMemberDialog]

    - id: FRM-P12
      name: "Dialog form reset + close on success"
      when: "create form inside a Dialog"
      rule: |
        onSettled: async () => {
          await queryClient.invalidateQueries(...)
          hide()   // useDialogStore — unmounting the dialog also clears form state
        }
      refs: [CreateUnitDialog, CreateServiceDialog, CreateNoteDialog, InviteDoctorDialog, InviteMemberDialog]

    # -- Multi-step wizard --
    - id: FRM-P13
      name: "Wizard step config (MODE_STEPS + MODE_INITIAL_STEP)"
      when: "multi-step wizard"
      rule: |
        const DOCTOR_STEPS = [StepEnum.TYPE_SELECTION, StepEnum.DOCTOR_INFO, ...] as const
        const MEMBER_STEPS = [StepEnum.TYPE_SELECTION, StepEnum.CLINIC_INFO, ...] as const
        const MODE_STEPS: Record<MemberType, readonly Step[]> = { ... }
        const MODE_INITIAL_STEP: Record<MemberType, Step> = { ... }
      refs: [onboarding/index.tsx]

    - id: FRM-P14
      name: "Zustand wizard navigation store"
      when: "multi-step wizard"
      rule: |
        // Pure UI state: selectedMode, currentStepIndex, direction (1|-1), reset()
        export const useWizardStore = create<WizardStore>()(set => ({
          selectedType: undefined,
          currentStepIndex: 0,
          direction: 1,
          ...
        }))
      refs: [useOnboardingStore.ts]

    - id: FRM-P15
      name: "Parent form holds accumulated data"
      when: "multi-step wizard"
      rule: |
        const form = useForm({ defaultValues: { ...defaultValues, ...initialState } })
        // Steps merge data via form.setFieldValue('stepKey', data)
      refs: [onboarding/index.tsx]

    - id: FRM-P16
      name: "Step schema extraction from complete mutation"
      when: "multi-step wizard"
      rule: |
        const doctorVariant = completeOnboardingMutationRequestSchema.def.options[0]
        export const ClinicStepSchema = doctorVariant.def.shape.clinicUnit.pick({ clinicName: true, clinicDocument: true })
        type ClinicStepData = (typeof ClinicStepSchema)['_zod']['output']
      wrong: "extracting step schemas from save/draft schema (all fields optional) instead of complete/strict mutation schema"
      refs: [DoctorInfoStep, ClinicStep, UnitStep]

    - id: FRM-P17
      name: "Step props contract"
      when: "multi-step wizard step component"
      rule: |
        interface StepProps {
          defaultValues?: DeepPartial<StepData>
          onSubmit: (data: StepData) => void
          onBack?: () => void
          isSubmitting?: boolean
        }
        // Step is API/store/navigation-agnostic
      refs: [DoctorInfoStep, ClinicStep, UnitStep]

    - id: FRM-P18
      name: "Form type inference via _infer helper"
      when: "step passes form instance to child components"
      rule: |
        function _inferDoctorInfoForm() {
          const defaults: DeepPartial<DoctorInfoStepData> = {}
          return useForm({ defaultValues: defaults, validators: { onChange: DoctorInfoStepSchema } })
        }
        type DoctorInfoForm = ReturnType<typeof _inferDoctorInfoForm>
        // _infer function is NEVER called — exists only for ReturnType inference
      refs: [DoctorInfoStep]

    - id: FRM-P19
      name: "Array fields with mode='array'"
      when: "form has dynamic list"
      rule: |
        <form.Field name="items" mode="array">
          {field => (
            <>
              {(field.state.value ?? []).map((_, i) => (
                <div key={i}>
                  <ItemRow form={form} index={i} />
                  {(field.state.value?.length ?? 0) > 1 && (
                    <Button variant="ghost" size="icon" onClick={() => field.removeValue(i)}>
                      <IconTrash />
                    </Button>
                  )}
                </div>
              ))}
              <Button variant="outline" size="sm" onClick={() => field.pushValue({})}>
                <IconPlus /> Add
              </Button>
            </>
          )}
        </form.Field>
      refs: [DoctorInfoStep(specialties)]

    - id: FRM-P20
      name: "Extracted field component receives form instance"
      when: "form field is extracted to a child component"
      rule: |
        function SpecialtyRqeRow({ form, index }: { form: DoctorInfoForm; index: number }) {
          return (
            <form.Field name={`specialties[${index}].specialty`}>
              {field => { ... }}
            </form.Field>
          )
        }
      refs: [DoctorInfoStep/SpecialtyRqeRow]

    - id: FRM-P21
      name: "Step handler merges data + advances + saves progress"
      when: "multi-step wizard with progressive save"
      rule: |
        const handleStepSubmit = useCallback(async (data: StepData) => {
          form.setFieldValue('stepKey', data)
          const nextIndex = currentStepIndex + 1
          setDirection(1)
          setCurrentStepIndex(nextIndex)
          await saveState.mutateAsync({
            data: { type: selectedType, currentStep: steps[nextIndex], state: { ...form.state.values, stepKey: data } },
          })
        }, [deps])
      refs: [onboarding/index.tsx(handleDoctorInfoSubmit, handleClinicSubmit)]

    - id: FRM-P22
      name: "Final step validates full payload with complete schema"
      when: "multi-step wizard final step"
      rule: |
        const payload = { type: selectedType, doctorInfo: form.state.values.doctorInfo, clinicUnit }
        const parsedData = completeOnboardingMutationRequestSchema.safeParse(payload)
        if (!parsedData.success) return
        await completeOnboarding.mutateAsync({ data: parsedData.data }, { onSuccess: ... })
      refs: [onboarding/index.tsx(handleUnitSubmit)]

    - id: FRM-P23
      name: "stepComponents record maps step to component"
      when: "multi-step wizard"
      rule: |
        const stepComponents: Record<OnboardingStep, React.ReactNode> = {
          [StepEnum.TYPE_SELECTION]: <TypeSelection ... />,
          [StepEnum.DOCTOR_INFO]: <DoctorInfoStep defaultValues={...} onSubmit={...} onBack={...} isSubmitting={...} />,
          ...
        }
        return <div>{stepComponents[currentStepName]}</div>
      refs: [onboarding/index.tsx]

    - id: FRM-P24
      name: "Number field with type='number'"
      when: "field accepts numeric input"
      rule: |
        <Input type="number" step="0.01" min="0"
          value={(field.state.value ?? 0) / 100}
          onChange={e => field.handleChange(Math.round(Number(e.target.value) * 100))} />
        // For cents-to-reais: divide by 100 for display, multiply by 100 for storage
      refs: [CreateServiceDialog(priceRange), UpdateServiceDialog(priceRange)]

    - id: FRM-P25
      name: "Schema extension with .and()"
      when: "form adds local-only fields beyond SDK schema"
      rule: |
        const signUpSchema = signUpMutationRequestSchema.and(
          z.object({
            termsAndConditions: z.boolean().refine(val => val === true, { message: '...' }),
          }),
        )
      refs: [SignUpForm]

    - id: FRM-P26
      name: "Tooltip on disabled submit button"
      when: "public-facing form needs disabled tooltip"
      rule: |
        <Tooltip>
          <TooltipTrigger render={<span><Button disabled={isDisabled} type="submit">...</Button></span>} />
          {isDisabled && <TooltipContent>Fill all fields</TooltipContent>}
        </Tooltip>
      refs: [SignUpForm]

    - id: FRM-P27
      name: "Checkbox field for terms/boolean"
      when: "form has boolean checkbox field"
      rule: |
        <form.Field name="termsAndConditions">
          {field => (
            <Checkbox checked={field.state.value}
              onCheckedChange={checked => field.handleChange(checked === true)}
              onBlur={field.handleBlur} aria-invalid={isInvalid} />
          )}
        </form.Field>
      refs: [SignUpForm]

    - id: FRM-P28
      name: "Textarea field"
      when: "field needs multiline text"
      rule: |
        <Textarea id={field.name} value={field.state.value ?? ''}
          onBlur={field.handleBlur} onChange={e => field.handleChange(e.target.value)}
          aria-invalid={isInvalid} />
      refs: [CreateNoteDialog, UpdateNoteDialog, CreateServiceDialog(description)]

    - id: FRM-P29
      name: "Complex form with extracted field components"
      when: "form has reusable field groups shared across parent/child"
      rule: |
        // Export typed field components that accept form instance + config
        // ComboboxField, AppointmentDateTimeFields receive AnyForm type
        interface AnyForm {
          Field: (props: { name: keyof FormValues; children: (field: AnyFieldApi) => React.ReactNode }) => React.ReactNode
        }
      refs: [CreateAppointmentDialog/fields.tsx]

    - id: FRM-P30
      name: "Conditional schema per mode"
      when: "form uses different schemas based on user role or mode"
      rule: |
        const validationSchema = isMember
          ? createAppointmentMutationRequestSchema
          : createDoctorAppointmentMutationRequestSchema
        // Separate safeParse per branch in onSubmit
      refs: [CreateAppointmentDialog]

    - id: FRM-P31
      name: "Zustand store for complex dialog field dependencies"
      when: "dialog form has cascading field selections"
      rule: |
        // Store tracks dependent selections: selectedDoctorId, selectedUnitId, startDateForSlots
        // Form fields call store.setSelectedX on change, triggering dependent query enables
        const handleDoctorChange = useCallback((doctorId) => {
          store.setSelectedDoctorId(doctorId)
          form.setFieldValue('serviceId', undefined) // reset dependent field
        }, [form, store])
      refs: [CreateAppointmentDialog, useAppointmentDialogStore.ts]

    - id: FRM-P32
      name: "Multiple query invalidations with Promise.all"
      when: "mutation affects multiple cached queries"
      rule: |
        onSettled: async () => {
          await Promise.all([
            queryClient.invalidateQueries({ queryKey: listMemberPatientsQueryKey() }),
            queryClient.invalidateQueries({ queryKey: listDoctorPatientsQueryKey() }),
          ])
        }
      refs: [CreatePatientDialog, UpdatePatientDialog, CreateServiceDialog, CreateUnitDialog]

    - id: FRM-P33
      name: "Nested object fields with dot notation"
      when: "form has nested object fields"
      rule: |
        <form.Field name="address.street">...</form.Field>
        <form.Field name="address.city">...</form.Field>
        <form.Field name="unitAddress.zipCode">...</form.Field>
      refs: [UnitStep, UpdateUnitDialog, CreateUnitDialog]

    - id: FRM-P34
      name: "Auth form (non-mutation, uses auth client)"
      when: "form calls auth.signIn/signUp/resetPassword instead of SDK mutation"
      rule: |
        onSubmit: async form => {
          const result = schema.safeParse(form.value)
          if (!result.success) return
          const { error } = await auth.signIn.email({ ...result.data })
          if (error) { handleApiError(error); return }
          toast.success('...')
          await navigate({ to: '/...' })
        }
      refs: [SignInForm, SignUpForm, RequestPasswordResetForm, ResetPasswordForm]

    - id: FRM-P35
      name: "Dialog form — self-contained, no open/onOpenChange props"
      when: "form is rendered inside a dialog"
      reason: "Dialogs are opened via useDialogStore.show(<DialogContent>...</DialogContent>). The dialog owns its form, mutation, and close behavior. No open/onOpenChange props needed — hide() unmounts the dialog, cleaning up form state automatically."
      rule: |
        export function CreateItemDialog() {
          const { hide } = useDialogStore()
          const form = useForm({ ... })
          return (
            <DialogContent>
              <form ...>{/* fields */}</form>
              <DialogFooter>
                <Button onClick={hide}>Cancel</Button>
                <Button type="submit">Create</Button>
              </DialogFooter>
            </DialogContent>
          )
        }
        // Called: show(<CreateItemDialog />)
      source: "CreateUnitDialog.tsx"

    - id: FRM-P36
      name: "Update dialog — receive entity as props"
      when: "dialog pre-fills form with existing entity data"
      reason: "Update dialogs receive the full entity as props (e.g., patient: PatientDetail, unit: UnitItem, service: ServiceDetail). The parent already has the data from a list or detail query, so passing it avoids an extra fetch. The dialog handles its own mutation and query invalidation."
      rule: |
        export function UpdateItemDialog({ item }: { item: ItemResponse }) {
          const { hide } = useDialogStore()
          const form = useForm({ defaultValues: { name: item.name } })
          return <DialogContent>{/* form */}</DialogContent>
        }
        // Caller: show(<UpdateItemDialog item={selectedItem} />)
      source: "UpdateUnitDialog.tsx, UpdatePatientDialog.tsx, UpdateServiceDialog.tsx"

    - id: FRM-P37
      name: "Inline confirmation via useDialogStore.confirm()"
      when: "simple confirmation before a mutation — no custom UI needed"
      reason: "For simple yes/no confirmations, creating a dedicated dialog component is overkill. useDialogStore.confirm() renders a generic ConfirmDialog and returns Promise<boolean>. Use dedicated dialog components only when you need custom UI, loading states, or domain-specific layout."
      rule: |
        const { confirm } = useDialogStore()

        const handleDelete = async () => {
          const confirmed = await confirm({
            title: 'Delete message?',
            description: 'This action cannot be undone.',
            variant: 'destructive',
          })
          if (!confirmed) return
          await deleteMutation.mutateAsync({ id })
        }
      source: "MessageActions/index.tsx, OverviewTab.tsx"

  # === Bad practices (migrated inline) ===
  bad_practices:
    - id: bp-01
      name: "Duplicating search/filter schemas instead of extending SDK"
      rule: "search schemas extend SDK schemas with .and() — never redefine"
      mechanical: false

    - id: bp-02
      name: "Complex useEffect to synchronize form with props"
      rule: "use computed defaultValues instead of useEffect that sets fields imperatively"
      wrong: |
        useEffect(() => { if (patient) { form.setFieldValue('fullName', patient.fullName || '') } }, [patient, form])
      correct: |
        const form = useForm({ defaultValues: patient ? mapPatientToFormValues(patient) : emptyFormValues })
      mechanical: true
      detect:
        - 'useEffect\([\s\S]{0,300}?\.setFieldValue\('

    - id: bp-03
      name: "Defining mask options inline instead of importing"
      rule: "always import mask options from @/lib/masks — never define inline"
      mechanical: true
      detect:
        - 'const\s+\w*[Mm]ask\w*Options\s*=\s*\{'
        - 'useMaskito\(\s*\{\s*options:\s*\{'

    - id: bp-04
      name: "Defining unmask inline"
      rule: "import unmask from @/lib — never redefine"
      mechanical: true
      detect:
        - 'const\s+unmask\s*='
        - 'function\s+unmask\b'

    - id: bp-05
      name: "Complex error logic in form validators"
      rule: "use SDK schema directly in validators.onChange — not complex safeParse + toast logic inside validators"
      mechanical: false

    - id: bp-06
      name: "Using try/catch in mutations"
      rule: "MutationCache.onError handles errors globally — use mutateAsync callback pattern (onSuccess for toast, onSettled for invalidation)"
      mechanical: true
      detect:
        - 'try\s*\{[\s\S]{0,400}?\.mutateAsync\('

    - id: bp-07
      name: "Using native HTML elements when project primitives exist"
      rule: "always use project primitives (Select, DatePicker, Combobox) — never native <select>, <input type='date'>"
      mechanical: true
      detect:
        - '<select[\s>/]'
        - '<input[^>]*type=["\x27]date["\x27]'

    - id: bp-08
      name: "Form fields without masks when applicable"
      rule: "CPF, RG, phone, CNPJ, CEP fields MUST use Maskito masks from @/lib/masks"
      mechanical: false

    - id: bp-09
      name: "Using as any in setFieldMeta for dynamic Zod paths"
      rule: "use DeepKeys<TFormData> from @tanstack/react-form instead of as any"
      mechanical: true
      detect:
        - 'setFieldMeta\([\s\S]{0,120}?as\s+any\b'
        - 'as\s+any\b'

    - id: bp-10
      name: "Verbose Zod error path conversion"
      rule: "use issue.path.map(String).join('.') — no defensive filter against symbols"
      mechanical: true
      detect:
        - '\.path\s*\.filter\('
        - '!==\s*["\x27]symbol["\x27]'

    - id: bp-11
      name: "Manual interface for form defaults when DeepPartial<T> works"
      rule: "use DeepPartial<T> to derive the type automatically instead of manual interfaces that desync"
      mechanical: false

    - id: bp-12
      name: "Using validators.onChange with partial defaults in step forms"
      rule: "when defaults are partial (undefined), use manual validation with safeParse + setFieldMeta instead of validators.onChange"
      mechanical: false

    - id: bp-13
      name: "Extracting step schemas from save/draft schema instead of complete schema"
      rule: "sub-schemas for steps must always be extracted from the final submission (complete/strict) schema"
      mechanical: false

    - id: bp-14
      name: "Destructuring mutation hooks"
      rule: "use the mutation hook as direct object (createItem.mutateAsync, createItem.isPending) — never destructure"
      mechanical: true
      detect:
        - 'const\s*\{[^}]*(mutateAsync|mutate|isPending)[^}]*\}\s*=\s*use[A-Z]\w*\('

    - id: bp-15
      name: "Default string fields to '' when using .refine()"
      rule: "string fields with .refine() must default to '' so the refine custom error shows instead of generic 'Expected string'"
      mechanical: false

    - id: bp-16
      name: "Reading form.state.values directly (not reactive)"
      rule: "always use form.Subscribe with a selector to get reactive derived values"
      mechanical: false

    - id: bp-17
      name: "Missing ?? '' on Input value props"
      rule: "when defaults are undefined, field.state.value starts as undefined — use ?? '' to keep the input controlled"
      mechanical: true
      detect:
        - 'value=\{field\.state\.value\}'

    - id: bp-18
      name: "Dialog with open/onOpenChange props instead of useDialogStore"
      severity: critical
      wrong: |
        interface CreateItemDialogProps {
          open: boolean
          onOpenChange: (open: boolean) => void
        }
        export function CreateItemDialog({ open, onOpenChange }: CreateItemDialogProps) {
          return <Dialog open={open} onOpenChange={onOpenChange}>...</Dialog>
        }
      right: |
        export function CreateItemDialog() {
          const { hide } = useDialogStore()
          return <DialogContent>...<Button onClick={hide}>Cancel</Button>...</DialogContent>
        }
        // Caller: show(<CreateItemDialog />)
      mechanical: true
      detect:
        - 'onOpenChange:\s*\(open:\s*boolean\)'
        - 'open:\s*boolean\b'
        - '<Dialog\b[^>]*onOpenChange='

    - id: bp-19
      name: "Update dialog with open/onOpenChange props instead of useDialogStore"
      severity: moderate
      wrong: |
        <UpdatePatientDialog patient={patient} open={open} onOpenChange={setOpen} />
      right: |
        show(<UpdateItemDialog item={item} />)
        // Dialog receives entity data as props and handles its own mutation/invalidation
      mechanical: true
      detect:
        - '<\w+Dialog\b[^>]*\bopen=\{[^>]*onOpenChange=\{'
        - '<\w+Dialog\b[^>]*onOpenChange=\{set'

    - id: bp-20
      name: "Manual form.formApi.reset() in dialog onSettled"
      severity: moderate
      wrong: |
        onSettled: () => { form.formApi.reset(); onOpenChange(false) }
      right: |
        onSuccess: () => { toast.success('Created'); hide() }
        // hide() unmounts dialog — form state is automatically cleaned up
      mechanical: true
      detect:
        - '\.formApi\.reset\('

  canonical_snippet: |
    import { createProductMutationRequestSchema, useCreateProduct } from '@template/client-typescript/typescript'
    const schema = createProductMutationRequestSchema
    export function CreateProductForm() {
      const createProduct = useCreateProduct()
      const defaultValues: DeepPartial<CreateProductMutationRequest> = {}
      const form = useForm({
        defaultValues,
        validators: { onChange: schema },
        onSubmit: async form => {
          const result = schema.safeParse(form.value)
          if (!result.success) return
          await createProduct.mutateAsync({ data: result.data })
        },
      })
      return (
        <form onSubmit={e => { e.preventDefault(); e.stopPropagation(); form.handleSubmit() }}>
          <form.Field name="name">
            {field => <Input value={field.state.value ?? ''} onChange={e => field.handleChange(e.target.value)} />}
          </form.Field>
          <form.Subscribe selector={state => ({ canSubmit: state.canSubmit, isSubmitting: state.isSubmitting, values: state.values })}>
            {({ canSubmit, isSubmitting, values }) => {
              const isDisabled = !canSubmit || isSubmitting || createProduct.isPending || !schema.safeParse(values).success
              return <Button type="submit" disabled={isDisabled}>Create</Button>
            }}
          </form.Subscribe>
        </form>
      )
    }

  scaffold: "bun cli form <route> <name> (--from=<sdk.path> | --fields=<spec>) [--edit] [--mutation=<hookName>] --i18n=<prefix>"
