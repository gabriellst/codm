registry:
  type: frontend
  layer: presentation
  platform: mobile
  depends_on: [primitive, route]
  depended_by: [form]
  context_reads: [route, form, primitive]

  file_patterns:
    - "packages/app/expo/app/(sheets)/**/index.tsx"
    - "packages/app/expo/app/(sheets)/**/_layout.tsx"
    - "packages/app/expo/app/_layout.tsx"   # Stack.Screen presentation registrations

  patterns:
    # --- Always patterns ---

    - id: SHT-01
      name: "Sheet route lives under app/(sheets)/<name>/"
      when: always
      rule: |
        // CORRECT location:
        packages/app/expo/app/(sheets)/<name>/index.tsx
        packages/app/expo/app/(sheets)/<name>/_layout.tsx   // optional
      wrong: "app/<name>.tsx outside (sheets), or anywhere in (tabs)"

    - id: SHT-02
      name: "Default-exported screen component"
      when: always
      rule: "export default function NameSheet() { return <View>...</View> }"

    - id: SHT-03
      name: "Stack.Screen registration in app/_layout.tsx with explicit presentation"
      when: always
      rule: |
        // app/_layout.tsx
        <Stack.Screen
          name="(sheets)/<name>"
          options={{
            presentation: 'pageSheet' /* or 'fullScreenModal' */,
            headerShown: false,
            contentStyle: { backgroundColor: surfaces.surface1 },
            /* sheet* options for pageSheet */
          }}
        />
      wrong: |
        // No presentation — the route renders as a regular pushed screen with no modal chrome
        <Stack.Screen name="(sheets)/<name>" options={{ headerShown: false }} />

    - id: SHT-04
      name: "headerShown: false on root Stack.Screen"
      when: always
      rule: |
        options: { presentation: 'pageSheet' | 'fullScreenModal', headerShown: false, ... }
      reason: "The sheet either has its own header via an inner _layout.tsx, or no header at all (pageSheet)."

    - id: SHT-05
      name: "contentStyle backgroundColor on root Stack.Screen"
      when: always
      rule: |
        contentStyle: { backgroundColor: surfaces.surface1 }
      reason: "Missing background = transparent over surfaces.bg0 = visible bleed on iOS pageSheet."

    # --- Conditional patterns ---

    - id: SHT-C01
      name: "pageSheet detents + grabber"
      when: "sheet is in-page modal (presentation: 'pageSheet')"
      rule: |
        <Stack.Screen
          name="(sheets)/<name>"
          options={{
            presentation: 'pageSheet',
            headerShown: false,
            sheetGrabberVisible: true,
            sheetAllowedDetents: [0.5, 0.95],
            sheetCornerRadius: 24,
            sheetExpandsWhenScrolledToEdge: false,
            contentStyle: { backgroundColor: surfaces.surface1 },
          }}
        />

    - id: SHT-C01b
      name: "formSheet (SDK 50+ medium-detent alias)"
      when: "sheet is a form sheet that needs to automatically resize to keyboard height (presentation: 'formSheet')"
      rule: |
        <Stack.Screen
          name="(sheets)/<name>"
          options={{
            presentation: 'formSheet',
            headerShown: false,
            sheetGrabberVisible: true,
            sheetAllowedDetents: [0.6, 0.95],
            sheetCornerRadius: 24,
            contentStyle: { backgroundColor: surfaces.surface1 },
            gestureEnabled: true,
          }}
        />
      reason: "'formSheet' is the Expo SDK 50+ alias for the medium-detent pageSheet that automatically adjusts height when the keyboard is shown. Use it for form-heavy sheets. Scaffold with --presentation=formSheet."

    - id: SHT-C02
      name: "fullScreenModal animation: slide_from_right"
      when: "sheet is a takeover flow (presentation: 'fullScreenModal')"
      rule: |
        <Stack.Screen
          name="(sheets)/<name>"
          options={{
            presentation: 'fullScreenModal',
            headerShown: false,
            animation: 'slide_from_right',
            contentStyle: { backgroundColor: surfaces.surface1 },
          }}
        />

    - id: SHT-C03
      name: "Inner _layout.tsx with back arrow for fullScreenModal"
      when: "fullScreenModal needs a header (iOS does not render one by default)"
      rule: |
        // app/(sheets)/<name>/_layout.tsx
        <Stack
          screenOptions={{
            headerShown: true,
            headerTitle: t('<name>.title'),
            headerStyle: { backgroundColor: surfaces.surface1 },
            headerTintColor: fg.fg0,
            headerTitleStyle,
            headerLeft: () => (
              <Pressable onPress={() => router.back()} accessibilityRole="button" accessibilityLabel="Back" hitSlop={12}>
                <IconBack size={22} color={fg.fg0} />
              </Pressable>
            ),
            contentStyle: { backgroundColor: surfaces.surface1 },
          }}
        />
      source: "packages/app/expo/app/(sheets)/edit-profile/_layout.tsx"

    - id: SHT-C04
      name: "Slot _layout.tsx for leaf pageSheet"
      when: "pageSheet has a single screen body and no inner navigation"
      rule: |
        // app/(sheets)/<name>/_layout.tsx
        import { Slot } from 'expo-router'
        export default function NameLayout() { return <Slot /> }
      source: "packages/app/expo/app/(sheets)/devices/_layout.tsx"

    - id: SHT-C05
      name: "Sheet-as-form wraps body in KeyboardAware + dismisses on success"
      when: "sheet body contains a form"
      rule: |
        // See /form (mobile) skill for full form patterns.
        return (
          <KeyboardAware style={{ backgroundColor: surfaces.surface1 }}>
            <ScrollView className="flex-1" keyboardShouldPersistTaps="handled">
              {/* form fields */}
            </ScrollView>
          </KeyboardAware>
        )

        onSuccess: () => {
          Haptics.notification('success')
          router.back()        // pageSheet
          // or:  router.dismiss()  // fullScreenModal
        }

    - id: SHT-C06
      name: "Multi-step sheet uses internal Stack, not separate sheet routes"
      when: "sheet has multiple steps"
      rule: |
        (sheets)/<flow>/
          ├── _layout.tsx    // Stack drives step navigation
          ├── index.tsx      // Step 1
          ├── step-2.tsx
          └── step-3.tsx
      wrong: |
        // Separate top-level sheet routes per step
        (sheets)/<flow>-step-1.tsx
        (sheets)/<flow>-step-2.tsx

    - id: SHT-C07
      name: "Route-scoped Zustand store for sheet-internal state"
      when: "sheet has draft form state or current step / selection"
      rule: |
        (sheets)/<name>/
          ├── index.tsx
          └── -stores/<x>-store.ts

    # --- Pattern references ---

    - id: SHT-P01
      name: "Open sheet via router.push with typed pathname"
      when: "component opens a sheet"
      rule: |
        import { useRouter } from 'expo-router'
        const router = useRouter()
        router.push('/(sheets)/edit-profile')
      reason: "experiments.typedRoutes catches pathname typos at compile time."

    - id: SHT-P02
      name: "Dismiss matches presentation"
      when: "dismissing the sheet"
      rule: |
        // pageSheet:
        router.back()
        // fullScreenModal (explicit):
        router.dismiss()

    - id: SHT-P03
      name: "Content-only pageSheet (devices pattern)"
      when: "pageSheet body is read-only content"
      rule: |
        export default function DevicesSheet() {
          const { t } = useTranslation()
          return (
            <View className="flex-1 px-5 pt-4 pb-6">
              <Text className="text-fg-0 font-sans-bold text-center mb-2" style={{ fontSize: fs.headerTitle }}>
                {t('profile.eyebrows.devices')}
              </Text>
              {/* body */}
            </View>
          )
        }
      source: "packages/app/expo/app/(sheets)/devices/index.tsx"

    - id: SHT-P04
      name: "Settings-list fullScreenModal (edit-profile pattern)"
      when: "sheet is a settings-list takeover"
      rule: |
        <KeyboardAware style={{ backgroundColor: surfaces.surface1 }}>
          <ScrollView className="flex-1" contentContainerStyle={{ paddingBottom: 16 }} keyboardShouldPersistTaps="handled">
            <View className="px-5 pt-6 pb-4"><Eyebrow>{t('section')}</Eyebrow></View>
            {/* rows */}
          </ScrollView>
        </KeyboardAware>
      source: "packages/app/expo/app/(sheets)/edit-profile/index.tsx"

    - id: SHT-P05
      name: "Sheet subject ownership — id param in, own fetch inside"
      when: always
      rule: |
        // Opener: passes AT MOST identifiers — never the subject object, never via a store
        router.push({ pathname: '/(sheets)/edit-item', params: { itemId } })

        // Sheet: owns its data like any component (typed param + its OWN SDK hook)
        const [{ itemId }] = useTypedSearchParams(paramsSchema)   // every field .default()-ed (RTE-04)
        const { data } = useGetItem({ id: itemId })
      wrong: |
        // Web useDrawerStore pattern carried over: opener pushes the subject into a global store
        useSheetSubjectStore.setState({ item })   // breaks deep links; reinvents the banned modal store (route bp-11)
        router.push('/(sheets)/edit-item')
      reason: "The sheet is a ROUTE: deep-linking to /(sheets)/edit-item?itemId=… must render with zero prior navigation. Sheet-internal step/draft state stays in (sheets)/<name>/-stores/ (SHT-C07); the subject always re-fetches via the SDK (React Query dedupes against the opener's cache)."

  canonical_snippet: |
    // 1. Register in app/_layout.tsx
    <Stack.Screen
      name="(sheets)/devices"
      options={{
        presentation: 'pageSheet',
        headerShown: false,
        sheetGrabberVisible: true,
        sheetAllowedDetents: [0.5, 0.95],
        sheetCornerRadius: 24,
        sheetExpandsWhenScrolledToEdge: false,
        contentStyle: { backgroundColor: surfaces.surface1 },
      }}
    />

    // 2. Body — packages/app/expo/app/(sheets)/devices/index.tsx
    import { Text, View } from 'react-native'
    import { useTranslation } from 'react-i18next'
    import { fs } from '@/lib/tokens'

    export default function DevicesSheet() {
      const { t } = useTranslation()
      return (
        <View className="flex-1 px-5 pt-4 pb-6">
          <Text className="text-fg-0 font-sans-bold text-center mb-2" style={{ fontSize: fs.headerTitle }}>
            {t('profile.eyebrows.devices')}
          </Text>
        </View>
      )
    }

    // 3. Open from any component
    import { useRouter } from 'expo-router'
    const router = useRouter()
    router.push('/(sheets)/devices')

  scaffold: "bun cli sheet <name> --i18n=<prefix> [--presentation=<pageSheet|formSheet|fullScreenModal>] [--form] [--sdk=<SchemaName>] [--multistep]"

  bad_practices:
    - id: bp-01
      name: "Using the (sheets) group for non-modal routes"
      severity: critical
      wrong: |
        app/(sheets)/settings/index.tsx   // settings is a tab, not a modal
      right: |
        app/(tabs)/settings/index.tsx     // tabs handle non-modal screens
      mechanical: false

    - id: bp-02
      name: "Stack.Screen registration without explicit presentation"
      severity: critical
      wrong: |
        <Stack.Screen name="(sheets)/devices" options={{ headerShown: false }} />
      right: |
        <Stack.Screen
          name="(sheets)/devices"
          options={{ presentation: 'pageSheet', headerShown: false, sheetGrabberVisible: true, sheetCornerRadius: 24, contentStyle: { backgroundColor: surfaces.surface1 } }}
        />
      mechanical: false

    - id: bp-03
      name: "Missing contentStyle backgroundColor"
      severity: critical
      wrong: |
        options: { presentation: 'pageSheet', headerShown: false }
      right: |
        options: { presentation: 'pageSheet', headerShown: false, contentStyle: { backgroundColor: surfaces.surface1 } }
      note: "Transparent sheet body bleeds over surfaces.bg0 on iOS."
      mechanical: false

    - id: bp-04
      name: "Calling the sheet a 'dialog' or importing a web Dialog primitive"
      severity: critical
      wrong: |
        import { Dialog } from '@/components/ui/Dialog'   // doesn't exist on mobile
        // Calling the route file Dialog<X>.tsx
      right: |
        // Sheet route in (sheets)/, or in-page Sheet primitive from @/components/ui/Sheet
      mechanical: true
      detect:
        - 'from\s+[''"]@/components/ui/Dialog[''"]'

    - id: bp-05
      name: "Sheet body forgets KeyboardAware when it has text inputs"
      severity: critical
      wrong: |
        <View><Input ... /><Button ... /></View>
      right: |
        <KeyboardAware><View className="flex-1 px-5 gap-4"><Input ... /><Button ... /></View></KeyboardAware>
      mechanical: false

    - id: bp-06
      name: "Sheet-as-form does not dismiss after success"
      severity: critical
      wrong: |
        onSuccess: () => Haptics.notification('success')   // user stuck inside the sheet
      right: |
        onSuccess: () => { Haptics.notification('success'); router.back() /* or router.dismiss() */ }
      mechanical: false

    - id: bp-07
      name: "Hand-rolled string href instead of typed pathname"
      severity: moderate
      wrong: |
        router.push('/sheets/edit-profile')   // wrong path; typedRoutes won't help
      right: |
        router.push('/(sheets)/edit-profile')
      mechanical: true
      detect:
        - '\.push\(\s*[''"]/sheets/'

    - id: bp-08
      name: "Multi-step sheet implemented as N separate sheet routes"
      severity: moderate
      wrong: |
        (sheets)/onboarding-step-1.tsx
        (sheets)/onboarding-step-2.tsx
      right: |
        (sheets)/onboarding/
          ├── _layout.tsx
          ├── index.tsx
          ├── step-2.tsx
          └── step-3.tsx
      mechanical: false

    - id: bp-09
      name: "Inner _layout.tsx tries to set sheet* options"
      severity: moderate
      wrong: |
        // app/(sheets)/<name>/_layout.tsx — wrong place for sheetCornerRadius etc.
        <Stack screenOptions={{ presentation: 'pageSheet', sheetCornerRadius: 24 }} />
      right: |
        // Sheet presentation options belong on the ROOT app/_layout.tsx Stack.Screen entry.
        // Inner _layout.tsx is for the sheet's INNER navigation (back arrow, title).
      mechanical: true
      detect:
        - 'screenOptions=\{\{[^}]*sheetCornerRadius'

    - id: bp-10
      name: "headerSearchBarOptions used on a pageSheet route"
      severity: critical
      wrong: |
        <Stack.Screen
          name="(sheets)/search"
          options={{
            presentation: 'pageSheet',
            headerSearchBarOptions: { placeholder: 'Buscar...' },  // won't render
          }}
        />
      right: |
        // Use a JS TextInput inside the sheet body, or change presentation to a full screen
        // headerSearchBarOptions conflicts with presentation: 'pageSheet'
      mechanical: false

    - id: bp-11
      name: "Installing native module without a prebuild / dev-client rebuild"
      severity: critical
      wrong: |
        // package.json adds expo-localization or react-native-gesture-handler
        // → app crashes at runtime: "Cannot find native module 'ExpoLocalization'"
      right: |
        // Before installing any native module:
        // 1. Verify it's in Expo's supported module list
        // 2. Run `npx expo prebuild` (or trigger EAS build) to re-autolinking
        // 3. Rebuild the dev client before testing on device
      note: "V-4 rule: native modules require autolinking + a dev-client rebuild. Warn the user before installing."
      mechanical: false
