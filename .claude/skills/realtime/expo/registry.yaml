skill: realtime
platform: expo
depends_on: [component, store]
context_reads:
  - packages/app/react/CLAUDE.md
  - packages/app/expo/lib/use-server-events.ts

patterns:
  - id: RTM-01
    name: "Connection mounted once; components only subscribe"
    when: always
    rule: "useServerEventSource() lives in <ServerEventsMount/> in the authed (tabs) layout — exactly one mount. Screens call useServerEvents(name, cb) only."
    wrong: "useServerEventSource() / new EventSource() inside a screen or section component"
  - id: RTM-02
    name: "Guard-then-invalidate; invalidate the SDK query key"
    when: "a screen must react live to a server event"
    rule: "useServerEvents(name, () => queryClient.invalidateQueries({ queryKey: xxxQueryKey() })). Guard by payload scope first ONLY for sub-store ids."
    wrong: "queryClient.setQueryData(...) / manual cache mutation / refetchInterval polling for an event-backed query"
  - id: RTM-03
    name: "Event names are the SDK-typed union"
    when: always
    rule: "name: ServerEventName = ListenEventsQueryResponse['name']. Subscribing to a concrete name narrows event.payload to that member."
    wrong: "name typed as string / a hand-written event-name literal not in the SDK union"

bad_practices:
  - id: bp-rtm-01
    name: "Polling a query that has a server event"
    severity: high
    wrong: "useListOperationalCosts({ ... }, { query: { refetchInterval: 5000 } })"
    right: "useServerEvents('…operational_cost_recorded', () => queryClient.invalidateQueries({ queryKey: listOperationalCostsQueryKey() }))"
    reason: "An event-backed list must refresh from the event, not a timer — polling is wasteful and stale-by-design."
    mechanical: true
    detect:
      - 'refetchInterval'
  - id: bp-rtm-02
    name: "Manual cache mutation instead of invalidation"
    severity: high
    wrong: "useServerEvents(name, e => queryClient.setQueryData(key, prev => [...prev, e.payload]))"
    right: "useServerEvents(name, () => queryClient.invalidateQueries({ queryKey: key }))"
    reason: "setQueryData reconstructs the read model client-side and drifts from the backend. Invalidate; let the query refetch."
    mechanical: true
    detect:
      - 'useServerEvents\([^)]*setQueryData'
  - id: bp-rtm-03
    name: "Mounting the connection in a component"
    severity: critical
    wrong: "a screen/section calling useServerEventSource() or new EventSource(...)"
    right: "<ServerEventsMount/> in the authed (tabs) layout — exactly one mount"
    reason: "N components mounting the connection = N SSE sockets per store. The connection is a singleton at the layout."
    mechanical: false
