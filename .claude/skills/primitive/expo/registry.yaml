registry:
  type: frontend
  layer: presentation
  platform: mobile
  depends_on: []
  depended_by: [component, form]
  context_reads: []

  patterns:
    # --- Structural Rules (PRM-01..PRM-04) ---
    - id: PRM-01
      name: "CVA variants"
      when: "component has size/variant props"
      rule: "const variants = cva('base-classes', { variants: { size, variant, fullWidth, ... } })"

    - id: PRM-02
      name: "forwardRef<View, Props>"
      when: "primitive wraps Pressable / View / TextInput AND may be animated or composed"
      rule: "export const X = forwardRef<View, Props>(function X(..., ref) => <Pressable ref={ref} ... />)"
      severity_guidance: >
        critical for interactive primitives (Button, Card when composed with Animated, Sheet content wrappers).
        low for purely decorative wrappers (background pattern primitives) where consumers never need a ref.

    - id: PRM-03
      name: "Tokens from packages/app/expo/lib/tokens.ts"
      when: always
      rule: >
        Colors / radius / spacing come from tokens via Uniwind classes (bg-bg-0, text-fg-0, rounded-pill).
        When forced to use `style={{}}` (gradients, shadows, exact letter-spacing), import the value
        from `@/lib/tokens` — never inline a hex code.
      wrong: >
        style={{ backgroundColor: '#0A0A0B' }} or className="bg-[#0A0A0B]"
      note: >
        Uniwind utilities that the project already maps (`bg-surface-1`, `text-fg-2`, `border-white/[0.16]`,
        `rounded-pill`, `h-12`, `gap-2`, etc.) ARE the design tokens. They are NOT violations.

    - id: PRM-04
      name: "Props extend the underlying RN component"
      when: always
      rule: >
        interface Props extends ViewProps / TextProps / Omit<PressableProps, 'children' | 'style'> { ... }
        plus VariantProps<typeof variants>.

    # --- Conditional Rules (PRM-C01..PRM-C02) ---
    - id: PRM-C01
      name: "Uniwind className on RN primitive"
      when: "wrapping a react-native primitive"
      rule: "import { Pressable | View | Text | TextInput } from 'react-native' and pass className"

    - id: PRM-C02
      name: "Default variant"
      when: "component has variants"
      rule: "defaultVariants: { variant: 'default', size: 'md' }"

    # --- Extracted Real-Code Patterns (PRM-P01..PRM-P10) ---
    - id: PRM-P01
      name: "Simple View wrapper with className + cn"
      when: always
      rule: >
        export function Component({ className, ...props }: ViewProps & { className?: string }) {
          return <View data-slot="component-name" className={cn('...', className)} {...props} />
        }
      examples: [Card.tsx (CardHeader, CardBody), Separator.tsx, Eyebrow.tsx]

    - id: PRM-P02
      name: "Animated Pressable for press feedback"
      when: "primitive is tactile / interactive (Button, Pill, Card-as-button)"
      rule: >
        const AnimatedPressable = Animated.createAnimatedComponent(Pressable)
        const { animatedStyle, onPressIn, onPressOut } = useAnimatedPress({ opacityTo: 0.8 })
        <AnimatedPressable ref={ref} onPressIn={onPressIn} onPressOut={onPressOut} style={animatedStyle} />
      reason: "Keeps Pressable as the outermost element (preserving ref + layout box) while animating transform/opacity natively."
      examples: [Button.tsx]

    - id: PRM-P03
      name: "Sheet primitive (Modal + Animated + LinearGradient)"
      when: "building a bottom-sheet primitive"
      rule: >
        <Modal transparent animationType="none" onRequestClose={onClose} statusBarTranslucent>
          <Animated.View style={[StyleSheet.absoluteFill, { opacity: overlayOpacity }]}>
            <Pressable className="flex-1 bg-black/60" onPress={onClose} accessibilityLabel="Fechar" />
          </Animated.View>
          <Animated.View className={cn(sheetVariants({ size }), className)} style={[{ transform: [{ translateY }] }, shadow]}>
            <LinearGradient colors={[surfaces.surface2, surfaces.bg0]} style={StyleSheet.absoluteFill} />
            <View className="w-10 h-1 rounded-md bg-white/20 self-center mb-3.5" />  {/* grabber */}
            {children}
          </Animated.View>
        </Modal>
      examples: [Sheet.tsx]

    - id: PRM-P04
      name: "Compound primitive with named exports"
      when: always
      rule: >
        export { Card, CardHeader, CardBody } — never Card.Header.
      wrong: "export default or Component.SubComponent dot-notation"
      examples: [Card.tsx, Input.tsx (Input + InputPrefix + InputSuffix + InputGroup)]

    - id: PRM-P05
      name: "forwardRef with named function targeting View"
      when: "primitive can be animated or composed via Animated.createAnimatedComponent"
      rule: >
        export const Component = forwardRef<View, Props>(function Component({ ..., className }, ref) {
          return <Pressable ref={ref} className={cn(variants({ ... }), className)} />
        })
      wrong: "forwardRef<HTMLButtonElement> — there is no DOM on mobile"

    - id: PRM-P06
      name: "Haptics on tactile actions"
      when: "primitive triggers a meaningful action (button press, toggle, swipe-confirm)"
      rule: >
        import { Haptics } from 'react-native-nitro-haptics'
        // inside onPress
        Haptics.impact('medium')
      examples: [Button.tsx]

    - id: PRM-P07
      name: "LinearGradient for surfaces Uniwind cannot express"
      when: "primitive needs a multi-stop gradient (chrome button, hero vignette, sheet body)"
      rule: >
        import { LinearGradient } from 'expo-linear-gradient'
        import { gradients } from '@/lib/tokens'
        <LinearGradient colors={gradients.chrome} start={{ x: 0.5, y: 0 }} end={{ x: 0.5, y: 1 }} style={{ position: 'absolute', inset: 0, borderRadius: 9999 }} />
      examples: [Button.tsx (chrome), Sheet.tsx]

    - id: PRM-P08
      name: "BlurView underlay for translucent surfaces"
      when: "primitive sits on a translucent / glassy background (ghost button on busy art, header)"
      rule: >
        import { BlurView } from 'expo-blur'
        <BlurView intensity={24} tint="dark" style={StyleSheet.absoluteFill} pointerEvents="none" />
      examples: [Button.tsx (ghost/success/destructive)]

    - id: PRM-P09
      name: "Inline RN shadow via style"
      when: "primitive needs a directional / heavy shadow Tailwind can't express"
      rule: >
        style={[{ shadowColor: '#000', shadowOpacity: 0.4, shadowRadius: 24, shadowOffset: { width: 0, height: 8 }, elevation: 6 }]}
        // Or import from tokens: shadow.chrome / shadow.pop / shadow.card
      examples: [Button.tsx (chrome), Sheet.tsx]
      note: >
        RN's shadow API is single-layer and platform-different. Uniwind can't serialize composite shadows,
        so this is an accepted escape hatch. Prefer values from `shadow.*` in tokens.ts.

    - id: PRM-P10
      name: "Accessibility label on icon-only Pressables"
      when: "Pressable has no visible text (icon-only buttons, close affordances, list-row actions)"
      rule: >
        <Pressable accessibilityLabel="Fechar" hitSlop={10} onPress={onClose}>
          <IconClose size={iconSize.xl} color={fg.fg0} />
        </Pressable>
      examples: [Sheet.tsx (close button + backdrop)]

  bad_practices:
    - id: bp-01
      name: "Using StyleSheet.create for static styling"
      severity: critical
      wrong: |
        const styles = StyleSheet.create({ card: { backgroundColor: '#16161A', padding: 16 } })
        <View style={styles.card} />
      right: |
        <View className="bg-surface-1 p-4" />
      note: >
        Uniwind className is the default. `style={...}` is reserved for things Uniwind can't express
        (gradients via LinearGradient, shadows, transforms, exact letter-spacing in points).
      mechanical: true
      detect:
        - 'StyleSheet\.create\('

    - id: bp-02
      name: "Hardcoded hex colors instead of tokens"
      severity: critical
      wrong: |
        className="bg-[#0A0A0B]"
        style={{ color: '#FFFFFF' }}
      right: |
        // Uniwind class mapped to the token
        className="bg-bg-0 text-fg-0"
        // OR, when style is required:
        import { surfaces, fg } from '@/lib/tokens'
        style={{ backgroundColor: surfaces.bg0, color: fg.fg0 }}
      mechanical: true
      detect:
        - 'bg-\[#[0-9A-Fa-f]+\]'
        - '(?:backgroundColor|color|borderColor):\s*[''"]#[0-9A-Fa-f]{3,8}'

    - id: bp-03
      name: "Missing forwardRef on a tactile primitive"
      severity: critical
      wrong: |
        export function Button({ ... }: ButtonProps) {
          return <Pressable ... />
        }
      right: |
        export const Button = forwardRef<View, ButtonProps>(function Button({ ... }, ref) {
          return <Pressable ref={ref} ... />
        })
      mechanical: false

    - id: bp-04
      name: "Multiple primitives for one family (ChromeButton + GhostButton + ...)"
      severity: critical
      wrong: |
        // Separate files: ChromeButton.tsx, GhostButton.tsx, DestructiveButton.tsx
      right: |
        // One Button.tsx with cva variants: chrome | ghost | destructive | link | ...
      mechanical: false

    - id: bp-05
      name: "Using the word 'dialog' or building a DOM-style modal on mobile"
      severity: critical
      wrong: |
        // Importing Dialog from a web primitive lib OR naming a primitive "Dialog"
      right: |
        // Use the Sheet primitive for in-page modals, or a (sheets)/* route for native iOS pageSheet.
      mechanical: true
      detect:
        - 'import\s*\{[^}]*\bDialog\b'
        - '\b(?:export\s+)?(?:const|function)\s+\w*Dialog\b'

    - id: bp-06
      name: "Missing accessibilityLabel on icon-only Pressables"
      severity: critical
      wrong: |
        <Pressable onPress={onClose}><IconClose /></Pressable>
      right: |
        <Pressable onPress={onClose} accessibilityLabel="Fechar"><IconClose /></Pressable>
      mechanical: false

    - id: bp-07
      name: "Ad-hoc className?: string instead of extending root RN props interface"
      severity: critical
      wrong: |
        interface ButtonProps { label?: string; className?: string }  // ad-hoc, no ...rest
      right: |
        interface ButtonProps
          extends Omit<PressableProps, 'children' | 'style'>,
            VariantProps<typeof buttonVariants> {
          label?: string
          className?: string
        }
        // Then spread ...props so all PressableProps pass through
      note: "The root RN props interface (PressableProps / ViewProps / TextInputProps) must be extended so that `className` and `...rest` are part of the contract, not bolted on."
      mechanical: false

    - id: bp-08
      name: "@expo/ui SwiftUI bridge used without <Host> wrapper"
      severity: critical
      wrong: |
        import { Picker } from '@expo/ui/swift-ui'
        <Picker ... />   // crashes: native component must be wrapped
      right: |
        import { Host, Picker, Section, Form } from '@expo/ui/swift-ui'
        <Host><Form><Section><Picker ... /></Section></Form></Host>
      mechanical: true
      detect:
        - 'from\s+[''"]@expo/ui/swift-ui[''"]'
      detect_skip: '\bHost\b'

    - id: bp-09
      name: "systemImage rendered without a label prop"
      severity: critical
      wrong: |
        <Button systemImage="star.fill" />   // icon doesn't render
      right: |
        <Button systemImage="star.fill" label="Favorite" />
      mechanical: true
      detect:
        - '<[A-Za-z]\w*[^>]*\bsystemImage=(?:(?!label=)[^>])*>'

    - id: bp-10
      name: "Passing both label and children to a SwiftUI Button"
      severity: critical
      wrong: |
        <Button label="Save" systemImage="checkmark">Save</Button>  // renders both texts
      right: |
        <Button label="Save" systemImage="checkmark" accessibilityLabel="Save" />
      mechanical: true
      detect:
        - '<Button\b[^>]*\blabel="[^"]*"[^>]*>[^<\s/]'

    - id: bp-11
      name: "Raw string into bridge prop (footer / title) crashes"
      severity: critical
      wrong: |
        <Section footer="Tap to continue" />   // crashes: Text strings must be in <Text>
      right: |
        <Section footer={<Text>Tap to continue</Text>} />
      mechanical: true
      detect:
        - '\bfooter="'

    - id: bp-12
      name: "frame() called before buttonStyle('glass')"
      severity: moderate
      wrong: |
        <Button style={s => s.frame({ width: 120 }).buttonStyle('glass')} />
      right: |
        <Button style={s => s.buttonStyle('glass').frame({ width: 120 })} />
      note: "frame() must come AFTER buttonStyle('glass') for equal-size glass buttons."
      mechanical: true
      detect:
        - '\.frame\([^)]*\)\.buttonStyle\([''"]glass[''"]\)'

    - id: bp-13
      name: "Picker without Form > Section wrapper"
      severity: critical
      wrong: |
        <Host><Picker pickerStyle="wheel" ... /></Host>   // gestures not forwarded
      right: |
        <Host><Form><Section><Picker pickerStyle="wheel" ... /></Section></Form></Host>
      mechanical: true
      detect:
        - '<Host>\s*<Picker\b'

    - id: bp-14
      name: "Wrapping native SwiftUI components in Pressable"
      severity: critical
      wrong: |
        <Pressable onPress={onSelect}>
          <Host><Button ... /></Host>
        </Pressable>   // Pressable intercepts native gesture stream
      right: |
        // Use sibling absolute backdrop + Sheet View instead of nesting in Pressable
      mechanical: true
      detect:
        - '<Pressable\b[^>]*>\s*<Host\b'

    - id: bp-15
      name: "Using glass tint as a selection indicator"
      severity: moderate
      wrong: |
        <Button style={s => s.buttonStyle('glass').tint(isSelected ? '#fff' : 'transparent')} />
      right: |
        // Use an outer border ring or glassProminent style for selection
        <Button style={s => isSelected ? s.buttonStyle('glassProminent') : s.buttonStyle('glass')} />
      mechanical: false

    - id: bp-16
      name: "SwiftUI press flicker blamed on React re-renders (wrong diagnosis)"
      severity: moderate
      wrong: |
        // Adding useMemo to fix press flicker on a glass button
        const style = useMemo(() => s.buttonStyle('glass'), [])
      right: |
        // The flicker comes from the default Button style competing with glassEffect({interactive:true})
        // Fix by explicitly setting glassEffect, not by memoizing
        <Button style={s => s.buttonStyle('glass').glassEffect({ interactive: true })} />
      mechanical: false

    - id: bp-17
      name: "CSS token class used before the token exists in global.css"
      severity: critical
      wrong: |
        className="bg-accent-danger/10"
        // but --color-accent-danger is not defined in global.css → invisible element
      right: |
        /* global.css — define the token first */
        :root { --color-accent-danger: 239 68 68; }
        /* then use the class */
        className="bg-accent-danger/10"
      mechanical: false

    - id: bp-18
      name: "bare flex collapses container to content height in RN/NativeWind"
      severity: critical
      wrong: |
        <View className="flex bg-surface-1">   // collapses to content height
      right: |
        <View className="flex-1 bg-surface-1">  // fills available space
      mechanical: true
      detect:
        - 'className="[^"]*\bflex\b(?!-)'

    - id: bp-19
      name: "borderStyle:'dashed' with borderRadius clips corners in RN"
      severity: moderate
      wrong: |
        <View style={{ borderStyle: 'dashed', borderRadius: 12, borderWidth: 1 }} />   // clips corners
      right: |
        import Svg, { Rect } from 'react-native-svg'
        // Draw dashed outline with SVG; set explicit width/height/viewBox on <Svg>
      mechanical: true
      detect:
        - 'borderStyle:\s*[''"]dashed[''"][^}]*borderRadius'
        - 'borderRadius[^}]*borderStyle:\s*[''"]dashed[''"]'

  canonical_snippet: |
    import { forwardRef } from 'react'
    import { Animated, Pressable, type PressableProps, View } from 'react-native'
    import { cva, type VariantProps } from 'class-variance-authority'
    import { Haptics } from 'react-native-nitro-haptics'
    import { cn } from '@/lib/utils'
    import { useAnimatedPress } from '@/lib/use-animated-press'

    const AnimatedPressable = Animated.createAnimatedComponent(Pressable)

    const buttonVariants = cva('flex-row items-center justify-center gap-2 rounded-pill', {
      variants: {
        variant: {
          chrome: '',
          ghost: 'border border-white/[0.16] bg-transparent',
          destructive: 'bg-accent-danger/10 border border-accent-danger/40',
        },
        size: { sm: 'h-10 px-5', md: 'h-12 px-6', lg: 'h-14 px-7' },
        fullWidth: { true: 'w-full', false: '' },
      },
      defaultVariants: { variant: 'chrome', size: 'md', fullWidth: false },
    })

    interface ButtonProps
      extends Omit<PressableProps, 'children' | 'style'>,
        Pick<VariantProps<typeof buttonVariants>, 'variant' | 'size' | 'fullWidth'> {
      label?: string
      leading?: React.ReactNode
      className?: string
    }

    export const Button = forwardRef<View, ButtonProps>(function Button(
      { label, leading, variant, size, fullWidth, className, onPress, disabled, ...props }, ref,
    ) {
      const { animatedStyle, onPressIn, onPressOut } = useAnimatedPress({ opacityTo: 0.8 })
      const handlePress: PressableProps['onPress'] = e => {
        if (disabled) return
        Haptics.impact('medium')
        onPress?.(e)
      }
      return (
        <AnimatedPressable
          ref={ref}
          onPress={handlePress}
          onPressIn={onPressIn}
          onPressOut={onPressOut}
          disabled={disabled}
          className={cn(buttonVariants({ variant, size, fullWidth }), disabled && 'opacity-40', className)}
          style={animatedStyle}
          {...props}
        >
          {leading}
          {label ? <Text className="font-sans-bold uppercase">{label}</Text> : null}
        </AnimatedPressable>
      )
    })

  # Canonical primitive shell — what `bun cli primitive <Name>` emits.
  # Shape matches berzerk-club/feat/training-collaboration's real expo patterns.
  # The default (`plain`) is `export function Name({ className, ... })` — matches
  # the majority of primitives there (Separator, Eyebrow, Input, CardHeader, ...).
  # `--with-ref` opts into the `forwardRef<View, Props>` shape for primitives that
  # need ref forwarding (interactive: Button, Card, Pill, GradientCard, StatCard —
  # anything composed with `Animated.createAnimatedComponent`).
  # Bindings are computed by the expo primitive assembler
  # (scripts/cli/expo/artifacts/primitive.ts) and passed to
  # renderArtifact('primitive', 'expo', …).
  snippet:
    # Default — plain `export function`. Matches berzerk's majority pattern
    # (Separator, Eyebrow, Input, CardHeader, …) and the expo component generator.
    skeleton: |
      {{imports}}

      const {{camel}}Variants = cva('', {
      	variants: {
      {{variantBlock}}
      	},
      	defaultVariants: { {{defaults}} },
      })

      interface {{Pascal}}Props extends ViewProps, VariantProps<typeof {{camel}}Variants> {}

      export function {{Pascal}}({ className, {{variantPropKeys}}, ...props }: {{Pascal}}Props) {
      	return <View className={cn({{variantsCall}}, className)} {...props} />
      }

      export { {{camel}}Variants }
    skeletons:
      # `--with-ref` opt-in for interactive primitives that need ref forwarding
      # (Button, Card, Pill, GradientCard, StatCard — anything composed with
      # `Animated.createAnimatedComponent`).
      with-ref: |
        {{imports}}

        const {{camel}}Variants = cva('', {
        	variants: {
        {{variantBlock}}
        	},
        	defaultVariants: { {{defaults}} },
        })

        interface {{Pascal}}Props extends ViewProps, VariantProps<typeof {{camel}}Variants> {}

        export const {{Pascal}} = forwardRef<View, {{Pascal}}Props>(function {{Pascal}}(
        	{ className, {{variantPropKeys}}, ...props },
        	ref,
        ) {
        	return (
        		<View
        			ref={ref}
        			className={cn({{variantsCall}}, className)}
        			{...props}
        		/>
        	)
        })

        export { {{camel}}Variants }

  scaffold: "bun cli primitive <name>"
